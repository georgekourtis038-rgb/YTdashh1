          <span class="pe-add-wr-label">Reps</span>
          <div class="pe-add-wr-inner">
            <button class="pe-add-wr-btn" id="peAddRpDown" type="button">−</button>
            <input type="number" id="peAddReps" class="pe-add-wr-num"
              value="8" inputmode="numeric">
            <button class="pe-add-wr-btn" id="peAddRpUp" type="button">+</button>
          </div>
          <span class="pe-add-wr-unit">reps</span>
        </div>
      </div>
      <button class="pe-add-set-btn" id="peAddSetBtn" type="button">Add Set</button>
    </div>

    <div class="po-modal-actions" style="margin-top:14px">
      <button class="po-btn-secondary" id="pastEditClose" style="width:100%;padding:13px">Done</button>
    </div>
  </div>
</div>

<script>
(function() {
  // ============================================================
  // STATE — all logs + edits live in browser localStorage. Each
  // device has its own copy. Export JSON from settings if you
  // want to back up or move to another device.
  // ============================================================
  const LS_KEY = 'po_coach_v1';

  function buildDefaultExercises() {
    return CONFIG.defaultExercises.map((e, i) => Object.assign({
      id: 'seed_' + i + '_' + Date.now()
    }, e));
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) return normalize(JSON.parse(raw));
    } catch (e) {}
    return normalize({});
  }
  function normalize(s) {
    s = s || {};
    s.units = s.units || CONFIG.units || 'kg';
    s.gyms  = (Array.isArray(s.gyms)  && s.gyms.length)  ? s.gyms  : CONFIG.gyms.slice();
    s.days  = (Array.isArray(s.days)  && s.days.length)  ? s.days  : CONFIG.days.slice();
    s.exercises = Array.isArray(s.exercises) ? s.exercises : buildDefaultExercises();
    s.logs = (s.logs && typeof s.logs === 'object') ? s.logs : {};
    s.filterGym = s.filterGym || s.gyms[0].id;
    s.filterDay = s.filterDay || s.days[0].id;
    // Split rotation lives in state so the user can edit it via the pill modal.
    // Stored as a plain array of names (e.g. ["Push", "Pull", "Legs", "Rest"]).
    if (!Array.isArray(s.splitRotation) || !s.splitRotation.length) {
      s.splitRotation = (CONFIG.splitRotation || ['Push', 'Pull', 'Legs', 'Rest']).map(x =>
        // CONFIG used ids — map id → display name where possible
        (CONFIG.days || []).find(d => d.id === x) ? (CONFIG.days.find(d => d.id === x).name) :
        (x === 'rest' ? 'Rest' : x.charAt(0).toUpperCase() + x.slice(1))
      );
    }
    if (!s.splitAnchor || !s.splitAnchor.date || s.splitAnchor.index == null) {
      // Map old anchor-by-id to new anchor-by-index, or default to today=index 0.
      const oldId = (CONFIG.splitAnchor && CONFIG.splitAnchor.splitId) || null;
      let idx = 0;
      if (oldId) {
        const oldName = (CONFIG.days || []).find(d => d.id === oldId);
        const targetName = oldName ? oldName.name : (oldId === 'rest' ? 'Rest' : oldId);
        const found = s.splitRotation.findIndex(n => n.toLowerCase() === targetName.toLowerCase());
        if (found >= 0) idx = found;
      }
      s.splitAnchor = {
        date: (CONFIG.splitAnchor && CONFIG.splitAnchor.date) || wlTodayKey(),
        index: idx
      };
    }
    return s;
  }
  function saveState() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
    try { pcSchedulePush(); } catch (e) {}
  }
  let state = loadState();
  document.getElementById('appTitle').textContent = CONFIG.appTitle || 'Workout Logger';

  // ── Helpers ──────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  function unit() { return state.units; }
  function uid() { return 'ex_' + Date.now() + '_' + Math.floor(Math.random() * 9999); }
  function estimate1RM(w, r) { if (r < 2) return w; return w * (1 + r / 30); }
  function escape(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ── Day pill ─────────────────────────────────────────────────
  function todaySplit() {
    try {
      const rot = state.splitRotation;
      if (!rot || !rot.length) return { name: '—', index: 0 };
      const a = new Date(state.splitAnchor.date);
      const t = new Date();
      a.setHours(0,0,0,0); t.setHours(0,0,0,0);
      const diffDays = Math.round((t - a) / 86400000);
      const idx = ((state.splitAnchor.index + diffDays) % rot.length + rot.length) % rot.length;
      return { name: rot[idx], index: idx };
    } catch (e) {
      return { name: (state.splitRotation && state.splitRotation[0]) || '—', index: 0 };
    }
  }
  function isRestName(n) { return /^rest\b/i.test(n || ''); }
  function renderDayPill() {
    const d = new Date();
    const dows = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    const mons = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    $('dayPillDate').textContent = dows[d.getDay()] + ', ' + mons[d.getMonth()] + ' ' + d.getDate();
    const sp = todaySplit();
    const el = $('dayPillSplit');
    el.textContent = (isRestName(sp.name) ? 'REST DAY' : (sp.name + ' DAY')).toUpperCase();
    el.classList.toggle('is-rest', isRestName(sp.name));
  }

  // ── Workout done tracking ─────────────────────────────────────
  const WORKOUT_DONE_KEY = 'po_coach_workout_done';
  function loadDoneDays() {
    try { const r = localStorage.getItem(WORKOUT_DONE_KEY); return r ? JSON.parse(r) : {}; }
    catch (e) { return {}; }
  }
  function saveDoneDays(d) {
    try { localStorage.setItem(WORKOUT_DONE_KEY, JSON.stringify(d)); } catch (e) {}
    try { pcSchedulePush(); } catch (e) {}
  }
  let doneDays = loadDoneDays();

  // ── Log helpers ───────────────────────────────────────────────
  function wlTodayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function logsByDay() {
    const bySess = {};
    state.exercises.forEach(ex => {
      (state.logs[ex.id] || []).forEach(l => {
        const key = l.sid || l.date.slice(0, 10);
        if (!bySess[key]) bySess[key] = [];
        bySess[key].push({ ex, log: l });
      });
    });
    return bySess;
  }
  function fmtPastDate(key) {
    const dows = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    const mons = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    if (key.length > 10) {
      const dateStr = key.slice(0, 10);
      const h = parseInt(key.slice(11, 13), 10);
      const min = key.slice(14, 16);
      const ampm = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 || 12;
      const timeLabel = h12 + ':' + min + ' ' + ampm;
      if (dateStr === wlTodayKey()) return 'Today · ' + timeLabel;
      const [y, mo, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, mo - 1, d);
      return dows[dt.getDay()] + ' ' + mons[dt.getMonth()] + ' ' + d + ' · ' + timeLabel;
    }
    const [y, m, d] = key.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return dows[dt.getDay()] + ' ' + mons[dt.getMonth()] + ' ' + dt.getDate();
  }
  function summarizeDay(daySets) {
    const byEx = {};
    daySets.forEach(({ex, log}) => {
      if (!byEx[ex.id]) byEx[ex.id] = { ex, sets: [], vol: 0 };
      byEx[ex.id].sets.push(log);
      byEx[ex.id].vol += (log.weight || 0) * (log.reps || 0);
    });
    const perEx = Object.values(byEx);
    return {
      perEx,
      totalSets: perEx.reduce((s, e) => s + e.sets.length, 0),
      totalVol:  perEx.reduce((s, e) => s + e.vol, 0)
    };
  }

  // ── Past workouts ─────────────────────────────────────────────
  function renderPastWorkouts() {
    const today = wlTodayKey();
    const all = logsByDay();
    const past = Object.entries(all)
      .filter(([key]) => key.length > 10 || key !== today)
      .sort((a, b) => b[0].localeCompare(a[0]));
    $('poTwPastCount').textContent = past.length;
    const body = $('poTwPastBody');
    if (!past.length) {
      body.innerHTML = '<div class="po-tw-past-empty">No past workouts yet.</div>';
      return;
    }
    const u = state.units;
    body.innerHTML = past.slice(0, 30).map(([key, sets]) => {
      const sum = summarizeDay(sets);
      const exNames = sum.perEx.map(e => e.ex.name).slice(0, 3).join(', ')
        + (sum.perEx.length > 3 ? '…' : '');
      return '<div class="po-tw-past-day">'
        + '<div class="po-tw-past-day-h">'
        +   '<span class="po-tw-past-day-date">' + fmtPastDate(key) + '</span>'
        +   '<span class="po-tw-past-day-summary">'
        +     sum.totalSets + ' sets · ' + Math.round(sum.totalVol).toLocaleString() + ' ' + u
        +     ' <span class="po-tw-past-day-done">DONE</span>'
        +   '</span>'
        +   '<div style="display:flex;gap:6px;align-items:center;flex-shrink:0;margin-left:auto;">'
        +   '<button class="po-tw-past-edit" data-dk="' + key + '">Edit</button>'
        +   '<button class="po-tw-past-del" data-dk="' + key + '" aria-label="Delete workout">🗑</button>'
        +   '</div>'
        + '</div>'
        + '<div class="po-tw-past-day-summary" style="margin-top:6px;font-size:11px;color:var(--text-3);">'
        +   escape(exNames)
        + '</div>'
        + '</div>';
    }).join('');
    body.querySelectorAll('.po-tw-past-edit').forEach(btn => {
      btn.addEventListener('click', () => openPastEdit(btn.dataset.dk));
    });
    body.querySelectorAll('.po-tw-past-del').forEach(btn => {
      btn.addEventListener('click', () => {
        const dk = btn.dataset.dk;
        if (!confirm('Delete this entire workout? This cannot be undone.')) return;
        const isSess = dk.length > 10;
        state.exercises.forEach(ex => {
          if (!state.logs[ex.id]) return;
          state.logs[ex.id] = state.logs[ex.id].filter(l =>
            isSess ? l.sid !== dk : l.date.slice(0, 10) !== dk
          );
          if (!state.logs[ex.id].length) delete state.logs[ex.id];
        });
        saveState();
        renderPastWorkouts();
        wlRenderSets();
        if (pastEditDayKey === dk) {
          $('pastEditBg').classList.remove('show');
          pastEditDayKey = null;
        }
      });
    });
  }

  // ── Past Workout Editor ──────────────────────────────────────
  let pastEditDayKey = null;
  let peAddExIsBW = false;

  function openPastEdit(dk) {
    pastEditDayKey = dk;
    $('pastEditTitle').textContent = 'Edit — ' + fmtPastDate(dk);
    renderPastEditBody();
    // Reset add-exercise form
    peAddExIsBW = false;
    $('peAddBwBtn').classList.remove('active');
    $('peAddExInput').value = '';
    $('peAddExDropdown').innerHTML = '';
    $('peAddExDropdown').classList.remove('open');
    $('peAddWeight').value = '';
    $('peAddReps').value = 8;
    $('peAddWrRow').className = 'pe-add-wr-row';
    $('peAddWeightLabel').textContent = state.units;
    const addBtn = $('peAddSetBtn');
    addBtn.textContent = 'Add Set';
    addBtn.style.cssText = '';
    $('pastEditBg').classList.add('show');
  }

  function renderPastEditBody() {
    const body = $('pastEditBody');
    if (!pastEditDayKey || !body) return;
    const u = state.units;
    const groups = {};
    const order = [];
    const isSess = pastEditDayKey.length > 10;
    state.exercises.forEach(ex => {
      (state.logs[ex.id] || []).forEach((log, logIdx) => {
        const match = isSess ? log.sid === pastEditDayKey : log.date.slice(0, 10) === pastEditDayKey;
        if (match) {
          if (!groups[ex.id]) { groups[ex.id] = { ex, sets: [] }; order.push(ex.id); }
          groups[ex.id].sets.push({ log, logIdx });
        }
      });
    });
    if (!order.length) {
      body.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-3);font-size:13px;">No sets logged for this day.</div>';
      return;
    }
    let html = '';
    order.forEach(exId => {
      const { ex, sets } = groups[exId];
      html += '<div class="pe-ex-block">'
        + '<input class="pe-ex-name" type="text" value="' + escape(ex.name) + '" data-exid="' + escape(exId) + '" placeholder="Exercise name">';
      sets.forEach(({ log, logIdx }, i) => {
        html += '<div class="pe-set-row" data-exid="' + escape(exId) + '" data-idx="' + logIdx + '">'
          + '<span class="pe-set-num">Set ' + (i + 1) + '</span>';
        if (!ex.bw) {
          html += '<input type="number" class="wl-edit-input pe-set-w" value="' + (log.weight || 0) + '" min="0" step="0.5" inputmode="decimal">'
            + '<span class="wl-edit-unit">' + escape(u) + '</span>';
        }
        html += '<input type="number" class="wl-edit-input pe-set-r" value="' + (log.reps || 0) + '" min="1" step="1" inputmode="numeric">'
          + '<span class="wl-edit-unit">reps</span>'
          + '<button class="pe-set-del" data-exid="' + escape(exId) + '" data-idx="' + logIdx + '">×</button>'
          + '</div>';
      });
      html += '<button class="pe-add-set" data-exid="' + escape(exId) + '" data-bw="' + (ex.bw ? '1' : '0') + '">+ Add Set</button>'
        + '</div>';
    });
    body.innerHTML = html;

    body.querySelectorAll('.pe-set-w, .pe-set-r').forEach(inp => {
      inp.addEventListener('change', () => {
        const row = inp.closest('.pe-set-row');
        const exId = row.dataset.exid;
        const idx = parseInt(row.dataset.idx, 10);
        const arr = state.logs[exId] || [];
        if (!arr[idx]) return;
        if (inp.classList.contains('pe-set-w')) arr[idx].weight = parseFloat(inp.value) || 0;
        else arr[idx].reps = parseInt(inp.value, 10) || 0;
        state.logs[exId] = arr;
        saveState(); renderPastWorkouts();
      });
    });

    body.querySelectorAll('.pe-ex-name').forEach(inp => {
      inp.addEventListener('change', () => {
        const exId = inp.dataset.exid;
        const ex = state.exercises.find(e => e.id === exId);
        if (ex && inp.value.trim()) { ex.name = inp.value.trim(); saveState(); renderPastWorkouts(); }
      });
    });

    body.querySelectorAll('.pe-set-del').forEach(btn => {
      btn.addEventListener('click', () => {
        const exId = btn.dataset.exid;
        const idx = parseInt(btn.dataset.idx, 10);
        const arr = state.logs[exId] || [];
        arr.splice(idx, 1);
        if (!arr.length) delete state.logs[exId];
        else state.logs[exId] = arr;
        saveState();
        renderPastEditBody(); renderPastWorkouts(); wlRenderSets();
      });
    });

    body.querySelectorAll('.pe-add-set').forEach(btn => {
      btn.addEventListener('click', () => {
        const exId = btn.dataset.exid;
        const isBW = btn.dataset.bw === '1';
        const arr = state.logs[exId] || [];
        const isSessEdit = pastEditDayKey.length > 10;
        const sessLogs = isSessEdit
          ? arr.filter(l => l.sid === pastEditDayKey)
          : arr.filter(l => l.date.slice(0, 10) === pastEditDayKey);
        const lastLog = sessLogs[sessLogs.length - 1];
        const setDate = isSessEdit ? pastEditDayKey : pastEditDayKey + 'T12:00:00';
        const newEntry = { weight: isBW ? 0 : (lastLog ? lastLog.weight : 0), reps: lastLog ? lastLog.reps : 8, date: setDate };
        if (isSessEdit) newEntry.sid = pastEditDayKey;
        arr.push(newEntry);
        state.logs[exId] = arr;
        saveState();
        renderPastEditBody(); renderPastWorkouts();
      });
    });
  }

  $('pastEditClose').addEventListener('click', () => {
    $('pastEditBg').classList.remove('show');
    pastEditDayKey = null;
  });

  // ── Add Exercise to Past Workout — event listeners ────────────
  function peAddRenderDropdown() {
    const q = $('peAddExInput').value.trim().toLowerCase();
    const dd = $('peAddExDropdown');
    if (!q) { dd.innerHTML = ''; dd.classList.remove('open'); return; }
    const matches = state.exercises.filter(e =>
      e.name.toLowerCase().includes(q)
    ).slice(0, 8);
    if (!matches.length) { dd.innerHTML = ''; dd.classList.remove('open'); return; }
    dd.innerHTML = matches.map(e =>
      '<div class="pe-add-ex-dd-item" data-name="' + escape(e.name) + '" data-bw="' + (e.bw ? '1' : '0') + '">'
      + escape(e.name)
      + (e.bw ? ' <span style="color:var(--text-3);font-size:11px">BW</span>' : '')
      + '</div>'
    ).join('');
    dd.classList.add('open');
    dd.querySelectorAll('.pe-add-ex-dd-item').forEach(item => {
      item.addEventListener('mousedown', (ev) => {
        ev.preventDefault();
        $('peAddExInput').value = item.dataset.name;
        peAddExIsBW = item.dataset.bw === '1';
        $('peAddBwBtn').classList.toggle('active', peAddExIsBW);
        $('peAddWrRow').className = 'pe-add-wr-row' + (peAddExIsBW ? ' bw-mode' : '');
        dd.innerHTML = ''; dd.classList.remove('open');
      });
    });
  }

  $('peAddExInput').addEventListener('input', peAddRenderDropdown);
  $('peAddExInput').addEventListener('blur', () => {
    setTimeout(() => {
      $('peAddExDropdown').innerHTML = '';
      $('peAddExDropdown').classList.remove('open');
    }, 150);
  });

  $('peAddBwBtn').addEventListener('click', () => {
    peAddExIsBW = !peAddExIsBW;
    $('peAddBwBtn').classList.toggle('active', peAddExIsBW);
    $('peAddWrRow').className = 'pe-add-wr-row' + (peAddExIsBW ? ' bw-mode' : '');
  });

  $('peAddWtDown').addEventListener('click', () => {
    const inp = $('peAddWeight');
    inp.value = Math.max(0, (parseFloat(inp.value) || 0) - 2.5);
  });
  $('peAddWtUp').addEventListener('click', () => {
    const inp = $('peAddWeight');
    inp.value = (parseFloat(inp.value) || 0) + 2.5;
  });
  $('peAddRpDown').addEventListener('click', () => {
    const inp = $('peAddReps');
    inp.value = Math.max(1, (parseInt(inp.value, 10) || 0) - 1);
  });
  $('peAddRpUp').addEventListener('click', () => {
    const inp = $('peAddReps');
    inp.value = (parseInt(inp.value, 10) || 0) + 1;
  });

  $('peAddSetBtn').addEventListener('click', () => {
    const name = $('peAddExInput').value.trim();
    if (!name) { $('peAddExInput').focus(); return; }
    const reps = parseInt($('peAddReps').value, 10) || 0;
    if (!reps) { $('peAddReps').focus(); return; }
    const weight = peAddExIsBW ? 0 : (parseFloat($('peAddWeight').value) || 0);
    const ex = wlGetOrCreateEx(name, peAddExIsBW);
    const arr = state.logs[ex.id] || [];
    const dk = pastEditDayKey;
    const isSess = dk && dk.length > 10;
    const newEntry = { weight, reps, date: isSess ? dk : dk + 'T12:00:00' };
    if (isSess) newEntry.sid = dk;
    arr.push(newEntry);
    state.logs[ex.id] = arr;
    saveState();
    renderPastEditBody();
    renderPastWorkouts();
    // Reset weight/reps but keep exercise so user can add another set
    $('peAddWeight').value = '';
    $('peAddReps').value = 8;
    // Flash confirmation
    const btn = $('peAddSetBtn');
    btn.textContent = '✓ Added!';
    btn.style.background = 'linear-gradient(180deg,#6ee7b7 0%,#4ade80 100%)';
    btn.style.borderColor = '#6ee7b7';
    btn.style.color = '#000';
    setTimeout(() => {
      btn.textContent = 'Add Set';
      btn.style.background = '';
      btn.style.borderColor = '';
      btn.style.color = '';
    }, 1200);
  });

  $('poTwPastToggle').addEventListener('click', () => {
    const body = $('poTwPastBody');
    const open = body.style.display !== 'none';
    body.style.display = open ? 'none' : 'flex';
    body.style.flexDirection = 'column';
    $('poTwPastToggle').setAttribute('aria-expanded', open ? 'false' : 'true');
  });

  // ── NEW WORKOUT LOGGER ────────────────────────────────────────
  let wlIsBW = false;

  function wlGetOrCreateEx(name, isBW) {
    const ex = state.exercises.find(e =>
      e.name.toLowerCase() === name.trim().toLowerCase());
    if (ex) return ex;
    const nex = {
      id: uid(), name: name.trim(),
      gym: (state.gyms[0] || { id: 'home' }).id,
      day: (state.days[0] || { id: 'push' }).id,
      bw: !!isBW, startWeight: 0, repMin: 6, repMax: 12, step: 5
    };
    state.exercises.push(nex);
    saveState();
    return nex;
  }

  function wlTodaySets() {
    const today = wlTodayKey();
    const result = [];
    state.exercises.forEach(ex => {
      (state.logs[ex.id] || []).forEach((log, logIdx) => {
        if (!log.sid && log.date.slice(0, 10) === today) result.push({ ex, log, logIdx });
      });
    });
    result.sort((a, b) => a.log.date.localeCompare(b.log.date));
    return result;
  }

  function wlRenderSets() {
    const list = $('wlSetsList');
    if (!list) return;
    const sets = wlTodaySets();
    if (!sets.length) { list.innerHTML = ''; return; }
    const groups = {}, order = [];
    sets.forEach(item => {
      if (!groups[item.ex.id]) { groups[item.ex.id] = []; order.push(item.ex.id); }
      groups[item.ex.id].push(item);
    });
    const u = state.units;
    let html = '';
    order.forEach(exId => {
      const g = groups[exId];
      html += '<div class="wl-set-group-label">' + escape(g[0].ex.name) + '</div>';
      g.forEach((item, i) => {
        const l = item.log;
        const text = item.ex.bw
          ? 'Set ' + (i + 1) + ' · ' + l.reps + ' reps'
          : 'Set ' + (i + 1) + ' · ' + l.weight + ' ' + u + ' · ' + l.reps + ' reps';
        html += '<div class="wl-set-row" data-exid="' + escape(exId) + '" data-idx="' + item.logIdx + '" data-bw="' + (item.ex.bw ? '1' : '0') + '">'
          + '<span class="wl-set-text">' + text + '</span>'
          + '<button class="wl-set-edit" aria-label="Edit set" title="Edit">✏</button>'
          + '<button class="wl-set-del" aria-label="Delete set">×</button>'
          + '</div>';
      });
    });
    list.innerHTML = html;
    list.querySelectorAll('.wl-set-del').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!confirm('Delete this set?')) return;
        const row = btn.closest('.wl-set-row');
        const exId = row.dataset.exid;
        const idx = parseInt(row.dataset.idx, 10);
        const arr = state.logs[exId] || [];
        arr.splice(idx, 1);
        if (!arr.length) delete state.logs[exId];
        else state.logs[exId] = arr;
        saveState();
        wlRenderSets(); wlRenderDone(); renderPastWorkouts();
        if (typeof wtRender === 'function') wtRender();
      });
    });
    list.querySelectorAll('.wl-set-edit').forEach(btn => {
      btn.addEventListener('click', () => {
        const row = btn.closest('.wl-set-row');
        const exId = row.dataset.exid;
        const idx = parseInt(row.dataset.idx, 10);
        const isBW = row.dataset.bw === '1';
        const arr = state.logs[exId] || [];
        const log = arr[idx];
        if (!log) return;
        const setLabel = row.querySelector('.wl-set-text').textContent.split('·')[0].trim();
        let editHtml = '<span class="wl-set-text">' + escape(setLabel) + '</span>';
        if (!isBW) {
          editHtml += '<input type="number" class="wl-edit-input wl-edit-w" value="' + (log.weight || 0) + '" min="0" step="0.5" inputmode="decimal">'
            + '<span class="wl-edit-unit">' + escape(u) + '</span>';
        }
        editHtml += '<input type="number" class="wl-edit-input wl-edit-r" value="' + (log.reps || 0) + '" min="1" step="1" inputmode="numeric">'
          + '<span class="wl-edit-unit">reps</span>'
          + '<button class="wl-set-confirm" aria-label="Save">✓</button>';
        row.classList.add('wl-set-row--editing');
        row.innerHTML = editHtml;
        const firstInput = row.querySelector('.wl-edit-input');
        if (firstInput) { firstInput.focus(); firstInput.select(); }
        const confirmBtn = row.querySelector('.wl-set-confirm');
        const doConfirm = () => {
          if (!isBW) arr[idx].weight = parseFloat(row.querySelector('.wl-edit-w').value) || 0;
          arr[idx].reps = parseInt(row.querySelector('.wl-edit-r').value, 10) || 0;
          state.logs[exId] = arr;
          saveState();
          wlRenderSets(); wlRenderDone(); renderPastWorkouts();
        };
        if (confirmBtn) confirmBtn.addEventListener('click', doConfirm);
        row.querySelectorAll('.wl-edit-input').forEach(inp => {
          inp.addEventListener('keydown', e => {
            if (e.key === 'Enter') doConfirm();
            if (e.key === 'Escape') wlRenderSets();
          });
        });
      });
    });
  }

  function wlGetRecents() {
    const today = wlTodayKey();
    const seen = new Set(), result = [], all = [];
    state.exercises.forEach(ex => {
      (state.logs[ex.id] || []).forEach(l => {
        if (l.sid || l.date.slice(0, 10) !== today) all.push({ name: ex.name, date: l.sid || l.date });
      });
    });
    all.sort((a, b) => b.date.localeCompare(a.date));
    for (const { name } of all) {
      if (!seen.has(name)) { seen.add(name); result.push(name); }
      if (result.length >= 4) break;
    }
    return result;
  }

  function wlRenderRecents() {
    const wrap = $('wlRecentsWrap'), row = $('wlRecentsRow');
    if (!wrap || !row) return;
    const recents = wlGetRecents();
    if (!recents.length) { wrap.classList.remove('show'); return; }
    wrap.classList.add('show');
    row.innerHTML = recents.map(n =>
      '<button type="button" class="wl-recent-pill">' + escape(n) + '</button>'
    ).join('');
    row.querySelectorAll('.wl-recent-pill').forEach(pill => {
      pill.addEventListener('click', () => wlPick(pill.textContent.trim()));
    });
  }

    const btn = $('wlDoneBtn');

    btn.textContent = '✓ Mark Workout Done';
    btn.classList.remove('is-done');

  // ── Exercise dropdown ─────────────────────────────────────────
  function wlPick(name) {
    const inp = $('wlExInput');
    if (inp) inp.value = name;
    wlCloseDropdown();
    const ex = state.exercises.find(e => e.name.toLowerCase() === name.toLowerCase());
    if (ex) {
      wlIsBW = !!ex.bw;
      $('wlBwBtn').classList.toggle('active', wlIsBW);
      if ($('wlWeightGroup')) $('wlWeightGroup').classList.toggle('hidden', wlIsBW);
      $('wlInputsRow').classList.toggle('bw-mode', wlIsBW);
      if (!ex.bw && state.logs[ex.id] && state.logs[ex.id].length) {
        const last = state.logs[ex.id][state.logs[ex.id].length - 1];
        if (last.weight) $('wlWeight').value = last.weight;
      }
    }

  function wlBuildDropdown(q) {
    q = (q || '').toLowerCase().trim();
    const matches = state.exercises.filter(e => !q || e.name.toLowerCase().includes(q));
    if (!matches.length) {
      const tip = q ? 'Press Log Set to add "' + q + '"' : 'No exercises yet';
      return '<div style="padding:12px 14px;color:var(--text-3);font-size:13px;">' + escape(tip) + '</div>';
    }
    const byDay = {};
    matches.forEach(ex => {
      const dayId = ex.day || 'other';
      if (!byDay[dayId]) byDay[dayId] = [];
      byDay[dayId].push(ex);
    });
    return Object.entries(byDay).map(([dayId, exs]) => {
      const dayObj = state.days.find(d => d.id === dayId);
      return '<div class="wl-dd-group"><div class="wl-dd-group-label">'
        + escape(dayObj ? dayObj.name : dayId) + '</div>'
        + exs.map(ex => '<div class="wl-dd-item" data-name="' + escape(ex.name) + '">'
          + escape(ex.name) + '</div>').join('')
        + '</div>';
    }).join('');

  // ============================================================
  // WEIGHT TRACKER + COMPOSITION ESTIMATE
  // All persisted to localStorage:
  //   po_coach_weights : [{ dateKey:'YYYY-MM-DD', weight:Number }]
  // ============================================================
  const WT_KEY = 'po_coach_weights';

  function wtLoad() {
    try {
      const raw = localStorage.getItem(WT_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.sort((a,b) => a.dateKey.localeCompare(b.dateKey)) : [];
    } catch (e) { return []; }
  }
  function wtSave(arr) {
    try { localStorage.setItem(WT_KEY, JSON.stringify(arr)); } catch (e) {}
    try { pcSchedulePush(); } catch (e) {}
  }
  function wtDateKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function wtParseKey(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function wtSmoothPath(points) {
    if (!points.length) return '';
    if (points.length === 1) return 'M ' + points[0].x + ' ' + points[0].y;
    let d = 'M ' + points[0].x.toFixed(2) + ' ' + points[0].y.toFixed(2);
    for (let i = 1; i < points.length; i++) {
      const prev = points[i-1], curr = points[i];
      const cx = (prev.x + curr.x) / 2;
      d += ' Q ' + cx.toFixed(2) + ' ' + prev.y.toFixed(2) + ', ' + cx.toFixed(2) + ' ' + ((prev.y + curr.y)/2).toFixed(2);
      d += ' T ' + curr.x.toFixed(2) + ' ' + curr.y.toFixed(2);
    }
    return d;
  }

  let wtEntries = wtLoad();

  function wtSaveEntry(weight) {
    const key = wtDateKey(new Date());
    const existing = wtEntries.find(e => e.dateKey === key);
    if (existing) existing.weight = weight;
    else { wtEntries.push({ dateKey: key, weight }); wtEntries.sort((a,b) => a.dateKey.localeCompare(b.dateKey)); }
    wtSave(wtEntries);
    wtRender();
  }

  function wtRender() {
    const last = wtEntries[wtEntries.length - 1] || null;
    const todayKey = wtDateKey(new Date());
    const todayEntry = wtEntries.find(e => e.dateKey === todayKey);
    const u = state.units;

    // Sync unit labels everywhere
    $('wtUnit').textContent = u;
    $('wtUnitStatic').textContent = u;
    $('wtNum').textContent = last ? last.weight.toFixed(1) : '—';

    // Locked vs input
    if (todayEntry) {
      $('wtEmpty').classList.add('hidden');
      $('wtLockedValue').textContent = todayEntry.weight.toFixed(1) + ' ' + u;
      $('wtLocked').classList.remove('hidden');
      $('wtInputRow').classList.add('hidden');
    } else {
      if (wtEntries.length === 0) $('wtEmpty').classList.remove('hidden');
      else $('wtEmpty').classList.add('hidden');
      $('wtLocked').classList.add('hidden');
      $('wtInputRow').classList.remove('hidden');
      if (last && !$('wtInput').value) $('wtInput').value = last.weight.toFixed(1);
    }

    // Chart, delta, composition need 2+ entries
    if (wtEntries.length >= 2) {
      $('wtChartWrap').classList.remove('hidden');
      $('wtLegend').classList.remove('hidden');
      wtRenderChart();
      wtRenderDelta();
      wtRenderComposition();
    } else {
      $('wtChartWrap').classList.add('hidden');
      $('wtLegend').classList.add('hidden');
      $('wtDelta').classList.add('hidden');
      $('wtComp').classList.add('hidden');
    }
    wtRenderStreak();
  }

  // Streak — consecutive days ending at today (or yesterday if today
  // hasn't been logged yet) with at least one weight entry.
  function wtRenderStreak() {
    const el = $('wtStreak');
    let streak = 0;
    let cursor = new Date(new Date());
    if (!wtEntries.find(e => e.dateKey === wtDateKey(cursor))) {
      cursor.setDate(cursor.getDate() - 1);
    }
    while (wtEntries.find(e => e.dateKey === wtDateKey(cursor))) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    }
    if (streak >= 2) {
      $('wtStreakNum').textContent = streak + ' day streak';
      el.classList.remove('hidden');
    } else {
      el.classList.add('hidden');
    }
  }

  function wtRenderChart() {
    const recent = wtEntries.slice(-30);
    const weights = recent.map(e => e.weight);
    const min = Math.min.apply(null, weights);
    const max = Math.max.apply(null, weights);
    const pad = Math.max((max - min) * 0.15, 0.5);
    const yMin = min - pad, yMax = max + pad;
    const xLeft = 8, xRight = 312, yTop = 20, yBot = 110;
    const xRange = xRight - xLeft, yRange = yBot - yTop;
    const xFor = (i) => recent.length === 1 ? xRight : xLeft + (i / (recent.length - 1)) * xRange;
    const yFor = (w) => yBot - ((w - yMin) / (yMax - yMin)) * yRange;
    const points = recent.map((e, i) => ({ x: xFor(i), y: yFor(e.weight) }));
    const linePath = wtSmoothPath(points);
    const areaPath = linePath + ' L ' + points[points.length - 1].x.toFixed(2) + ' ' + yBot + ' L ' + points[0].x.toFixed(2) + ' ' + yBot + ' Z';
    // 7d moving avg
    const avgPoints = recent.map((_, i) => {
      const start = Math.max(0, i - 6);
      const win = recent.slice(start, i + 1);
      const avg = win.reduce((s, p) => s + p.weight, 0) / win.length;
      return { x: xFor(i), y: yFor(avg) };
    });
    const avgPath = wtSmoothPath(avgPoints);
    let html = '<path class="wt-avg-line" d="' + avgPath + '"></path>'
             + '<path class="wt-area" d="' + areaPath + '"></path>'
             + '<path class="wt-line" filter="url(#wtGlow)" d="' + linePath + '"></path>';
    points.forEach((p, i) => {
      const cls = (i === points.length - 1) ? 'wt-dot-today' : 'wt-dot';
      const r = (i === points.length - 1) ? 5 : 3;
      html += '<circle class="' + cls + '" cx="' + p.x.toFixed(2) + '" cy="' + p.y.toFixed(2) + '" r="' + r + '"/>';
    });
    $('wtChartContent').innerHTML = html;
    $('wtYAxisMax').textContent = yMax.toFixed(1);
    $('wtYAxisMin').textContent = yMin.toFixed(1);
    $('wtMeta').textContent = wtEntries.length + ' ' + (wtEntries.length === 1 ? 'entry' : 'entries') + ' · last ' + recent.length + ' days';
  }

  function wtRenderDelta() {
    const last = wtEntries[wtEntries.length - 1];
    const lastDate = wtParseKey(last.dateKey);
    const cutoff = new Date(lastDate); cutoff.setDate(cutoff.getDate() - 7);
    const baseline = wtEntries.find(e => wtParseKey(e.dateKey) >= cutoff) || wtEntries[0];
    const diff = last.weight - baseline.weight;
    const el = $('wtDelta');
    if (Math.abs(diff) < 0.05) { el.classList.add('hidden'); return; }
    const arrow = diff > 0 ? '↑' : '↓';
    const sign = diff > 0 ? '+' : '−';
    el.textContent = arrow + ' ' + sign + Math.abs(diff).toFixed(1) + ' ' + state.units + ' · last 7d';
    el.classList.toggle('up',   diff > 0);
    el.classList.toggle('down', diff < 0);
    el.classList.remove('hidden');
  }

  // ============================================================
  // COMPOSITION ESTIMATE — muscle vs fat from weight + strength trend
  //
  // Math:
  //   weightDelta   = current weight − weight ~30 days ago
  //   strengthDelta = avg of (current 1RM / 1RM 30 days ago across all
  //                   exercises with logs in BOTH windows)
  //   yearsTraining → max muscle gain rate per week:
  //     1y → 0.45 kg, 2y → 0.23 kg, 3y+ → 0.11 kg (Lyle McDonald's
  //     model — cited intermediate intermediate values are real ceilings)
  //   estimated muscle gain = max muscle rate × weeks × (1 + strengthDelta)
  //                           clipped to [0, weightDelta]
  //   estimated fat gain    = weightDelta − estimated muscle gain
  //
  // If you LOSE weight: any positive strength delta means you're keeping
  // (or building) muscle, so the loss is mostly fat.
  // ============================================================
  function wtRenderComposition() {
    const compEl = $('wtComp');
    if (!CONFIG.composition || !CONFIG.composition.enabled) {
      compEl.classList.add('hidden'); return;
    }
    const window = CONFIG.composition.windowDays || 30;
    if (wtEntries.length < 2) { compEl.classList.add('hidden'); return; }

    const now = wtParseKey(wtEntries[wtEntries.length - 1].dateKey);
    const start = new Date(now); start.setDate(start.getDate() - window);

    // Find weight at start of window (closest entry on or after start)
    const startEntry = wtEntries.find(e => wtParseKey(e.dateKey) >= start);
    const endEntry = wtEntries[wtEntries.length - 1];
    if (!startEntry || startEntry === endEntry) { compEl.classList.add('hidden'); return; }
    const weightDelta = endEntry.weight - startEntry.weight;
    const actualDays = Math.max(1, Math.round((wtParseKey(endEntry.dateKey) - wtParseKey(startEntry.dateKey)) / 86400000));
    const weeks = actualDays / 7;

    // Strength delta — for each exercise, take the AVG 1RM of logs inside
    // the window vs AVG of logs of equal count just before the window.
    let strengthRatios = [];
    let workoutDays = new Set();
    let totalVolumeInWindow = 0;
    state.exercises.forEach(ex => {
      const logs = (state.logs[ex.id] || []).slice();
      if (logs.length < 2 || ex.bw) {
        // Still count volume / sessions even for bodyweight + sparse exercises
        logs.forEach(l => {
          if (new Date(l.date) >= start) {
            workoutDays.add(l.date.slice(0, 10));
            totalVolumeInWindow += (l.weight || 0) * (l.reps || 0);
          }
        });
        return;
      }
      const inWin  = logs.filter(l => new Date(l.date) >= start);
      const before = logs.filter(l => new Date(l.date) < start);
      inWin.forEach(l => {
        workoutDays.add(l.date.slice(0, 10));
        totalVolumeInWindow += (l.weight || 0) * (l.reps || 0);
      });
      if (!inWin.length || !before.length) return;
      const avg = arr => arr.reduce((s, l) => s + estimate1RM(l.weight, l.reps), 0) / arr.length;
      const a = avg(before), b = avg(inWin);
      if (a <= 0) return;
      strengthRatios.push(b / a);
    });
    const strengthDelta = strengthRatios.length
      ? (strengthRatios.reduce((s, r) => s + r, 0) / strengthRatios.length) - 1
      : 0;
    // Frequency factor: 4+ training days/week = full credit, fewer = penalty.
    // Volume factor: moderate cap so a single huge day doesn't game the score.
    const sessionsPerWeek = (workoutDays.size / actualDays) * 7;
    const frequencyFactor = Math.max(0.4, Math.min(1.2, sessionsPerWeek / 4));

    // Max muscle gain rate per week (kg). Convert to lb if user's units are lb.
    const yt = CONFIG.composition.yearsTraining || 1;
    let maxMuscleKgPerWeek;
    if (yt <= 1) maxMuscleKgPerWeek = 0.45;
    else if (yt === 2) maxMuscleKgPerWeek = 0.23;
    else maxMuscleKgPerWeek = 0.11;
    const unitConv = (state.units === 'lb') ? 2.20462 : 1;
    const maxMusclePerWeek = maxMuscleKgPerWeek * unitConv;

    // Estimated muscle: scale by strength gain (capped between 0.5x and 1.5x)
    // AND by training frequency (you can't build muscle you didn't stimulate).
    const strengthBoost = Math.max(0.5, Math.min(1.5, 1 + strengthDelta * 4));
    let estMuscle = maxMusclePerWeek * weeks * strengthBoost * frequencyFactor;

    let estFat;
    let headlineCls = '';
    let headline = '';
    if (weightDelta > 0) {
      // Surplus: split between muscle and fat. Cap muscle at the weight gained.
      estMuscle = Math.min(estMuscle, weightDelta);
      estFat = Math.max(0, weightDelta - estMuscle);
      const musclePct = estMuscle / weightDelta;
      if (musclePct >= 0.6 && strengthDelta > 0) {
        headlineCls = 'good';
        headline = '+' + weightDelta.toFixed(1) + ' ' + state.units + ' — mostly muscle, strength up.';
      } else if (musclePct >= 0.35) {
        headlineCls = 'warn';
        headline = '+' + weightDelta.toFixed(1) + ' ' + state.units + ' — mixed. Tighten kcal or push lifts harder.';
      } else {
        headlineCls = 'bad';
        headline = '+' + weightDelta.toFixed(1) + ' ' + state.units + ' — mostly fat. Strength flat. Cut kcal.';
      }
    } else {
      // Deficit: assume fat first, only credit muscle loss if strength dropped.
      const wDown = Math.abs(weightDelta);
      if (strengthDelta >= 0) {
        // Strength preserved or up → all fat lost, slight muscle gain
        estMuscle = Math.min(maxMusclePerWeek * weeks * 0.3, 0.5);
        estFat = wDown + estMuscle;
        headlineCls = 'good';
        headline = '−' + wDown.toFixed(1) + ' ' + state.units + ' — strength holding, fat dropping.';
      } else {
        // Strength dropped → some muscle loss
        const lossPct = Math.min(0.4, Math.abs(strengthDelta) * 2);
        estMuscle = -wDown * lossPct;
        estFat = -(wDown + estMuscle);
        headlineCls = 'warn';
        headline = '−' + wDown.toFixed(1) + ' ' + state.units + ' — strength slipping. You may be losing muscle.';
      }
    }

    // Render
    compEl.classList.remove('hidden');
    $('wtCompWindow').textContent = 'last ' + actualDays + 'd';
    const headlineEl = $('wtCompHeadline');
    headlineEl.textContent = headline;
    headlineEl.className = 'wt-comp-headline ' + headlineCls;

    // Bars
    const totalAbs = Math.abs(estMuscle) + Math.abs(estFat) || 1;
    const musclePct = (Math.abs(estMuscle) / totalAbs) * 100;
    const fatPct = (Math.abs(estFat) / totalAbs) * 100;
    $('wtCompBars').innerHTML =
      '<div class="wt-comp-bar muscle" style="width:' + musclePct.toFixed(1) + '%"></div>' +
      '<div class="wt-comp-bar fat" style="width:' + fatPct.toFixed(1) + '%"></div>';

    // Foot line — strength + training frequency (so you can see why the
    // muscle estimate is what it is).
    const sd = strengthDelta * 100;
    const sdStr = (sd >= 0 ? '+' : '') + sd.toFixed(1) + '%';
    const muscleSign = estMuscle >= 0 ? '+' : '';
    const fatSign = estFat >= 0 ? '+' : '';
    const freqStr = sessionsPerWeek.toFixed(1) + ' sessions/wk';
    $('wtCompFoot').textContent =
      '~' + muscleSign + estMuscle.toFixed(1) + ' ' + state.units + ' muscle · '
      + '~' + fatSign + estFat.toFixed(1) + ' ' + state.units + ' fat · '
      + 'strength ' + sdStr
      + ' · ' + freqStr
      + (strengthRatios.length ? '' : ' (no lift data)');
  }

  // Wire weight UI
  $('wtSaveBtn').addEventListener('click', () => {
    const v = parseFloat($('wtInput').value);
    if (isNaN(v) || v <= 0) return;
    wtSaveEntry(v);
  });
  $('wtInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') $('wtSaveBtn').click();
  });
  $('wtEditBtn').addEventListener('click', () => {
    $('wtLocked').classList.add('hidden');
    $('wtInputRow').classList.remove('hidden');
    const todayEntry = wtEntries.find(e => e.dateKey === wtDateKey(new Date()));
    if (todayEntry) $('wtInput').value = todayEntry.weight.toFixed(1);
    $('wtInput').focus(); $('wtInput').select();
  });

  // ============================================================
  // BOOT
  // ============================================================
  renderAll();
  wtRender();

  // ============================================================
  // CLOUD SYNC via Supabase  (OPTIONAL — leave blank for local-only)
  // ------------------------------------------------------------
  // Stores your gym state as one JSONB row in the public.app_state
  // table, keyed by APP_KEY. Supabase's realtime channel pushes
  // changes to every device the instant they happen.
  //
  // SETUP (5 minutes, all in a browser):
  //   1. Make a free account at https://supabase.com
  //   2. Create a new project
  //   3. In your project: Settings → API → copy your Project URL +
  //      "Publishable" key (the one starting with `sb_publishable_`)
  //   4. Paste them below, replacing the two placeholder strings
  //   5. Open the SQL Editor and run the SQL block from README.md
  //
  // If you leave the placeholders unchanged the app still works,
  // just only on this device (data stays in your browser).
  // ============================================================
  const SUPABASE_URL = 'https://oyylbiscxnymnmetyrho.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95eWxiaXNjeG55bW5tZXR5cmhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMzQ1MDgsImV4cCI6MjA5NTcxMDUwOH0.3xxHcp3Z4vJWHEGFV_iUW_YeJ2gdUPqYiNAQkYnR-qU';
  const APP_KEY = 'po-coach';
  const PC_SYNCED_KEYS = ['po_coach_v1', 'po_coach_workout_done', 'po_coach_weights'];

  let pcSupa = null;
  let pcPushTimer = null;
  let pcSuppressSync = false;
  let pcPendingRemote = null;
  let pcPushPending = false;  // set when push is attempted before Supabase is ready
  // JSON of the last state we sent or received — used to ignore
  // realtime echoes of our own pushes so we don't infinite-loop.
  let pcLastSyncedJson = null;

  // setItem override is installed at page-top (before CONFIG) so it catches
  // every write regardless of when code runs. _pcOrigSet uses the pre-override
  // original so pcApplyRemoteState can write without re-triggering the hook.
  const _pcOrigSet = window.__lsOrigSet || localStorage.setItem.bind(localStorage);
  const _pcOrigRemove = localStorage.removeItem.bind(localStorage);
  // Wire the sync trigger into the page-top override
  window._pcTriggerSync = function(k) {
    if (!pcSuppressSync && PC_SYNCED_KEYS.indexOf(k) !== -1) pcSchedulePush();
  };
  localStorage.removeItem = function(k) {
    _pcOrigRemove(k);
    try {
      if (!pcSuppressSync && PC_SYNCED_KEYS.indexOf(k) !== -1) pcSchedulePush();
    } catch (e) {}
  };

  function pcCollectState() {
    const out = {};
    for (const k of PC_SYNCED_KEYS) {
      const v = localStorage.getItem(k);
      if (v == null) continue;
      try { out[k] = JSON.parse(v); } catch {}
    }
    return out;
  }

  function pcIsUserEditing() {
    const ae = document.activeElement;
    if (!ae) return false;
    const tag = ae.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return true;
    if (ae.getAttribute && ae.getAttribute('contenteditable') === 'true') return true;
    return false;
  }

  function pcRerender() {
    // Reload every closure variable that mirrors a synced localStorage
    // key — otherwise renderAll/wtRender would read stale in-memory
    // copies from before the remote pull.
    try { state = loadState(); } catch {}
    try { doneDays = loadDoneDays(); } catch {}
    try { wtEntries = wtLoad(); } catch {}
    try { renderAll(); } catch {}
    try { wtRender(); } catch {}
  }

  function pcApplyRemoteState(remote) {
    if (!remote || typeof remote !== 'object') return false;
    pcSuppressSync = true;
    let changed = false;
    try {
      for (const k of PC_SYNCED_KEYS) {
        if (k in remote) {
          const incoming = JSON.stringify(remote[k]);
          const local = localStorage.getItem(k);
          if (local !== incoming) { try { _pcOrigSet(k, incoming); changed = true; } catch {} }
        } else if (localStorage.getItem(k) != null) {
          try { _pcOrigRemove(k); changed = true; } catch {}
        }
      }
    } finally {
      pcSuppressSync = false;
    }
    if (changed) { try { pcRerender(); } catch (e) {} }
    return changed;
  }

  function pcMaybeApplyRemote(remote) {
    if (pcIsUserEditing()) { pcPendingRemote = remote; return; }
    pcApplyRemoteState(remote);
  }

  function pcApplyPendingIfReady() {
    if (pcPendingRemote && !pcIsUserEditing()) {
      const r = pcPendingRemote;
      pcPendingRemote = null;
      pcApplyRemoteState(r);
    }
  }

  async function pcPushNow() {
    if (!pcSupa) {
      pcPushPending = true;
      return;
    }
    const state = pcCollectState();
    const json = JSON.stringify(state);
    if (json === pcLastSyncedJson) return;
    try {
      const { error } = await pcSupa
        .from('app_state')
        .upsert(
          { key: APP_KEY, data: state, updated_at: new Date().toISOString() },
          { onConflict: 'key' }
        );
      if (!error) { pcLastSyncedJson = json; pcPushPending = false; }
    } catch (_) {}
  }

  function pcSchedulePush() {
    if (pcSuppressSync) return;
    clearTimeout(pcPushTimer);
    pcPushTimer = setTimeout(pcPushNow, 0);
  }

  // Backup push on unload via fetch keepalive so a fast refresh
  // doesn't lose the latest change before the debounced push fires.
  function pcFlushPushOnUnload() {
    if (!pcSupa) return;
    const state = pcCollectState();
    const json = JSON.stringify(state);
    if (json === pcLastSyncedJson) return;
    try {
      fetch(SUPABASE_URL + '/rest/v1/app_state?on_conflict=key', {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'resolution=merge-duplicates',
        },
        body: JSON.stringify({ key: APP_KEY, data: state, updated_at: new Date().toISOString() }),
        keepalive: true,
      }).catch(() => {});
      pcLastSyncedJson = json;
    } catch (_) {}
  }

  // Initial sync: connect Supabase, pull current state, subscribe to
  // realtime updates so other devices' changes appear instantly.
  (async function pcInitCloudSync() {
    if (!window.supabase || !SUPABASE_URL || !SUPABASE_KEY) return;
    // Skip if the placeholder values are still in place (local-only mode)
    if (SUPABASE_URL.indexOf('PASTE-') === 0 || SUPABASE_KEY.indexOf('PASTE-') === 0) return;
    pcSupa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    // Fire any push that was queued before Supabase connected
    if (pcPushPending) { pcPushPending = false; setTimeout(pcPushNow, 0); }
    try {
      const { data, error } = await pcSupa
        .from('app_state').select('data').eq('key', APP_KEY).maybeSingle();
      if (!error && data && data.data && Object.keys(data.data).length > 0) {
        pcLastSyncedJson = JSON.stringify(data.data);
        pcMaybeApplyRemote(data.data);
      } else if (Object.keys(pcCollectState()).length > 0) {
        pcSchedulePush();
      }
    } catch (_) {}
    pcSupa.channel('app_state_' + APP_KEY)
      .on('postgres_changes', {
        event: '*',
        schema: 'public',
        table: 'app_state',
        filter: 'key=eq.' + APP_KEY,
      }, (payload) => {
        if (!payload.new || !payload.new.data) return;
        const incoming = JSON.stringify(payload.new.data);
        if (incoming === pcLastSyncedJson) return; // echo of our own push
        pcLastSyncedJson = incoming;
        pcMaybeApplyRemote(payload.new.data);
      })
      .subscribe();
    // Polling fallback — catches changes if realtime is not enabled on the table
    setInterval(async () => {
      if (!pcSupa) return;
      try {
        const { data, error } = await pcSupa
          .from('app_state').select('data').eq('key', APP_KEY).maybeSingle();
        if (!error && data && data.data) {
          const incoming = JSON.stringify(data.data);
          if (incoming !== pcLastSyncedJson) {
            pcLastSyncedJson = incoming;
            pcMaybeApplyRemote(data.data);
          }
        }
      } catch (_) {}
    }, 30000);
  })();

  document.addEventListener('focusout', () => {
    setTimeout(pcApplyPendingIfReady, 0);
  }, true);
  window.addEventListener('pagehide', pcFlushPushOnUnload);
  window.addEventListener('beforeunload', pcFlushPushOnUnload);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      if (pcSupa) {
        pcSupa.from('app_state').select('data').eq('key', APP_KEY).maybeSingle()
          .then(({ data, error }) => {
            if (!error && data && data.data) {
              const incoming = JSON.stringify(data.data);
              if (incoming !== pcLastSyncedJson) {
                pcLastSyncedJson = incoming;
                pcMaybeApplyRemote(data.data);
              }
            }
          }).catch(() => {});
      }
    } else {
      pcFlushPushOnUnload();
    }
  });
})();
</script>
<script src="/anim-hooks.js" defer></script>
