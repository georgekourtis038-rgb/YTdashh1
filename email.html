<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f0e">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="axis-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Axis — Email</title>
<script src="topbar.js" defer></script>
<script src="google-auth.js"></script>
<style>
:root {
  --bg: #0a0f0e;
  --mint: #2de8a2;
  --mint-dim: rgba(45,232,162,0.12);
  --mint-border: rgba(45,232,162,0.4);
  --card-bg: rgba(255,255,255,0.04);
  --card-border: rgba(255,255,255,0.08);
  --text-primary: #FAFAFA;
  --text-secondary: rgba(255,255,255,0.6);
  --text-tertiary: rgba(255,255,255,0.3);
  --font: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'Space Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  min-height: 100vh;
  overflow-x: hidden;
}

.em-page {
  max-width: 540px;
  margin: 0 auto;
  padding: 14px 16px 120px;
}

/* Header — Inbox title + unread pill */
.em-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}
.em-title {
  font-family: var(--font);
  font-weight: 600;
  font-size: 29px;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}
.em-unread-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 12px;
  border-radius: 11px;
  background: rgba(45,232,162,0.1);
  border: 1px solid rgba(45,232,162,0.25);
}
.em-pill-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--mint);
  box-shadow: 0 0 7px var(--mint);
  flex-shrink: 0;
}
.em-pill-text {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--mint);
}

/* Search */
.em-search-wrap {
  position: relative;
  margin-bottom: 12px;
}
.em-search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  opacity: 0.35;
  pointer-events: none;
}
.em-search {
  width: 100%;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  padding: 12px 14px 12px 42px;
  color: var(--text-primary);
  font-size: 16px;
  font-family: var(--font);
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color 0.2s, background 0.2s;
}
.em-search::placeholder { color: var(--text-tertiary); }
.em-search:focus {
  border-color: rgba(45,232,162,0.4);
  background: rgba(45,232,162,0.04);
}

/* Folder switcher — Inbox / Sent / Spam */
.em-folders {
  display: flex;
  gap: 5px;
  padding: 4px;
  margin-bottom: 12px;
  border-radius: 14px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.07);
}
.em-folder {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 6px;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: var(--text-secondary);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, color 0.15s;
}
.em-folder svg { opacity: 0.75; }
.em-folder.active {
  background: rgba(45,232,162,0.12);
  color: var(--mint);
}
.em-folder.active svg { opacity: 1; }

/* Category chips — inbox only */
.em-cats {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.em-cats::-webkit-scrollbar { display: none; }
.em-cat {
  flex: 0 0 auto;
  font-family: var(--font);
  padding: 7px 14px;
  border-radius: 11px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.05);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.15s;
}
.em-cat.active {
  background: var(--mint);
  border-color: transparent;
  color: #04140d;
}

/* Axis inbox summary banner */
.em-triage {
  position: relative;
  border-radius: 20px;
  padding: 16px 18px;
  margin-bottom: 16px;
  background: linear-gradient(180deg, rgba(45,232,162,0.1), rgba(255,255,255,0.02));
  border: 1px solid rgba(45,232,162,0.18);
  overflow: hidden;
}
.em-triage-glow {
  position: absolute;
  top: -26px;
  right: -16px;
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(45,232,162,0.14), transparent 70%);
  filter: blur(4px);
  pointer-events: none;
}
.em-triage-inner {
  display: flex;
  align-items: center;
  gap: 11px;
  position: relative;
}
.em-orb {
  width: 28px;
  height: 28px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: conic-gradient(from 180deg, #2de8a2, #6f9bff, #2de8a2);
  display: flex;
  align-items: center;
  justify-content: center;
}
.em-orb-core {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #0a1512;
  display: flex;
  align-items: center;
  justify-content: center;
}
.em-orb-ring {
  width: 7px;
  height: 7px;
  border: 1.5px solid var(--mint);
  border-radius: 50%;
  border-right-color: transparent;
  border-bottom-color: transparent;
}
.em-triage-text {
  flex: 1;
  font-size: 13px;
  line-height: 1.45;
  color: rgba(255,255,255,0.82);
}
.em-triage-text strong { color: var(--mint); font-weight: 500; }

/* Auth card */
.auth-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 24px;
  padding: 28px 20px;
  text-align: center;
  margin-bottom: 14px;
}
.auth-icon { font-size: 36px; margin-bottom: 12px; }
.auth-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.auth-body {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.65;
  margin-bottom: 20px;
  max-width: 290px;
  margin-left: auto;
  margin-right: auto;
}
.auth-btn {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 13px 24px;
  background: var(--mint-dim);
  border: 1.5px solid var(--mint);
  border-radius: 14px;
  color: var(--text-primary);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s;
  font-family: var(--font);
}
.auth-btn:active { background: rgba(45,232,162,0.22); }

/* Email list — individual row cards */
.em-feed {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.em-row {
  display: flex;
  gap: 13px;
  padding: 15px 14px;
  border-radius: 16px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.07);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.1s, transform 0.08s;
  position: relative;
}
.em-row:active { background: rgba(255,255,255,0.07); transform: scale(0.992); }
.em-row.read { opacity: 0.72; }

.em-avatar {
  width: 40px;
  height: 40px;
  flex: 0 0 auto;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font);
  font-weight: 600;
  font-size: 15px;
  color: #fff;
}

.em-row-body { flex: 1; min-width: 0; }
.em-row-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 2px;
}
.em-sender {
  font-size: 14.5px;
  font-weight: 500;
  color: rgba(255,255,255,0.85);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  min-width: 0;
}
.em-row.unread .em-sender {
  font-weight: 600;
  color: #fff;
}
.em-time {
  font-family: var(--font-mono);
  font-size: 11px;
  color: rgba(255,255,255,0.35);
  flex-shrink: 0;
  white-space: nowrap;
}
.em-subject {
  font-size: 13.5px;
  font-weight: 400;
  color: rgba(255,255,255,0.6);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-bottom: 2px;
}
.em-row.unread .em-subject {
  font-weight: 500;
  color: rgba(255,255,255,0.78);
}
.em-snippet {
  font-size: 12.5px;
  color: rgba(255,255,255,0.35);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.em-row.unread .em-snippet { color: rgba(255,255,255,0.42); }
.em-labels {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-top: 6px;
}
.em-chip {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.3px;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.06);
  color: var(--text-tertiary);
}
.em-unread-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--mint);
  box-shadow: 0 0 7px var(--mint);
  flex: 0 0 auto;
  margin-top: 6px;
}

/* Empty / loading states */
.em-state {
  text-align: center;
  padding: 32px 16px;
  color: var(--text-tertiary);
  font-size: 13px;
  line-height: 1.6;
}

/* Spinner */
.spinner {
  width: 20px; height: 20px;
  border: 2px solid rgba(45,232,162,0.2);
  border-top-color: var(--mint);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
  margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg) translateZ(0); } }

/* Compose FAB — opens Gmail compose */
.em-compose {
  position: fixed;
  right: 18px;
  bottom: 86px;
  width: 56px;
  height: 56px;
  border-radius: 18px;
  background: linear-gradient(180deg, #2de8a2, #1ec78a);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 44;
  border: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  box-shadow: 0 10px 28px -8px rgba(45,232,162,0.7);
  transition: transform 0.12s;
}
.em-compose:active { transform: scale(0.94); }

/* Detail sheet */
.sheet-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 50;
}
.sheet-bg.show { display: block; }
.email-sheet {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: radial-gradient(130% 80% at 50% -8%, #0e1715 0%, #0a0e0d 60%);
  border: 1px solid rgba(255,255,255,0.12);
  border-bottom: none;
  border-radius: 28px 28px 0 0;
  padding: 0 22px max(28px, env(safe-area-inset-bottom));
  z-index: 51;
  max-height: 82vh;
  overflow-y: auto;
  overscroll-behavior: contain;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
  will-change: transform;
  backface-visibility: hidden;
}
.sheet-bg.show .email-sheet { transform: translateY(0); }

.sheet-handle {
  width: 36px; height: 4px;
  background: rgba(255,255,255,0.18);
  border-radius: 2px;
  margin: 12px auto 18px;
}
.sheet-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}
.sheet-avatar {
  width: 44px;
  height: 44px;
  flex: 0 0 auto;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font);
  font-weight: 600;
  font-size: 17px;
  color: #fff;
}
.sheet-from-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sheet-from-addr {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sheet-subject {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text-primary);
  margin-bottom: 10px;
  line-height: 1.3;
}
.sheet-labels {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.sheet-meta {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-bottom: 12px;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.sheet-meta-row {
  display: flex;
  gap: 8px;
  font-size: 12.5px;
}
.sheet-meta-label {
  font-family: var(--font-mono);
  color: var(--text-tertiary);
  min-width: 40px;
  flex-shrink: 0;
}
.sheet-meta-val {
  color: var(--text-secondary);
  word-break: break-all;
}
.sheet-body {
  font-size: 14px;
  color: rgba(255,255,255,0.75);
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
  margin-top: 14px;
}

@media (prefers-reduced-motion: reduce) {
  .email-sheet { transition: none; }
  .spinner { animation: none; }
}
</style>

      Inbox

        <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
        <path d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.174 0 7.547 0 9s.348 2.826.957 4.039l3.007-2.332z" fill="#FBBC05"/>

      Sign in with Google

  <div class="em-triage" id="emTriage" style="display:none">

  <div id="emStateWrap"></div>

  <div class="em-feed" id="emList" style="display:none"></div>

</div>

<!-- Compose — opens Gmail compose -->
<button class="em-compose" id="emCompose" aria-label="Compose">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M4 20h4L19 9l-4-4L4 16v4ZM14 6l4 4" stroke="#04140d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<!-- Email detail sheet -->
<div class="sheet-bg" id="sheetBg">
  <div class="email-sheet" id="emailSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head" id="sheetHead">
      <div class="sheet-avatar" id="sheetAvatar"></div>
      <div style="flex:1;min-width:0">
        <div class="sheet-from-name" id="sheetFromName"></div>
        <div class="sheet-from-addr" id="sheetFromAddr"></div>
      </div>
    </div>
    <div class="sheet-subject" id="sheetSubject"></div>
    <div class="sheet-labels" id="sheetLabels"></div>
    <div class="sheet-meta" id="sheetMeta"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script>
// =================================================================
// Uses same GOOGLE_CLIENT_ID and token as calendar.html
// Scopes: calendar + gmail.readonly
// IMPORTANT: Gmail API must also be enabled at console.cloud.google.com
// =================================================================
const GOOGLE_CLIENT_ID = '199459906303-10ecosetgbh9tucisnoufu942dkoj13k.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/calendar https://www.googleapis.com/auth/gmail.readonly';
const GMAIL_API = 'https://www.googleapis.com/gmail/v1/users/me';

let accessToken = null;
let allEmails = [];
let activeFolder = 'inbox';      // inbox | sent | spam
let activeCategory = 'primary';  // primary | promotions | social | updates
let searchQuery = '';

// -------------------------------------------------------
// Auth — delegated to google-auth.js
// -------------------------------------------------------
function showAuthCard() {
  document.getElementById('authCard').style.display = '';
  document.getElementById('emStateWrap').innerHTML = '';
  document.getElementById('emHead').style.display = 'none';
  document.getElementById('emTriage').style.display = 'none';
  document.getElementById('emList').style.display = 'none';
  document.getElementById('emCompose').style.display = 'none';
}

function authenticate() {
  GoogleAuth.signIn();
}


GoogleAuth.init({
  onReady: function(tok) {
    console.log('[Gmail] Token valid — loading inbox');
    accessToken = tok;
    document.getElementById('authCard').style.display = 'none';
    document.getElementById('emCompose').style.display = 'flex';
    loadMessages();
  },
  onNeedAuth: function() {
    console.log('[Gmail] No token — showing auth card');
    showAuthCard();
  },
  onSignOut: function() {
    console.log('[Gmail] Signed out');
    accessToken = null;
    showAuthCard();
  },
});

// -------------------------------------------------------
// Gmail API — returns data on success, { _error, _status, _message } on failure
// -------------------------------------------------------
async function gmailFetch(path, opts) {
  // Always get a fresh (or silently refreshed) token before each call
  const tok = await GoogleAuth.getToken();
  if (!tok) {
    console.warn('[Gmail] gmailFetch — not authenticated');
    return { _error: true, _status: 0, _message: 'Not authenticated' };
  }
  accessToken = tok;
  const url = GMAIL_API + path;
  console.log('[Gmail] →', path.split('?')[0], path.includes('?') ? '?' + path.split('?')[1].slice(0, 60) : '');
  let res;
  try {
    res = await fetch(url, {
      ...(opts || {}),
      headers: { 'Authorization': 'Bearer ' + tok, ...((opts && opts.headers) || {}) },
    });
  } catch (err) {
    console.error('[Gmail] Network error on', path, err);
    return { _error: true, _status: 0, _message: 'Network error — ' + err.message };
  }
  console.log('[Gmail] ←', res.status, path.split('?')[0]);
  if (!res.ok) {
    let body = null;
    try { body = await res.json(); } catch (_) {}
    const msg = (body && body.error && body.error.message) || ('HTTP ' + res.status);
    console.error('[Gmail] API error', res.status, msg, JSON.stringify(body));
    if (res.status === 401) {
      // Token rejected by Google despite refresh — force full re-auth
      GoogleAuth.signOut();
    }
    return { _error: true, _status: res.status, _message: msg, _body: body };
  }
  const data = await res.json();
  return data;
}

// -------------------------------------------------------
// Error / state display
// -------------------------------------------------------
function showState(html) {
  document.getElementById('emStateWrap').innerHTML = `<div class="em-state">${html}</div>`;
}

function showApiError(result, context) {
  if (!result || !result._error) return;
  const status = result._status;
  const msg = result._message || 'Unknown error';
  console.error('[Gmail] Displaying error for', context, '| status:', status, '| message:', msg);

  if (status === 0) {
    showState(`<strong style="color:rgba(255,200,120,0.95)">Network error</strong><br>
      ${esc(msg)}<br><small style="opacity:.5">Check your connection and refresh.</small>`);
    return;
  }
  if (status === 401) {
    showAuthCard();
    return;
  }
  if (status === 403) {
    const bodyStr = JSON.stringify(result._body || '');
    const isApiDisabled = msg.includes('disabled') || msg.includes('has not been used') ||
      msg.includes('accessNotConfigured') || bodyStr.includes('SERVICE_DISABLED') ||
      bodyStr.includes('accessNotConfigured');
    if (isApiDisabled) {
      showState(`<strong style="color:rgba(255,200,120,0.95)">Gmail API not enabled</strong><br>
        The Gmail API must be enabled in your Google Cloud project.<br>
        <a href="https://console.cloud.google.com/apis/library/gmail.googleapis.com" target="_blank"
          style="color:var(--mint);text-decoration:underline">Enable Gmail API at console.cloud.google.com →</a><br>
        <small style="opacity:.5;display:block;margin-top:6px">After enabling, refresh this page.<br>Error: ${esc(msg)}</small>`);
    } else {
      showState(`<strong style="color:rgba(255,200,120,0.95)">Gmail access not granted</strong><br>
        Your current sign-in doesn't include Gmail permission.<br>
        <button onclick="reauthorize()" style="margin-top:12px;padding:10px 20px;background:var(--mint-dim);border:1.5px solid var(--mint);border-radius:12px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">Grant Gmail Access</button><br>
        <small style="opacity:.5;display:block;margin-top:6px">Error: ${esc(msg)}</small>`);
    }
    return;
  }
  showState(`<strong style="color:rgba(255,200,120,0.95)">Failed to load ${esc(context)}</strong><br>
    ${esc(msg)}<br><small style="opacity:.5">HTTP ${status}</small>`);
}

// -------------------------------------------------------
// Folder / category query
// -------------------------------------------------------
function buildQuery() {
  if (activeFolder === 'sent') return 'in:sent';
  if (activeFolder === 'spam') return 'in:spam';
  return 'in:inbox category:' + activeCategory;
}

function emptyMessage() {
  if (activeFolder === 'sent') return "You haven't sent anything yet.";
  if (activeFolder === 'spam') return 'No spam — your spam folder is clear.';
  const labels = { primary: 'Primary', promotions: 'Promotions', social: 'Social', updates: 'Updates' };
  return 'Nothing in ' + (labels[activeCategory] || 'this category') + '.';
}

// -------------------------------------------------------
// Message load (folder + category aware)
// -------------------------------------------------------
async function loadMessages() {
  applyChrome();
  showState('<div class="spinner"></div>Loading…');
  document.getElementById('emHead').style.display = 'none';
  document.getElementById('emTriage').style.display = 'none';
  document.getElementById('emList').style.display = 'none';

  const q = buildQuery();
  console.log('[Gmail] Fetching message list…', q);
  const listData = await gmailFetch('/messages?q=' + encodeURIComponent(q) + '&maxResults=40');
  if (listData && listData._error) { showApiError(listData, activeFolder); return; }
  if (!listData) { showState('Unexpected error — no response from Gmail.'); return; }

  console.log('[Gmail] List response: resultSizeEstimate =', listData.resultSizeEstimate,
    '| messages returned =', (listData.messages || []).length);

  const ids = (listData.messages || []).map(m => m.id);
  if (!ids.length) {
    document.getElementById('emHead').style.display = '';
    showState(emptyMessage());
    return;
  }

  showState('<div class="spinner"></div>Fetching ' + ids.length + ' messages…');
  console.log('[Gmail] Fetching metadata for', ids.length, 'messages in parallel…');

  const metas = await Promise.all(ids.map(id =>
    gmailFetch(`/messages/${id}?format=metadata&metadataHeaders=From,To,Subject,Date`).catch(err => {
      console.error('[Gmail] Metadata fetch threw for', id, err);
      return null;
    })
  ));

  const good = metas.filter(m => m && !m._error);
  const errors = metas.filter(m => !m || m._error);
  console.log('[Gmail] Metadata done — ok:', good.length, '| errors:', errors.length);
  if (errors.length) console.warn('[Gmail] Failed messages:', errors.map(m => m && m._message));

  if (!good.length) {
    const firstErr = metas.find(m => m && m._error);
    if (firstErr) { showApiError(firstErr, 'messages'); } else { showState('Could not load any messages.'); }
    return;
  }

  allEmails = good;
  document.getElementById('emStateWrap').innerHTML = '';
  renderList();
}

// -------------------------------------------------------
// Search
// -------------------------------------------------------
async function runSearch(q) {
  showState('<div class="spinner"></div>Searching…');
  document.getElementById('emHead').style.display = 'none';
  document.getElementById('emTriage').style.display = 'none';
  document.getElementById('emList').style.display = 'none';

  console.log('[Gmail] Searching:', q);
  const listData = await gmailFetch(`/messages?q=${encodeURIComponent(q)}&maxResults=30`);
  if (listData && listData._error) { showApiError(listData, 'search'); return; }
  if (!listData) return;

  const ids = (listData.messages || []).map(m => m.id);
  if (!ids.length) {
    showState(`No results for "<em>${esc(searchQuery)}</em>".`);
    return;
  }

  showState('<div class="spinner"></div>Loading ' + ids.length + ' results…');
  const metas = await Promise.all(ids.map(id =>
    gmailFetch(`/messages/${id}?format=metadata&metadataHeaders=From,To,Subject,Date`).catch(() => null)
  ));
  allEmails = metas.filter(m => m && !m._error);
  document.getElementById('emStateWrap').innerHTML = '';
  renderList();
}

// -------------------------------------------------------
// Render helpers
// -------------------------------------------------------
const LABEL_MAP = {
  IMPORTANT:            { label: 'Important', color: '#F6BF26' },
  STARRED:              { label: 'Starred',   color: '#F6BF26' },
  CATEGORY_PROMOTIONS:  { label: 'Promotions',color: null },
  CATEGORY_SOCIAL:      { label: 'Social',    color: null },
  CATEGORY_UPDATES:     { label: 'Updates',   color: null },
  CATEGORY_FORUMS:      { label: 'Forums',    color: null },
};
const HIDE_LABELS = new Set(['INBOX','UNREAD','SENT','TRASH','DRAFT','SPAM']);

// Avatar gradients — picked deterministically from sender name
const AVATAR_GRADS = [
  'linear-gradient(150deg,#3a5bbf,#6f9bff)',
  'linear-gradient(150deg,#b5743a,#d9b25a)',
  'linear-gradient(150deg,#2c8a5f,#2de8a2)',
  'linear-gradient(150deg,#7a3a9f,#b06fff)',
  'linear-gradient(150deg,#b53a5b,#ff6f9b)',
  'linear-gradient(150deg,#2f8f8a,#2de8d0)',
];
function avatarGrad(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return AVATAR_GRADS[h % AVATAR_GRADS.length];
}
function avatarInitial(name) {
  const t = (name || '').trim();
  const ch = t.charAt(0);
  return ch ? ch.toUpperCase() : '?';
}

function isUnread(msg) { return (msg.labelIds || []).includes('UNREAD'); }
function isImportant(msg) { return (msg.labelIds || []).includes('IMPORTANT'); }

function header(msg, name) {
  const hdrs = (msg.payload && msg.payload.headers) || [];
  const lname = name.toLowerCase();
  return (hdrs.find(h => h.name && h.name.toLowerCase() === lname) || {}).value || '';
}

// Update title + category-row visibility for the active folder
function applyChrome() {
  const titles = { inbox: 'Inbox', sent: 'Sent', spam: 'Spam' };
  document.getElementById('emTitle').textContent = titles[activeFolder] || 'Inbox';
  document.getElementById('emCats').style.display = activeFolder === 'inbox' ? '' : 'none';
}

function parseSender(from) {
  const m = from.match(/^(.+?)\s*<[^>]+>$/);
  if (m) return m[1].replace(/^"|"$/g, '').trim();
  return from.split('@')[0];
}

function parseSenderAddr(from) {
  const m = from.match(/<([^>]+)>/);
  if (m) return m[1].trim();
  return from.trim();
}

function fmtDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const sameYear = d.getFullYear() === now.getFullYear();
  if (sameYear) return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: '2-digit' });
}

function visibleLabels(msg) {
  return (msg.labelIds || [])
    .filter(id => !HIDE_LABELS.has(id) && LABEL_MAP[id])
    .map(id => LABEL_MAP[id]);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateTriage(unreadCount, total) {
  const banner = document.getElementById('emTriage');
  const text = document.getElementById('emTriageText');
  // Summary banner only on inbox folders (not Sent / Spam) and not while searching
  if (activeFolder !== 'inbox' || searchQuery || !total) {
    banner.style.display = 'none';
    return;
  }
  if (unreadCount > 0) {
    const noun = unreadCount === 1 ? 'message needs' : 'messages need';
    text.innerHTML = `<strong>${unreadCount} unread</strong> ${noun} a look — ${total} in your inbox.`;
  } else {
    text.innerHTML = `You're all caught up — nothing unread across ${total} messages.`;
  }
  banner.style.display = '';
}

function renderList() {
  const list = document.getElementById('emList');
  const head = document.getElementById('emHead');
  const badge = document.getElementById('emUnreadBadge');
  const badgeText = document.getElementById('emUnreadText');

  const visible = allEmails;
  const sentView = activeFolder === 'sent';
  const unreadCount = allEmails.filter(isUnread).length;

  if (unreadCount > 0) {
    badgeText.textContent = unreadCount + ' unread';
    badge.style.display = '';
  } else {
    badge.style.display = 'none';
  }
  head.style.display = '';
  updateTriage(unreadCount, allEmails.length);

  if (!visible.length) {
    list.style.display = 'none';
    document.getElementById('emStateWrap').innerHTML =
      '<div class="em-state">No messages to show.</div>';
    return;
  }

  document.getElementById('emStateWrap').innerHTML = '';
  list.style.display = '';
  list.innerHTML = visible.map((msg, i) => {
    const unread = isUnread(msg);
    // In Sent, the meaningful party is the recipient, not yourself
    const partyRaw = sentView ? (header(msg, 'To') || header(msg, 'From')) : header(msg, 'From');
    const party = parseSender(partyRaw);
    const display = sentView ? ('To ' + party) : party;
    const subject = header(msg, 'Subject') || '(No subject)';
    const date = fmtDate(header(msg, 'Date'));
    const snippet = msg.snippet || '';
    const labels = visibleLabels(msg);

    const chipHtml = labels.map(l =>
      `<span class="em-chip"${l.color ? ` style="color:${l.color};border-color:${l.color}40"` : ''}>${esc(l.label)}</span>`
    ).join('');

    return `<div class="em-row ${unread ? 'unread' : 'read'}" data-idx="${i}">
      <div class="em-avatar" style="background:${avatarGrad(party)}">${esc(avatarInitial(party))}</div>
      <div class="em-row-body">
        <div class="em-row-top">
          <span class="em-sender">${esc(display)}</span>
          <span class="em-time">${esc(date)}</span>
        </div>
        <div class="em-subject">${esc(subject)}</div>
        <div class="em-snippet">${esc(snippet)}</div>
        ${chipHtml ? `<div class="em-labels">${chipHtml}</div>` : ''}
      </div>
      ${unread ? '<div class="em-unread-dot"></div>' : ''}
    </div>`;
  }).join('');

  list.querySelectorAll('.em-row').forEach(row => {
    row.addEventListener('click', () => openDetail(parseInt(row.dataset.idx)));
  });
}

// -------------------------------------------------------
// Email detail
// -------------------------------------------------------
async function openDetail(idx) {
  const msg = allEmails[idx];
  if (!msg) return;

  const sentView = activeFolder === 'sent';
  const from = header(msg, 'From');
  const to = header(msg, 'To');
  // Avatar/name reflect the other party (recipient in Sent, sender elsewhere)
  const partyRaw = sentView ? (to || from) : from;
  const party = parseSender(partyRaw);
  const addr = parseSenderAddr(partyRaw);

  // Header — avatar + party
  const avatar = document.getElementById('sheetAvatar');
  avatar.style.background = avatarGrad(party);
  avatar.textContent = avatarInitial(party);
  document.getElementById('sheetFromName').textContent = sentView ? ('To ' + party) : party;
  document.getElementById('sheetFromAddr').textContent = addr;

  document.getElementById('sheetSubject').textContent = header(msg, 'Subject') || '(No subject)';

  // Labels chips
  const labels = visibleLabels(msg);
  document.getElementById('sheetLabels').innerHTML = labels.map(l =>
    `<span class="em-chip"${l.color ? ` style="color:${l.color};border-color:${l.color}40"` : ''}>${esc(l.label)}</span>`
  ).join('');

  // Meta
  const date = header(msg, 'Date');
  document.getElementById('sheetMeta').innerHTML =
    `<div class="sheet-meta-row"><span class="sheet-meta-label">From</span><span class="sheet-meta-val">${esc(from)}</span></div>` +
    (to ? `<div class="sheet-meta-row"><span class="sheet-meta-label">To</span><span class="sheet-meta-val">${esc(to)}</span></div>` : '') +
    (date ? `<div class="sheet-meta-row"><span class="sheet-meta-label">Date</span><span class="sheet-meta-val">${esc(new Date(date).toLocaleString())}</span></div>` : '');

  // Show sheet immediately with snippet, fetch full body async
  document.getElementById('sheetBody').textContent = msg.snippet || '';
  document.getElementById('sheetBg').classList.add('show');
  document.body.style.overflow = 'hidden';

  // Fetch full message
  const full = await gmailFetch(`/messages/${msg.id}?format=full`);
  if (full) {
    const bodyText = extractBodyText(full.payload);
    if (bodyText) document.getElementById('sheetBody').textContent = bodyText.trim();
  }
}

function extractBodyText(payload) {
  if (!payload) return '';

  function decodeB64(data) {
    if (!data) return '';
    const s = data.replace(/-/g, '+').replace(/_/g, '/');
    try { return decodeURIComponent(escape(atob(s))); } catch(_) {
      try { return atob(s); } catch(_) { return ''; }
    }
  }

  function stripHtml(html) {
    const d = document.createElement('div');
    d.innerHTML = html;
    return d.textContent || '';
  }

  function walk(p) {
    if (!p) return '';
    if (p.body && p.body.data) {
      const txt = decodeB64(p.body.data);
      if (p.mimeType === 'text/plain') return txt;
      if (p.mimeType === 'text/html') return stripHtml(txt);
    }
    if (p.parts) {
      const plain = p.parts.find(x => x.mimeType === 'text/plain');
      if (plain) { const r = walk(plain); if (r) return r; }
      const html = p.parts.find(x => x.mimeType === 'text/html');
      if (html) { const r = walk(html); if (r) return r; }
      for (const part of p.parts) {
        const r = walk(part);
        if (r) return r;
      }
    }
    return '';
  }

  return walk(payload);
}

function closeSheet() {
  document.getElementById('sheetBg').classList.remove('show');
  document.body.style.overflow = '';
}

// -------------------------------------------------------
// Wire up
// -------------------------------------------------------
document.getElementById('authBtn').addEventListener('click', authenticate);

document.getElementById('sheetBg').addEventListener('click', e => {
  if (e.target === document.getElementById('sheetBg')) closeSheet();
});

// Compose — open Gmail's compose window in a new tab
document.getElementById('emCompose').addEventListener('click', () => {
  window.open('https://mail.google.com/mail/?view=cm&fs=1&tf=1', '_blank', 'noopener');
});

// Scope a search query to the folder currently open
function scopedSearch(q) {
  const prefix = activeFolder === 'sent' ? 'in:sent ' : activeFolder === 'spam' ? 'in:spam ' : 'in:inbox ';
  searchQuery = q;
  runSearch(prefix + q);
}

// Folder switcher — Inbox / Sent / Spam
document.getElementById('emFolders').addEventListener('click', e => {
  const btn = e.target.closest('.em-folder');
  if (!btn || btn.dataset.folder === activeFolder) return;
  activeFolder = btn.dataset.folder;
  document.querySelectorAll('.em-folder').forEach(f => f.classList.toggle('active', f === btn));
  document.getElementById('emSearch').value = '';
  searchQuery = '';
  applyChrome();
  if (accessToken) loadMessages();
});

// Category chips — Primary / Promotions / Social / Updates
document.getElementById('emCats').addEventListener('click', e => {
  const btn = e.target.closest('.em-cat');
  if (!btn || btn.dataset.cat === activeCategory) return;
  activeCategory = btn.dataset.cat;
  document.querySelectorAll('.em-cat').forEach(c => c.classList.toggle('active', c === btn));
  document.getElementById('emSearch').value = '';
  searchQuery = '';
  if (accessToken) loadMessages();
});

// Search with debounce
let _searchTimer = null;
document.getElementById('emSearch').addEventListener('input', e => {
  clearTimeout(_searchTimer);
  const q = e.target.value.trim();
  if (!q) {
    if (searchQuery) { searchQuery = ''; if (accessToken) loadMessages(); }
    return;
  }
  _searchTimer = setTimeout(() => {
    if (!accessToken) return;
    scopedSearch(q);
  }, 600);
});

document.getElementById('emSearch').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    clearTimeout(_searchTimer);
    const q = e.target.value.trim();
    if (q && accessToken) scopedSearch(q);
  }
});

applyChrome();
</script>
