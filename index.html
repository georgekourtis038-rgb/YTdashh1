<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d0c">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="axis-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Axis</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
html,body{
  background:#0a0e0d;
  font-family:'Geist','Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;
  color:rgba(255,255,255,.86);
  min-height:100vh;
  overflow-x:hidden;
}
body{
  background:radial-gradient(130% 75% at 50% -8%,#0e1715 0%,#0a0e0d 45%,#070b0a 100%);
}
::-webkit-scrollbar{width:0;height:0}
.page{
  max-width:430px;
  margin:0 auto;
  padding:14px 20px calc(110px + env(safe-area-inset-bottom));
}
/* Tab bar — matches the design floating pill but full-width for real pages */
.tab-bar{
  position:fixed;
  left:0;right:0;bottom:0;
  display:flex;
  align-items:center;
  padding:0 6px;
  padding-bottom:env(safe-area-inset-bottom);
  height:calc(66px + env(safe-area-inset-bottom));
  z-index:100;
  background:rgba(12,18,16,.72);
  -webkit-backdrop-filter:blur(26px) saturate(170%);
  backdrop-filter:blur(26px) saturate(170%);
  box-shadow:0 14px 44px -10px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.09),inset 0 0 0 1px rgba(255,255,255,.06);
}
.tab-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  background:none;border:none;cursor:pointer;
  font:500 10px/1 'Geist',sans-serif;
  color:rgba(255,255,255,.4);
  text-decoration:none;
  padding:8px 0;
  -webkit-tap-highlight-color:transparent;
  transition:color .15s;
}
.tab-btn.active{color:#2de8a2}
/* Todo row */
.todo-row{
  display:flex;align-items:center;gap:13px;
  padding:13px 0;
  cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.05);
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
.todo-row:last-child{border-bottom:none}
.todo-check-done{
  width:22px;height:22px;border-radius:7px;flex:0 0 auto;
  background:#2de8a2;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 12px rgba(45,232,162,.45);
}
.todo-check-undone{
  width:22px;height:22px;border-radius:7px;flex:0 0 auto;
  border:1.5px solid rgba(255,255,255,.22);
}
.todo-text-done{font-size:15px;font-weight:500;color:rgba(255,255,255,.3);text-decoration:line-through}
.todo-text-undone{font-size:15px;font-weight:500;color:rgba(255,255,255,.9)}
/* Goal row */
.goal-row{margin-bottom:18px}
.goal-row:last-child{margin-bottom:0}
.goal-bar-track{height:7px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}
.goal-bar-green{height:100%;border-radius:6px;background:linear-gradient(90deg,#13b683,#2de8a2);box-shadow:0 0 12px rgba(45,232,162,.5)}
.goal-bar-blue{height:100%;border-radius:6px;background:linear-gradient(90deg,#4a72c8,#6f9bff);box-shadow:0 0 12px rgba(111,155,255,.45)}
/* Empty / error states */
.empty-state{font-size:13.5px;color:rgba(255,255,255,.35);text-align:center;padding:16px 0}
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:22px">
    <div>
      <div id="axDate" style="font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.1em;color:rgba(255,255,255,.4);text-transform:uppercase"></div>
      <h1 id="axGreeting" style="font-family:'Geist','Space Grotesk',sans-serif;font-weight:600;font-size:29px;letter-spacing:-.02em;color:#fff;margin-top:5px">Good morning</h1>
    </div>
    <div id="axAvatar" style="width:42px;height:42px;border-radius:50%;background:linear-gradient(150deg,#1c2c27,#0e1614);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-family:'Geist',sans-serif;font-weight:600;font-size:16px;color:#2de8a2">G</div>
  </div>

  <!-- DAY PROGRESS RING CARD -->
  <div style="position:relative;border-radius:24px;padding:24px;margin-bottom:14px;background:linear-gradient(180deg,rgba(45,232,162,.08),rgba(255,255,255,.022));border:1px solid rgba(45,232,162,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 30px -14px rgba(45,232,162,.35);overflow:hidden">
    <div style="position:absolute;top:-40px;right:-30px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(45,232,162,.18),transparent 70%);filter:blur(6px)"></div>
    <div style="display:flex;align-items:center;gap:22px;position:relative">
      <div style="position:relative;width:128px;height:128px;flex:0 0 auto">
        <svg width="128" height="128" viewBox="0 0 128 128" style="transform:rotate(-90deg)">
          <circle cx="64" cy="64" r="56" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="9"></circle>
          <circle id="dayRingFill" cx="64" cy="64" r="56" fill="none" stroke="#2de8a2" stroke-width="9" stroke-linecap="round" stroke-dasharray="352" stroke-dashoffset="352" style="filter:drop-shadow(0 0 6px rgba(45,232,162,.6));transition:stroke-dashoffset .7s cubic-bezier(.22,1,.36,1),stroke .7s"></circle>
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <span id="dayRingPercent" style="font-family:'Geist','Space Grotesk',sans-serif;font-weight:600;font-size:34px;color:#fff;line-height:1;letter-spacing:-.03em">—</span>
          <span id="dayRingPhase" style="font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.12em;color:rgba(45,232,162,.85);text-transform:uppercase;margin-top:2px"></span>
        </div>
      </div>
      <div style="flex:1">
        <div style="font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.4);text-transform:uppercase;margin-bottom:8px">Day progress</div>
        <div id="dayRingStatus" style="font-family:'Geist','Space Grotesk',sans-serif;font-weight:600;font-size:19px;color:#fff;margin-bottom:6px"></div>
        <div id="dayRingRemaining" style="font-size:13.5px;color:rgba(255,255,255,.55);line-height:1.5"></div>
      </div>
    </div>
  </div>

  <!-- TODAY TODOS CARD -->
  <div style="border-radius:24px;padding:20px 20px 12px;margin-bottom:14px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.022));border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <span style="font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.16em;color:rgba(255,255,255,.42);text-transform:uppercase">Today</span>
      <span id="todayCount" style="font-family:'Geist Mono',monospace;font-size:12px;color:#2de8a2"></span>
    </div>
    <div id="todoList"><p class="empty-state">Loading…</p></div>
  </div>

  <!-- LONG-TERM GOALS CARD -->
  <div style="border-radius:24px;padding:20px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.022));border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)">
    <div style="font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.16em;color:rgba(255,255,255,.42);text-transform:uppercase;margin-bottom:18px">Long-term goals</div>
    <div id="goalsList"><p class="empty-state">Loading…</p></div>
  </div>

</div><!-- /.page -->

<!-- BOTTOM TAB BAR -->
<nav class="tab-bar">
  <a href="index.html" class="tab-btn active">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="6" cy="6" r="2.4" fill="currentColor"></circle><circle cx="16" cy="6" r="2.4" fill="currentColor"></circle><circle cx="6" cy="16" r="2.4" fill="currentColor"></circle><circle cx="16" cy="16" r="2.4" fill="currentColor"></circle></svg>
    Main
  </a>
  <a href="health.html" class="tab-btn">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 20.5C5.5 16 3 12.4 3 8.8 3 6.1 5 4 7.6 4c1.7 0 3.2.9 4.4 2.4C13.2 4.9 14.7 4 16.4 4 19 4 21 6.1 21 8.8c0 3.6-2.5 7.2-9 11.7Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"></path></svg>
    Health
  </a>
  <a href="gym.html" class="tab-btn">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6.5 9v6M17.5 9v6M4 10.5v3M20 10.5v3M6.5 12h11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
    Fitness
  </a>
  <a href="calendar.html" class="tab-btn">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="15" rx="3" stroke="currentColor" stroke-width="1.7"></rect><path d="M3.5 9h17M8 3v3M16 3v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
    Calendar
  </a>
  <a href="email.html" class="tab-btn">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="5.5" width="18" height="13" rx="3" stroke="currentColor" stroke-width="1.7"></rect><path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    Email
  </a>
</nav>

<script>
(function () {
  'use strict';

  const SUPABASE_URL = 'https://oyylbiscxnymnmetyrho.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95eWxiaXNjeG55bW5tZXR5cmhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMzQ1MDgsImV4cCI6MjA5NTcxMDUwOH0.3xxHcp3Z4vJWHEGFV_iUW_YeJ2gdUPqYiNAQkYnR-qU';
  const APP_KEY = 'goals';

  // ── Shared state ────────────────────────────────────────────
  let _supa = null;
  let _appData = {}; // full data object from app_state row

  // ── Helpers ─────────────────────────────────────────────────
  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function dateToKey(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
  }
  function getActiveDateString() {
    const now = new Date();
    if (now.getHours() < 6) {
      const d = new Date(now); d.setDate(d.getDate()-1); return dateToKey(d);
    }
    return dateToKey(now);
  }
  function formatRemaining(totalMin) {
    const h = Math.floor(totalMin / 60), m = Math.floor(totalMin % 60);
    return h + 'h ' + m + 'm';
  }
  function getWakeSleepMins() {
    function pm(str, defHour) {
      if (!str) return defHour * 60;
      const p = str.split(':');
      return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
    }
    const wake = pm(localStorage.getItem('dash_wake_time'), 8);
    let sleep = pm(localStorage.getItem('dash_sleep_time'), 24);
    if (sleep <= wake) sleep += 1440;
    return { wake, sleep };
  }

  // ── Day ring ─────────────────────────────────────────────────
  const PALETTE = [
    [0,    [255,216,158]], [12.5, [255,205,121]], [25,   [255,227,143]],
    [37.5, [255,183,106]], [50,   [255,149, 89]], [62.5, [243,111, 79]],
    [75,   [226, 93,122]], [87.5, [123, 91,176]], [100,  [ 47, 58,102]]
  ];
  function lerp(a,b,t){return a+(b-a)*t;}
  function paletteAt(p) {
    if (p <= PALETTE[0][0]) return PALETTE[0][1];
    if (p >= PALETTE[PALETTE.length-1][0]) return PALETTE[PALETTE.length-1][1];
    for (let i=0; i<PALETTE.length-1; i++) {
      const [p0,c0]=PALETTE[i], [p1,c1]=PALETTE[i+1];
      if (p>=p0 && p<=p1) {
        const t=(p-p0)/(p1-p0);
        return [lerp(c0[0],c1[0],t), lerp(c0[1],c1[1],t), lerp(c0[2],c1[2],t)];
      }
    }
    return [255,255,255];
  }
  function rgbStr(c) { return 'rgb('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+')'; }

  const C = 2 * Math.PI * 56; // circumference for r=56
  const fillEl      = document.getElementById('dayRingFill');
  const percentEl   = document.getElementById('dayRingPercent');
  const phaseEl     = document.getElementById('dayRingPhase');
  const statusEl    = document.getElementById('dayRingStatus');
  const remainingEl = document.getElementById('dayRingRemaining');
  fillEl.setAttribute('stroke-dasharray', C);

  function updateDayRing() {
    const {wake: WAKE_MIN, sleep: SLEEP_MIN} = getWakeSleepMins();
    const now = new Date();
    const nowMins = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;

    if (nowMins < WAKE_MIN) {
      fillEl.setAttribute('stroke-dashoffset', C);
      fillEl.style.stroke = '#4D4B47';
      percentEl.textContent = '—';
      phaseEl.textContent   = 'SLEEPING';
      statusEl.textContent  = 'Still sleeping';
      remainingEl.textContent = formatRemaining(WAKE_MIN - nowMins) + ' until wake-up';
      return;
    }
    if (nowMins >= SLEEP_MIN) {
      fillEl.setAttribute('stroke-dashoffset', 0);
      fillEl.style.stroke = '#E25D7A';
      percentEl.innerHTML = '100<span style="font-size:18px;color:rgba(255,255,255,.5)">%</span>';
      phaseEl.textContent   = 'PAST BEDTIME';
      statusEl.textContent  = 'Past bedtime';
      remainingEl.textContent = 'Sleep!';
      return;
    }

    const span = SLEEP_MIN - WAKE_MIN;
    const pct  = (nowMins - WAKE_MIN) / span * 100;
    fillEl.setAttribute('stroke-dashoffset', C * (1 - pct/100));
    fillEl.style.stroke = rgbStr(paletteAt(pct));
    percentEl.innerHTML = Math.floor(pct) + '<span style="font-size:18px;color:rgba(255,255,255,.5)">%</span>';

    let phase, status;
    if      (pct < 25) { phase='MORNING';   status='On track'; }
    else if (pct < 50) { phase='MIDDAY';    status='Keep moving'; }
    else if (pct < 75) { phase='AFTERNOON'; status='Push it'; }
    else if (pct < 90) { phase='EVENING';   status='Wrap up'; }
    else               { phase='BEDTIME';   status='Bedtime soon'; }
    phaseEl.textContent   = phase;
    statusEl.textContent  = status;
    remainingEl.textContent = formatRemaining(SLEEP_MIN - nowMins) + ' awake time left';
  }

  // ── Todos ────────────────────────────────────────────────────
  let _todos = [];

  function renderTodos(todos) {
    _todos = todos;
    const listEl  = document.getElementById('todoList');
    const countEl = document.getElementById('todayCount');
    const done    = todos.filter(t => t.done).length;
    countEl.textContent = done + '/' + todos.length;

    if (!todos.length) {
      listEl.innerHTML = '<p class="empty-state">No goals for today yet.</p>';
      return;
    }
    listEl.innerHTML = '';
    todos.forEach(function(todo, i) {
      const row = document.createElement('div');
      row.className = 'todo-row';
      row.innerHTML =
        '<div class="' + (todo.done ? 'todo-check-done' : 'todo-check-undone') + '">' +
          (todo.done
            ? '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 6.3 5 8.8l4.5-5.4" stroke="#04140d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>'
            : '') +
        '</div>' +
        '<span class="' + (todo.done ? 'todo-text-done' : 'todo-text-undone') + '">' + esc(todo.text) + '</span>';
      row.addEventListener('click', function() { toggleTodo(i); });
      listEl.appendChild(row);
    });
  }

  async function toggleTodo(i) {
    const todos = _todos.map(function(t,j) {
      if (j !== i) return t;
      const next = !t.done;
      return Object.assign({}, t, { done: next, doneAt: next ? new Date().toISOString() : undefined });
    });
    const key = 'goals:' + getActiveDateString();
    _appData[key] = todos;
    try { localStorage.setItem(key, JSON.stringify(todos)); } catch(_) {}
    renderTodos(todos);
    if (_supa) {
      try {
        await _supa.from('app_state').upsert(
          { key: APP_KEY, data: _appData, updated_at: new Date().toISOString() },
          { onConflict: 'key' }
        );
      } catch(_) {}
    }
  }

  // ── Long-term goals ──────────────────────────────────────────
  function renderGoals(goals) {
    const container = document.getElementById('goalsList');
    if (!goals.length) {
      container.innerHTML = '<p class="empty-state">No long-term goals yet.</p>';
      return;
    }
    container.innerHTML = '';
    goals.forEach(function(goal) {
      const cur = goal.currentValue != null ? parseFloat(goal.currentValue) : null;
      const s   = parseFloat(goal.startValue);
      const t   = parseFloat(goal.targetValue);
      const pct = (cur != null && !isNaN(s) && !isNaN(t) && t !== s)
        ? Math.min(100, Math.max(0, (cur - s) / (t - s) * 100)) : 0;

      let sub = '';
      if (cur != null && !isNaN(t)) {
        const curFmt = parseFloat(cur).toLocaleString(undefined, {maximumFractionDigits:1});
        const rem    = Math.abs(t - cur).toLocaleString(undefined, {maximumFractionDigits:1});
        sub = curFmt + (goal.unit ? ' ' + esc(goal.unit) : '') + ' · ' + rem + ' to go';
      } else if (!isNaN(t)) {
        const tFmt = parseFloat(t).toLocaleString(undefined, {maximumFractionDigits:0});
        sub = '0 / ' + tFmt + (goal.unit ? ' ' + esc(goal.unit) : '');
      }

      const useBlue = goal.category === 'fitness' || goal.category === 'reading' || goal.category === 'books';
      const row = document.createElement('div');
      row.className = 'goal-row';
      row.innerHTML =
        '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px">' +
          '<span style="font-size:15px;color:rgba(255,255,255,.9);font-weight:500">' + esc(goal.title) + '</span>' +
          '<span style="font-family:\'Geist Mono\',monospace;font-size:12px;color:rgba(255,255,255,.5)">' + sub + '</span>' +
        '</div>' +
        '<div class="goal-bar-track"><div class="' + (useBlue ? 'goal-bar-blue' : 'goal-bar-green') + '" style="width:' + pct.toFixed(1) + '%"></div></div>';
      container.appendChild(row);
    });
  }

  // ── Hydrate from Supabase data ───────────────────────────────
  function applyData(data) {
    _appData = data;
    // Seed localStorage so other scripts (if any) stay coherent
    try {
      Object.keys(data).forEach(function(k) {
        localStorage.setItem(k, JSON.stringify(data[k]));
      });
    } catch(_) {}
    const todayKey = 'goals:' + getActiveDateString();
    renderTodos(Array.isArray(data[todayKey]) ? data[todayKey] : []);
    renderGoals(Array.isArray(data['axis_goals']) ? data['axis_goals'] : []);
  }

  // ── Init ────────────────────────────────────────────────────
  (async function init() {
    // Date label
    const now    = new Date();
    const days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    document.getElementById('axDate').textContent =
      days[now.getDay()] + ' · ' + months[now.getMonth()] + ' ' + now.getDate();

    // Day ring (immediate + recurring)
    updateDayRing();
    setInterval(updateDayRing, 60000);

    if (!window.supabase) {
      renderTodos([]); renderGoals([]); return;
    }
    _supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ── Auth: pull first name ──────────────────────────────────
    try {
      const { data: authData } = await _supa.auth.getUser();
      const user = authData && authData.user;
      if (user) {
        const meta = user.user_metadata || {};
        const full = meta.full_name || meta.name || '';
        const firstName = full.split(' ')[0] || user.email.split('@')[0] || 'George';
        const h   = now.getHours();
        const tod = h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
        document.getElementById('axGreeting').textContent = 'Good ' + tod + ', ' + firstName;
        document.getElementById('axAvatar').textContent   = firstName[0].toUpperCase();
      }
    } catch(_) {}

    // ── Fetch app_state ────────────────────────────────────────
    try {
      const { data, error } = await _supa
        .from('app_state')
        .select('data')
        .eq('key', APP_KEY)
        .maybeSingle();
      if (!error && data && data.data && Object.keys(data.data).length) {
        applyData(data.data);
      } else {
        renderTodos([]); renderGoals([]);
      }
    } catch(_) {
      renderTodos([]); renderGoals([]);
    }

    // ── Realtime: live updates from other devices ──────────────
    _supa.channel('main_app_state')
      .on('postgres_changes', {
        event: '*', schema: 'public', table: 'app_state', filter: 'key=eq.' + APP_KEY
      }, function(payload) {
        if (!payload.new || !payload.new.data) return;
        applyData(payload.new.data);
      })
      .subscribe();
  })();

})();
</script>
</body>
</html>
