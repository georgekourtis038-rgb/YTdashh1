<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d0c">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="axis-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Axis</title>
<script src="topbar.js" defer></script>
<script src="/push-init.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
html,body{
  background:#0a0e0d;
  font-family:'Geist','Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;
  color:rgba(255,255,255,.86);
  min-height:100vh;
  overflow-x:hidden;
}
body{
  background:radial-gradient(130% 75% at 50% -8%,#0e1715 0%,#0a0e0d 45%,#070b0a 100%);
}
::-webkit-scrollbar{width:0;height:0}
.page{
  max-width:430px;
  margin:0 auto;
  padding:0 20px;
}
/* + add button used in card headers */
.ax-add-btn{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(45,232,162,.10);
  border:1px solid rgba(45,232,162,.28);
  border-radius:8px;
  color:#2de8a2;
  font-family:'Geist','Space Grotesk',sans-serif;
  font-size:12px;font-weight:600;
  padding:5px 10px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:background .15s;
}
.ax-add-btn:active{background:rgba(45,232,162,.18)}
/* Inline add-todo row */
.todo-add-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 0 4px;
  border-top:1px solid rgba(255,255,255,.05);
}
.todo-add-input{
  flex:1;background:rgba(255,255,255,.07);
  border:1px solid rgba(45,232,162,.3);
  border-radius:9px;
  color:#fff;
  font-family:'Geist',sans-serif;
  font-size:15px;
  padding:9px 12px;
  outline:none;
  -webkit-appearance:none;
}
.todo-add-input::placeholder{color:rgba(255,255,255,.3)}
.todo-add-submit{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(180deg,#2de8a2,#1ec78a);
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
/* ── Goal modal ── */
.ltg-modal-bg{
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  z-index:900;
  display:none;
  align-items:flex-end;
  justify-content:center;
}
.ltg-modal-bg.open{display:flex;animation:ltgBgIn .25s ease}
.ltg-modal{
  position:relative;
  width:100%;max-width:480px;max-height:92vh;
  background:
    radial-gradient(120% 55% at 50% 0%, rgba(45,232,162,.10), transparent 62%),
    linear-gradient(180deg,#0f1614,#0a0e0d);
  border:1px solid rgba(255,255,255,.10);
  border-bottom:none;
  border-radius:28px 28px 0 0;
  padding:10px 20px max(26px,calc(env(safe-area-inset-bottom)+18px));
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  box-shadow:0 -20px 60px -20px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.08);
}
.ltg-modal-bg.open .ltg-modal{animation:ltgSheetIn .36s cubic-bezier(.22,1,.36,1)}
@keyframes ltgBgIn{from{opacity:0}to{opacity:1}}
@keyframes ltgSheetIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
.ltg-handle{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:0 auto 18px}
.ltg-eyebrow{
  font-family:'Geist Mono',monospace;font-size:11px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:rgba(45,232,162,.85);margin-bottom:6px;
}
.ltg-modal-title{
  font-family:'Geist','Space Grotesk',sans-serif;font-size:24px;font-weight:600;
  letter-spacing:-.02em;color:#fff;margin-bottom:22px;line-height:1.15;
}
.ltg-field{margin-bottom:16px}
.ltg-label{
  font-family:'Geist Mono',monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.42);margin-bottom:8px;
}
.ltg-minput{
  width:100%;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.10);
  border-radius:12px;
  color:#fff;
  font-family:'Geist','Space Grotesk',sans-serif;
  font-size:16px;
  padding:12px 14px;
  outline:none;-webkit-appearance:none;box-sizing:border-box;
  transition:border-color .15s,background .15s;
}
.ltg-minput::placeholder{color:rgba(255,255,255,.3)}
.ltg-minput:focus{border-color:rgba(45,232,162,.5);background:rgba(45,232,162,.05)}

/* Category chips */
.ltg-cats{
  display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;padding:2px;margin:0 -2px;
}
.ltg-cats::-webkit-scrollbar{display:none}
.ltg-cat{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
  padding:9px 13px;border-radius:12px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.04);
  color:rgba(255,255,255,.6);
  font-family:'Geist',sans-serif;font-size:13px;font-weight:600;
  cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap;
  transition:background .15s,border-color .15s,color .15s;
}
.ltg-cat-ico{font-size:15px;line-height:1}
.ltg-cat.active{background:rgba(45,232,162,.14);border-color:rgba(45,232,162,.5);color:#2de8a2}

/* "Track a number" toggle */
.ltg-toggle-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px;border-radius:14px;margin-bottom:16px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
}
.ltg-toggle-txt{font-size:14.5px;color:rgba(255,255,255,.92);font-weight:500}
.ltg-toggle-sub{font-size:12px;color:rgba(255,255,255,.42);margin-top:3px;line-height:1.3}
.ltg-switch{
  position:relative;width:46px;height:27px;border-radius:99px;flex:0 0 auto;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.1);
  cursor:pointer;transition:background .2s;-webkit-tap-highlight-color:transparent;
}
.ltg-switch.on{background:linear-gradient(180deg,#2de8a2,#1ec78a);border-color:transparent}
.ltg-switch-knob{
  position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);
  transition:transform .22s cubic-bezier(.22,1.3,.4,1);
}
.ltg-switch.on .ltg-switch-knob{transform:translateX(19px)}

/* Numeric reveal */
.ltg-measure{max-height:0;opacity:0;overflow:hidden;transition:max-height .32s cubic-bezier(.22,1,.36,1),opacity .25s ease}
.ltg-measure.show{max-height:340px;opacity:1}
.ltg-grid2{display:flex;gap:10px}
.ltg-grid2>div{flex:1;min-width:0}

/* Buttons */
.ltg-modal-btns{display:flex;gap:8px;margin-top:22px}
.ltg-btn-save{
  flex:1;padding:14px;border-radius:14px;border:none;
  background:linear-gradient(180deg,#2de8a2,#1ec78a);
  color:#04140d;
  font-family:'Geist',sans-serif;font-size:15px;font-weight:700;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  box-shadow:0 8px 24px -8px rgba(45,232,162,.6);
  transition:transform .1s;
}
.ltg-btn-save:active{transform:scale(.98)}
.ltg-btn-cancel{
  padding:14px 18px;border-radius:14px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.04);
  color:rgba(255,255,255,.7);
  font-family:'Geist',sans-serif;font-size:15px;font-weight:600;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
/* Todo row */
.todo-row{
  display:flex;align-items:center;gap:13px;
  padding:13px 0;
  cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.05);
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
.todo-row:last-child{border-bottom:none}
.todo-check-done{
  width:22px;height:22px;border-radius:7px;flex:0 0 auto;
  background:#2de8a2;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 12px rgba(45,232,162,.45);
}
.todo-check-undone{
  width:22px;height:22px;border-radius:7px;flex:0 0 auto;
  border:1.5px solid rgba(255,255,255,.22);
}
.todo-text-done{font-size:15px;font-weight:500;color:rgba(255,255,255,.3);text-decoration:line-through}
.todo-text-undone{font-size:15px;font-weight:500;color:rgba(255,255,255,.9)}
/* Goal row */
.goal-row{margin-bottom:18px}
.goal-row:last-child{margin-bottom:0}
.goal-bar-track{height:7px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}
.goal-bar-green{height:100%;border-radius:6px;background:linear-gradient(90deg,#13b683,#2de8a2);box-shadow:0 0 12px rgba(45,232,162,.5)}
.goal-bar-blue{height:100%;border-radius:6px;background:linear-gradient(90deg,#4a72c8,#6f9bff);box-shadow:0 0 12px rgba(111,155,255,.45)}
/* Empty / error states */
.empty-state{font-size:13.5px;color:rgba(255,255,255,.35);text-align:center;padding:16px 0}

/* ── Animations ── */
@keyframes axRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes axPop{0%{transform:scale(.5)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes axRowIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.reveal{opacity:0;animation:axRise .55s cubic-bezier(.22,1,.36,1) forwards}
.todo-check-done svg{animation:axPop .32s cubic-bezier(.22,1.5,.4,1)}
.goal-bar-green,.goal-bar-blue{transition:width .9s cubic-bezier(.22,1,.36,1)}

/* Todo row interactivity */
.todo-text-undone,.todo-text-done{flex:1;min-width:0;cursor:pointer}
.todo-actions{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.todo-act{
  width:28px;height:28px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.26);cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:color .15s,background .15s;flex:0 0 auto;
}
.todo-act:active{background:rgba(255,255,255,.08);color:rgba(255,255,255,.7)}
.todo-act.del:active{color:#FF6B6B;background:rgba(239,68,68,.1)}
.todo-edit-input{
  flex:1;min-width:0;background:rgba(255,255,255,.07);
  border:1px solid rgba(45,232,162,.4);border-radius:8px;
  color:#fff;font-family:'Geist',sans-serif;font-size:16px;
  padding:7px 10px;outline:none;-webkit-appearance:none;
}

/* Long-term goal row — tappable to edit */
.goal-row{cursor:pointer;padding:8px;border-radius:12px;margin:0 -8px 10px;transition:background .15s}
.goal-row:last-child{margin-bottom:-8px}
.goal-row:active{background:rgba(255,255,255,.04)}

/* Modal delete button */
.ltg-btn-del{
  width:50px;flex:0 0 auto;padding:14px 0;border-radius:14px;
  border:1px solid rgba(239,68,68,.3);
  background:rgba(239,68,68,.08);color:#FF8585;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;justify-content:center;
}
.ltg-btn-del:active{background:rgba(239,68,68,.16)}

#axAvatar{transition:transform .14s cubic-bezier(.2,.7,.2,1),border-color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
#axAvatar:hover{border-color:rgba(45,232,162,.45);box-shadow:0 0 0 4px rgba(45,232,162,.08)}
#axAvatar:active{transform:scale(.9)}

@media (prefers-reduced-motion:reduce){
  .reveal{animation:none;opacity:1}
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div class="reveal" style="animation-delay:.02s;display:flex;align-items:center;justify-content:space-between;margin-bottom:22px">
    <div>
      <div id="axDate" style="font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.1em;color:rgba(255,255,255,.4);text-transform:uppercase"></div>
      <h1 id="axGreeting" style="font-family:'Geist','Space Grotesk',sans-serif;font-weight:600;font-size:29px;letter-spacing:-.02em;color:#fff;margin-top:5px">Good morning</h1>
    </div>
    <a id="axAvatar" href="settings.html" aria-label="Settings" style="width:42px;height:42px;border-radius:50%;background:linear-gradient(150deg,#1c2c27,#0e1614);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-family:'Geist',sans-serif;font-weight:600;font-size:16px;color:#2de8a2;text-decoration:none;cursor:pointer">G</a>
  </div>

  <!-- DAY PROGRESS RING CARD -->
  <div class="reveal" style="animation-delay:.09s;position:relative;border-radius:24px;padding:24px;margin-bottom:14px;background:linear-gradient(180deg,rgba(45,232,162,.08),rgba(255,255,255,.022));border:1px solid rgba(45,232,162,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 30px -14px rgba(45,232,162,.35);overflow:hidden">
    <div style="position:absolute;top:-40px;right:-30px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(45,232,162,.18),transparent 70%);filter:blur(6px)"></div>
    <div style="display:flex;align-items:center;gap:22px;position:relative">
      <div style="position:relative;width:128px;height:128px;flex:0 0 auto">
        <svg width="128" height="128" viewBox="0 0 128 128" style="transform:rotate(-90deg);overflow:visible">
          <circle cx="64" cy="64" r="56" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="9"></circle>
          <circle id="dayRingFill" cx="64" cy="64" r="56" fill="none" stroke="#2de8a2" stroke-width="9" stroke-linecap="round" stroke-dasharray="352" stroke-dashoffset="352" style="filter:drop-shadow(0 0 6px rgba(45,232,162,1)) drop-shadow(0 0 20px rgba(45,232,162,.6));transition:stroke-dashoffset .7s cubic-bezier(.22,1,.36,1),stroke .7s,filter .7s"></circle>
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <span id="dayRingPercent" style="font-family:'Geist','Space Grotesk',sans-serif;font-weight:600;font-size:34px;color:#fff;line-height:1;letter-spacing:-.03em">—</span>
          <span id="dayRingPhase" style="font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.12em;color:rgba(45,232,162,.85);text-transform:uppercase;margin-top:2px"></span>
        </div>
      </div>
      <div style="flex:1">
        <div style="font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.4);text-transform:uppercase;margin-bottom:8px">Day progress</div>
        <div id="dayRingStatus" style="font-family:'Geist','Space Grotesk',sans-serif;font-weight:600;font-size:19px;color:#fff;margin-bottom:6px"></div>
        <div id="dayRingRemaining" style="font-size:13.5px;color:rgba(255,255,255,.55);line-height:1.5"></div>
      </div>
    </div>
  </div>

  <!-- TODAY TODOS CARD -->
  <div class="reveal" style="animation-delay:.16s;border-radius:24px;padding:20px 20px 12px;margin-bottom:14px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.022));border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <span style="font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.16em;color:rgba(255,255,255,.42);text-transform:uppercase">Today</span>
      <div style="display:flex;align-items:center;gap:8px">
        <span id="todayCount" style="font-family:'Geist Mono',monospace;font-size:12px;color:#2de8a2"></span>
        <button class="ax-add-btn" id="todoAddBtn" type="button">+ Add</button>
      </div>
    </div>
    <div id="todoList"><p class="empty-state">Loading…</p></div>
    <div class="todo-add-row" id="todoAddRow" style="display:none">
      <input class="todo-add-input" id="todoAddInput" type="text" placeholder="New task…" autocomplete="off" maxlength="200">
      <button class="todo-add-submit" id="todoAddSubmit" type="button">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="#04140d" stroke-width="2.2" stroke-linecap="round"></path></svg>
      </button>
    </div>
  </div>

  <!-- LONG-TERM GOALS CARD -->
  <div class="reveal" style="animation-delay:.23s;border-radius:24px;padding:20px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.022));border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
      <span style="font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.16em;color:rgba(255,255,255,.42);text-transform:uppercase">Long-term goals</span>
      <button class="ax-add-btn" id="goalAddBtn" type="button">+ Add</button>
    </div>
    <div id="goalsList"><p class="empty-state">Loading…</p></div>
  </div>

</div><!-- /.page -->

<!-- GOAL MODAL -->
<div class="ltg-modal-bg" id="ltgModalBg">
  <div class="ltg-modal">
    <div class="ltg-handle"></div>
    <div class="ltg-eyebrow" id="ltgEyebrow">New goal</div>
    <div class="ltg-modal-title" id="ltgModalTitle">Set a long-term goal</div>

    <div class="ltg-field">
      <div class="ltg-label">What do you want to achieve?</div>
      <input type="text" class="ltg-minput" id="ltgTitle" placeholder="e.g. Read 20 books this year" autocomplete="off">
    </div>

    <div class="ltg-field">
      <div class="ltg-label">Category</div>
      <div class="ltg-cats" id="ltgCats">
        <button type="button" class="ltg-cat" data-cat="weight"><span class="ltg-cat-ico">⚖️</span>Weight</button>
        <button type="button" class="ltg-cat" data-cat="fitness"><span class="ltg-cat-ico">💪</span>Fitness</button>
        <button type="button" class="ltg-cat" data-cat="reading"><span class="ltg-cat-ico">📚</span>Reading</button>
        <button type="button" class="ltg-cat" data-cat="learning"><span class="ltg-cat-ico">🧠</span>Learning</button>
        <button type="button" class="ltg-cat" data-cat="finance"><span class="ltg-cat-ico">💰</span>Finance</button>
        <button type="button" class="ltg-cat" data-cat="custom"><span class="ltg-cat-ico">✨</span>Custom</button>
      </div>
    </div>

    <div class="ltg-toggle-row">
      <div>
        <div class="ltg-toggle-txt">Track a number</div>
        <div class="ltg-toggle-sub" id="ltgToggleSub">Off — progress guided by Axis</div>
      </div>
      <div class="ltg-switch" id="ltgSwitch" role="switch" aria-checked="false" tabindex="0"><div class="ltg-switch-knob"></div></div>
    </div>

    <div class="ltg-measure" id="ltgMeasure">
      <div class="ltg-field">
        <div class="ltg-label">Target &amp; unit</div>
        <div class="ltg-grid2">
          <div><input type="number" class="ltg-minput" id="ltgTarget" placeholder="20" inputmode="decimal" step="any"></div>
          <div><input type="text" class="ltg-minput" id="ltgUnit" placeholder="books" autocomplete="off"></div>
        </div>
      </div>
      <div class="ltg-field">
        <div class="ltg-label">Start &amp; current</div>
        <div class="ltg-grid2">
          <div><input type="number" class="ltg-minput" id="ltgStart" placeholder="start" inputmode="decimal" step="any"></div>
          <div><input type="number" class="ltg-minput" id="ltgCurVal" placeholder="current" inputmode="decimal" step="any"></div>
        </div>
      </div>
    </div>

    <div class="ltg-field">
      <div class="ltg-label">Deadline (optional)</div>
      <input type="date" class="ltg-minput" id="ltgDeadline">
    </div>

    <input type="hidden" id="ltgCat" value="custom">

    <div class="ltg-modal-btns">
      <button type="button" class="ltg-btn-del" id="ltgDeleteBtn" style="display:none" aria-label="Delete goal">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>
      <button type="button" class="ltg-btn-cancel" id="ltgCancelBtn">Cancel</button>
      <button type="button" class="ltg-btn-save" id="ltgSaveBtn">Save goal</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const SUPABASE_URL = 'https://oyylbiscxnymnmetyrho.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95eWxiaXNjeG55bW5tZXR5cmhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMzQ1MDgsImV4cCI6MjA5NTcxMDUwOH0.3xxHcp3Z4vJWHEGFV_iUW_YeJ2gdUPqYiNAQkYnR-qU';
  const APP_KEY = 'goals';

  // ── Shared state ────────────────────────────────────────────
  let _supa = null;
  let _appData = {}; // full data object from app_state row

  // ── Helpers ─────────────────────────────────────────────────
  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function dateToKey(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
  }
  function getActiveDateString() {
    const now = new Date();
    if (now.getHours() < 6) {
      const d = new Date(now); d.setDate(d.getDate()-1); return dateToKey(d);
    }
    return dateToKey(now);
  }
  function formatRemaining(totalMin) {
    const h = Math.floor(totalMin / 60), m = Math.floor(totalMin % 60);
    return h + 'h ' + m + 'm';
  }
  function getWakeSleepMins() {
    function pm(str, defHour) {
      if (!str) return defHour * 60;
      const p = str.split(':');
      return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
    }
    const wake = pm(localStorage.getItem('dash_wake_time'), 8);
    let sleep = pm(localStorage.getItem('dash_sleep_time'), 24);
    if (sleep <= wake) sleep += 1440;
    return { wake, sleep };
  }

  // ── Shared persistence ───────────────────────────────────────
  function genId(prefix) {
    return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }
  function ensureGoalIds(goals) {
    let changed = false;
    goals.forEach(function(g){ if (!g.id) { g.id = genId('g'); changed = true; } });
    return changed;
  }
  async function syncAppData() {
    if (!_supa) return;
    try {
      await _supa.from('app_state').upsert(
        { key: APP_KEY, data: _appData, updated_at: new Date().toISOString() },
        { onConflict: 'key' }
      );
    } catch(_) {}
  }
  function persistTodos() {
    const key = 'goals:' + getActiveDateString();
    _appData[key] = _todos;
    try { localStorage.setItem(key, JSON.stringify(_todos)); } catch(_) {}
    syncAppData();
  }
  function persistGoals(goals) {
    _appData['axis_goals'] = goals;
    try { localStorage.setItem('axis_goals', JSON.stringify(goals)); } catch(_) {}
    syncAppData();
  }

  // ── Day ring ─────────────────────────────────────────────────
  const PALETTE = [
    [0,    [255,216,158]], [12.5, [255,205,121]], [25,   [255,227,143]],
    [37.5, [255,183,106]], [50,   [255,149, 89]], [62.5, [243,111, 79]],
    [75,   [226, 93,122]], [87.5, [123, 91,176]], [100,  [ 47, 58,102]]
  ];
  function lerp(a,b,t){return a+(b-a)*t;}
  function paletteAt(p) {
    if (p <= PALETTE[0][0]) return PALETTE[0][1];
    if (p >= PALETTE[PALETTE.length-1][0]) return PALETTE[PALETTE.length-1][1];
    for (let i=0; i<PALETTE.length-1; i++) {
      const [p0,c0]=PALETTE[i], [p1,c1]=PALETTE[i+1];
      if (p>=p0 && p<=p1) {
        const t=(p-p0)/(p1-p0);
        return [lerp(c0[0],c1[0],t), lerp(c0[1],c1[1],t), lerp(c0[2],c1[2],t)];
      }
    }
    return [255,255,255];
  }
  function rgbStr(c) { return 'rgb('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+')'; }
  function ringGlow(c) {
    const r=Math.round(c[0]), g=Math.round(c[1]), b=Math.round(c[2]);
    return 'drop-shadow(0 0 6px rgba('+r+','+g+','+b+',1)) drop-shadow(0 0 20px rgba('+r+','+g+','+b+',.6))';
  }

  const C = 2 * Math.PI * 56; // circumference for r=56
  const fillEl      = document.getElementById('dayRingFill');
  const percentEl   = document.getElementById('dayRingPercent');
  const phaseEl     = document.getElementById('dayRingPhase');
  const statusEl    = document.getElementById('dayRingStatus');
  const remainingEl = document.getElementById('dayRingRemaining');
  fillEl.setAttribute('stroke-dasharray', C);

  function updateDayRing() {
    const {wake: WAKE_MIN, sleep: SLEEP_MIN} = getWakeSleepMins();
    const now = new Date();
    const nowMins = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;

    if (nowMins < WAKE_MIN) {
      fillEl.setAttribute('stroke-dashoffset', C);
      fillEl.style.stroke = '#4D4B47';
      fillEl.style.filter = 'none';
      percentEl.textContent = '—';
      phaseEl.textContent   = 'SLEEPING';
      statusEl.textContent  = 'Still sleeping';
      remainingEl.textContent = formatRemaining(WAKE_MIN - nowMins) + ' until wake-up';
      return;
    }
    if (nowMins >= SLEEP_MIN) {
      fillEl.setAttribute('stroke-dashoffset', 0);
      fillEl.style.stroke = '#E25D7A';
      fillEl.style.filter = ringGlow([226,93,122]);
      percentEl.innerHTML = '100<span style="font-size:18px;color:rgba(255,255,255,.5)">%</span>';
      phaseEl.textContent   = 'PAST BEDTIME';
      statusEl.textContent  = 'Past bedtime';
      remainingEl.textContent = 'Sleep!';
      return;
    }

    const span = SLEEP_MIN - WAKE_MIN;
    const pct  = (nowMins - WAKE_MIN) / span * 100;
    fillEl.setAttribute('stroke-dashoffset', C * (1 - pct/100));
    const ringCol = paletteAt(pct);
    fillEl.style.stroke = rgbStr(ringCol);
    fillEl.style.filter = ringGlow(ringCol);
    percentEl.innerHTML = Math.floor(pct) + '<span style="font-size:18px;color:rgba(255,255,255,.5)">%</span>';

    let phase, status;
    if      (pct < 25) { phase='MORNING';   status='On track'; }
    else if (pct < 50) { phase='MIDDAY';    status='Keep moving'; }
    else if (pct < 75) { phase='AFTERNOON'; status='Push it'; }
    else if (pct < 90) { phase='EVENING';   status='Wrap up'; }
    else               { phase='BEDTIME';   status='Bedtime soon'; }
    phaseEl.textContent   = phase;
    statusEl.textContent  = status;
    remainingEl.textContent = formatRemaining(SLEEP_MIN - nowMins) + ' awake time left';
  }

  // ── Todos ────────────────────────────────────────────────────
  let _todos = [];

  function renderTodos(todos, editIdx) {
    _todos = todos;
    const listEl  = document.getElementById('todoList');
    const countEl = document.getElementById('todayCount');
    const done    = todos.filter(t => t.done).length;
    countEl.textContent = done + '/' + todos.length;

    if (!todos.length) {
      listEl.innerHTML = '<p class="empty-state">No goals for today yet.</p>';
      return;
    }
    listEl.innerHTML = '';
    todos.forEach(function(todo, i) {
      const row = document.createElement('div');
      row.className = 'todo-row';

      const check = document.createElement('div');
      check.className = todo.done ? 'todo-check-done' : 'todo-check-undone';
      check.style.cursor = 'pointer';
      if (todo.done) check.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 6.3 5 8.8l4.5-5.4" stroke="#04140d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
      check.addEventListener('click', function(){ toggleTodo(i); });
      row.appendChild(check);

      if (i === editIdx) {
        const inp = document.createElement('input');
        inp.className = 'todo-edit-input';
        inp.type = 'text'; inp.maxLength = 200; inp.value = todo.text;
        row.appendChild(inp);
        const commit = function(save) {
          if (save) { const v = inp.value.trim(); if (v) { _todos[i].text = v; persistTodos(); } }
          renderTodos(_todos);
        };
        inp.addEventListener('keydown', function(e){
          if (e.key === 'Enter') { e.preventDefault(); commit(true); }
          else if (e.key === 'Escape') { commit(false); }
        });
        inp.addEventListener('blur', function(){ commit(true); });
        setTimeout(function(){ inp.focus(); inp.select(); }, 0);
      } else {
        const text = document.createElement('span');
        text.className = todo.done ? 'todo-text-done' : 'todo-text-undone';
        text.textContent = todo.text;
        text.addEventListener('click', function(){ toggleTodo(i); });
        row.appendChild(text);

        const actions = document.createElement('div');
        actions.className = 'todo-actions';
        const editBtn = document.createElement('div');
        editBtn.className = 'todo-act'; editBtn.setAttribute('aria-label', 'Edit');
        editBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18 10l-4-4L4 16v4ZM13 7l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
        editBtn.addEventListener('click', function(e){ e.stopPropagation(); renderTodos(_todos, i); });
        const delBtn = document.createElement('div');
        delBtn.className = 'todo-act del'; delBtn.setAttribute('aria-label', 'Delete');
        delBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
        delBtn.addEventListener('click', function(e){ e.stopPropagation(); deleteTodo(i); });
        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        row.appendChild(actions);
      }
      listEl.appendChild(row);
    });
  }

  function toggleTodo(i) {
    if (!_todos[i]) return;
    const next = !_todos[i].done;
    _todos[i] = Object.assign({}, _todos[i], { done: next, doneAt: next ? new Date().toISOString() : undefined });
    persistTodos();
    renderTodos(_todos);
  }
  function deleteTodo(i) {
    if (!_todos[i]) return;
    _todos.splice(i, 1);
    persistTodos();
    renderTodos(_todos);
  }

  // ── Long-term goals ──────────────────────────────────────────
  function renderGoals(goals) {
    // Backfill ids so AI tools and edit/delete can target goals reliably
    if (ensureGoalIds(goals)) {
      _appData['axis_goals'] = goals;
      try { localStorage.setItem('axis_goals', JSON.stringify(goals)); } catch(_) {}
    }
    const container = document.getElementById('goalsList');
    if (!goals.length) {
      container.innerHTML = '<p class="empty-state">No long-term goals yet.</p>';
      return;
    }
    container.innerHTML = '';
    goals.forEach(function(goal) {
      const hasTarget = goal.targetValue != null && goal.targetValue !== '' && !isNaN(parseFloat(goal.targetValue));
      let pct = 0, sub = '';
      if (hasTarget) {
        const cur = goal.currentValue != null ? parseFloat(goal.currentValue) : null;
        const s   = parseFloat(goal.startValue);
        const t   = parseFloat(goal.targetValue);
        pct = (cur != null && !isNaN(s) && t !== s)
          ? Math.min(100, Math.max(0, (cur - s) / (t - s) * 100)) : 0;
        if (cur != null) {
          const curFmt = cur.toLocaleString(undefined, {maximumFractionDigits:1});
          const rem    = Math.abs(t - cur).toLocaleString(undefined, {maximumFractionDigits:1});
          sub = curFmt + (goal.unit ? ' ' + esc(goal.unit) : '') + ' · ' + rem + ' to go';
        } else {
          const tFmt = t.toLocaleString(undefined, {maximumFractionDigits:0});
          sub = '0 / ' + tFmt + (goal.unit ? ' ' + esc(goal.unit) : '');
        }
      } else {
        // Simple goal — tracked as a 0–100% progress value
        pct = goal.currentValue != null ? Math.min(100, Math.max(0, parseFloat(goal.currentValue) || 0)) : 0;
        sub = Math.round(pct) + '% complete';
      }

      const useBlue = goal.category === 'fitness' || goal.category === 'reading' || goal.category === 'learning' || goal.category === 'books';
      const row = document.createElement('div');
      row.className = 'goal-row';
      row.innerHTML =
        '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px">' +
          '<span style="font-size:15px;color:rgba(255,255,255,.9);font-weight:500">' + esc(goal.title) + '</span>' +
          '<span style="font-family:\'Geist Mono\',monospace;font-size:12px;color:rgba(255,255,255,.5)">' + sub + '</span>' +
        '</div>' +
        '<div class="goal-bar-track"><div class="' + (useBlue ? 'goal-bar-blue' : 'goal-bar-green') + '" style="width:0%"></div></div>';
      row.addEventListener('click', function(){ openGoalModal(goal); });
      container.appendChild(row);
      // Animate the progress bar from 0 → target on next frame
      const bar = row.querySelector('.goal-bar-green, .goal-bar-blue');
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ bar.style.width = pct.toFixed(1) + '%'; }); });
    });
  }

  // ── Add todo ─────────────────────────────────────────────────
  (function wireAddTodo() {
    const btn   = document.getElementById('todoAddBtn');
    const row   = document.getElementById('todoAddRow');
    const input = document.getElementById('todoAddInput');
    const sub   = document.getElementById('todoAddSubmit');

    btn.addEventListener('click', function() {
      row.style.display = row.style.display === 'none' ? 'flex' : 'none';
      if (row.style.display === 'flex') { input.value = ''; input.focus(); }
    });

    function commitTodo() {
      const text = input.value.trim();
      if (!text) return;
      const key = 'goals:' + getActiveDateString();
      _todos = Array.isArray(_appData[key]) ? _appData[key].slice() : [];
      _todos.push({ text: text, done: false });
      persistTodos();
      renderTodos(_todos);
      input.value = '';
      row.style.display = 'none';
    }

    sub.addEventListener('click', commitTodo);
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); commitTodo(); }
      if (e.key === 'Escape') { row.style.display = 'none'; }
    });
  })();

  // ── Goal modal (add · edit · delete · any kind of goal) ──────
  let _editingGoalId = null;
  function _ltgSetCat(cat) {
    document.getElementById('ltgCat').value = cat;
    const chips = document.querySelectorAll('#ltgCats .ltg-cat');
    chips.forEach(function(b){ b.classList.toggle('active', b.dataset.cat === cat); });
  }
  function _ltgSetMeasurable(on) {
    const sw = document.getElementById('ltgSwitch');
    sw.classList.toggle('on', on);
    sw.setAttribute('aria-checked', on ? 'true' : 'false');
    document.getElementById('ltgMeasure').classList.toggle('show', on);
    document.getElementById('ltgToggleSub').textContent = on
      ? 'On — track a number toward a target'
      : 'Off — progress guided by Axis';
  }
  function openGoalModal(goal) {
    _editingGoalId = (goal && goal.id) ? goal.id : null;
    document.getElementById('ltgEyebrow').textContent    = goal ? 'Edit goal' : 'New goal';
    document.getElementById('ltgModalTitle').textContent = goal ? 'Refine your goal' : 'Set a long-term goal';
    document.getElementById('ltgDeleteBtn').style.display = goal ? '' : 'none';
    document.getElementById('ltgSaveBtn').textContent     = goal ? 'Save changes' : 'Save goal';
    document.getElementById('ltgTitle').value    = (goal && goal.title) || '';
    _ltgSetCat((goal && goal.category) || 'custom');
    const hasTarget = !!(goal && goal.targetValue != null && goal.targetValue !== '');
    document.getElementById('ltgTarget').value   = hasTarget ? goal.targetValue : '';
    document.getElementById('ltgUnit').value     = (goal && goal.unit) || '';
    document.getElementById('ltgStart').value    = (goal && hasTarget && goal.startValue != null) ? goal.startValue : '';
    document.getElementById('ltgCurVal').value   = (goal && hasTarget && goal.currentValue != null) ? goal.currentValue : '';
    document.getElementById('ltgDeadline').value = (goal && goal.deadline) || '';
    _ltgSetMeasurable(hasTarget);
    document.getElementById('ltgModalBg').classList.add('open');
    document.body.classList.add('topbar-modal-open');
  }
  function closeGoalModal() {
    document.getElementById('ltgModalBg').classList.remove('open');
    document.body.classList.remove('topbar-modal-open');
  }
  (function wireGoalModal() {
    const bg = document.getElementById('ltgModalBg');
    document.getElementById('goalAddBtn').addEventListener('click', function(){ openGoalModal(null); });
    document.getElementById('ltgCancelBtn').addEventListener('click', closeGoalModal);
    bg.addEventListener('click', function(e){ if (e.target === bg) closeGoalModal(); });

    document.getElementById('ltgCats').addEventListener('click', function(e){
      const chip = e.target.closest('.ltg-cat');
      if (chip) _ltgSetCat(chip.dataset.cat);
    });
    const sw = document.getElementById('ltgSwitch');
    sw.addEventListener('click', function(){ _ltgSetMeasurable(!sw.classList.contains('on')); });
    sw.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); _ltgSetMeasurable(!sw.classList.contains('on')); }
    });

    document.getElementById('ltgDeleteBtn').addEventListener('click', function() {
      if (!_editingGoalId) return;
      let goals = Array.isArray(_appData['axis_goals']) ? _appData['axis_goals'].slice() : [];
      goals = goals.filter(function(g){ return g.id !== _editingGoalId; });
      persistGoals(goals);
      renderGoals(goals);
      closeGoalModal();
    });

    document.getElementById('ltgSaveBtn').addEventListener('click', function() {
      const title = document.getElementById('ltgTitle').value.trim();
      if (!title) { document.getElementById('ltgTitle').focus(); return; }
      const measurable = document.getElementById('ltgSwitch').classList.contains('on');
      const category   = document.getElementById('ltgCat').value;
      const deadline   = document.getElementById('ltgDeadline').value || null;

      let goals = Array.isArray(_appData['axis_goals']) ? _appData['axis_goals'].slice() : [];
      const prev = _editingGoalId ? goals.find(function(g){ return g.id === _editingGoalId; }) : null;

      const goal = Object.assign(
        { id: (prev && prev.id) || genId('g'), startDate: (prev && prev.startDate) || new Date().toISOString().slice(0, 10) },
        prev || {},
        { category: category, title: title, deadline: deadline }
      );

      if (measurable) {
        const targetRaw = document.getElementById('ltgTarget').value.trim();
        const startRaw  = document.getElementById('ltgStart').value.trim();
        const curRaw    = document.getElementById('ltgCurVal').value.trim();
        goal.targetValue  = targetRaw !== '' ? parseFloat(targetRaw) : null;
        goal.unit         = document.getElementById('ltgUnit').value.trim();
        goal.startValue   = startRaw !== '' ? parseFloat(startRaw) : null;
        goal.currentValue = curRaw   !== '' ? parseFloat(curRaw)   : (startRaw !== '' ? parseFloat(startRaw) : null);
      } else {
        // Simple goal — tracked 0–100% (progress set by you or Axis). Preserve % when it was already simple.
        goal.targetValue  = null;
        goal.unit         = '';
        goal.startValue   = 0;
        goal.currentValue = (prev && prev.targetValue == null && prev.currentValue != null) ? prev.currentValue : 0;
      }

      if (prev) {
        const idx = goals.findIndex(function(g){ return g.id === _editingGoalId; });
        goals[idx] = goal;
      } else {
        goals.push(goal);
      }
      persistGoals(goals);
      renderGoals(goals);
      closeGoalModal();
    });
  })();

  // ── Hydrate from Supabase data ───────────────────────────────
  function applyData(data) {
    _appData = data;
    // Seed localStorage so other scripts (if any) stay coherent
    try {
      Object.keys(data).forEach(function(k) {
        localStorage.setItem(k, JSON.stringify(data[k]));
      });
    } catch(_) {}
    const todayKey = 'goals:' + getActiveDateString();
    renderTodos(Array.isArray(data[todayKey]) ? data[todayKey] : []);
    renderGoals(Array.isArray(data['axis_goals']) ? data['axis_goals'] : []);
  }

  // ── Init ────────────────────────────────────────────────────
  (async function init() {
    // Date label
    const now    = new Date();
    const days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    document.getElementById('axDate').textContent =
      days[now.getDay()] + ' · ' + months[now.getMonth()] + ' ' + now.getDate();

    // Greeting — always correct for the real time of day, with or without a name
    let _firstName = '';
    function timeOfDay(h) {
      if (h < 5)  return 'night';
      if (h < 12) return 'morning';
      if (h < 17) return 'afternoon';
      if (h < 22) return 'evening';
      return 'night';
    }
    function renderGreeting() {
      const g = 'Good ' + timeOfDay(new Date().getHours());
      document.getElementById('axGreeting').textContent = _firstName ? (g + ', ' + _firstName) : g;
    }
    renderGreeting();

    // Day ring + greeting (immediate + recurring)
    updateDayRing();
    setInterval(function(){ updateDayRing(); renderGreeting(); }, 60000);

    if (!window.supabase) {
      renderTodos([]); renderGoals([]); return;
    }
    _supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ── Auth: pull first name ──────────────────────────────────
    try {
      const { data: authData } = await _supa.auth.getUser();
      const user = authData && authData.user;
      if (user) {
        const meta = user.user_metadata || {};
        const full = meta.full_name || meta.name || '';
        const firstName = full.split(' ')[0] || user.email.split('@')[0] || 'George';
        _firstName = firstName;
        renderGreeting();
        document.getElementById('axAvatar').textContent = firstName[0].toUpperCase();
      }
    } catch(_) {}

    // ── Fetch app_state ────────────────────────────────────────
    try {
      const { data, error } = await _supa
        .from('app_state')
        .select('data')
        .eq('key', APP_KEY)
        .maybeSingle();
      if (!error && data && data.data && Object.keys(data.data).length) {
        applyData(data.data);
      } else {
        renderTodos([]); renderGoals([]);
      }
    } catch(_) {
      renderTodos([]); renderGoals([]);
    }

    // ── Realtime: live updates from other devices ──────────────
    _supa.channel('main_app_state')
      .on('postgres_changes', {
        event: '*', schema: 'public', table: 'app_state', filter: 'key=eq.' + APP_KEY
      }, function(payload) {
        if (!payload.new || !payload.new.data) return;
        applyData(payload.new.data);
      })
      .subscribe();
  })();

})();
</script>
