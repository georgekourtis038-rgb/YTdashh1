<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f0e">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="axis-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Axis — Calendar</title>
<script src="topbar.js" defer></script>
<script src="/push-init.js" defer></script>
<script src="google-auth.js"></script>
<style>
:root {
  --bg: #0a0f0e;
  --mint: #2de8a2;
  --mint-dim: rgba(45,232,162,0.12);
  --mint-border: rgba(45,232,162,0.4);
  --card-bg: rgba(255,255,255,0.04);
  --card-border: rgba(255,255,255,0.08);
  --text-primary: #FAFAFA;
  --text-secondary: rgba(255,255,255,0.6);
  --text-tertiary: rgba(255,255,255,0.3);
  --font: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'Space Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  min-height: 100vh;
  overflow-x: hidden;
}
.cal-page {
  max-width: 540px;
  margin: 0 auto;
  padding: 16px 16px 120px;
}

/* Axis section eyebrow */
.cal-eyebrow {
  display: flex; align-items: center; gap: 14px;
  margin: 2px 0 18px;
}
.cal-eyebrow-tag {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.18em;
  text-transform: uppercase; color: rgba(45,232,162,0.85); flex-shrink: 0;
}
.cal-eyebrow-sub { font-size: 13px; color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-eyebrow-rule { flex: 1; min-width: 24px; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,0.10), transparent); }

/* Month header */
.cal-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin-bottom: 18px;
}
.cal-head-year {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em;
  text-transform: uppercase; color: rgba(45,232,162,0.7); margin-bottom: 3px;
}
.cal-head-month {
  font-size: 29px; font-weight: 600; letter-spacing: -0.02em;
  color: var(--text-primary); line-height: 1;
}
.cal-head-nav { display: flex; gap: 8px; }
.month-nav-btn {
  width: 36px; height: 36px;
  border-radius: 11px;
  border: 1px solid rgba(255,255,255,0.09);
  background: rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.7);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.12s, transform 0.12s;
  will-change: transform;
  backface-visibility: hidden;
}
.month-nav-btn:active { background: rgba(255,255,255,0.1); transform: scale(0.90); }

/* Calendar card */
.cal-card {
  background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.022));
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 24px;
  overflow: hidden;
  margin-bottom: 14px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.07);
}
.cal-dow-row {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  padding: 12px 0 8px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.cal-dow {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 1px;
  color: rgba(255,255,255,0.35);
  text-transform: uppercase;
}
.cal-days-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 1px;
  background: rgba(255,255,255,0.04);
}
.cal-day {
  background: var(--bg);
  min-height: 64px;
  padding: 8px 4px 6px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.1s;
  user-select: none;
  -webkit-user-select: none;
}
.cal-day:active { background: rgba(255,255,255,0.06); }
.cal-day.other-month { opacity: 0.25; pointer-events: none; }
.cal-day.selected { background: rgba(255,255,255,0.06); }
.cal-day-num {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  margin-bottom: 4px;
  flex-shrink: 0;
  transition: background 0.15s;
}
.cal-day.other-month .cal-day-num { color: var(--text-tertiary); }
.cal-day.today .cal-day-num {
  background: linear-gradient(150deg, #2de8a2, #13b683);
  color: #04140d;
  font-weight: 700;
  box-shadow: 0 0 14px rgba(45,232,162,0.55);
}
.cal-day.selected:not(.today) .cal-day-num {
  background: rgba(255,255,255,0.13);
}
.cal-dots {
  display: flex;
  gap: 3px;
  justify-content: center;
}
.cal-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
}
.cal-dot-more {
  font-size: 8px;
  color: var(--text-tertiary);
  font-weight: 700;
  align-self: center;
  line-height: 1;
}

/* Auth card */
.auth-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 28px 20px;
  text-align: center;
  margin-bottom: 14px;
}
.auth-icon { font-size: 36px; margin-bottom: 12px; }
.auth-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.auth-body {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.65;
  margin-bottom: 20px;
  max-width: 290px;
  margin-left: auto;
  margin-right: auto;
}
.auth-btn {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 13px 24px;
  background: var(--mint-dim);
  border: 1.5px solid var(--mint);
  border-radius: 12px;
  color: var(--text-primary);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s;
  font-family: var(--font);
}
.auth-btn:active { background: rgba(45,232,162,0.22); }

/* Day events panel (Axis agenda) */
.day-panel {
  margin-bottom: 14px;
  min-height: 60px;
}
.day-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  padding: 0 2px;
}
.day-panel-label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.42);
}
.day-panel-date {
  font-family: var(--font-mono);
  font-size: 11px;
  color: rgba(255,255,255,0.4);
}
.day-panel-empty {
  text-align: center;
  padding: 22px 0;
  color: var(--text-tertiary);
  font-size: 13px;
  border: 1px dashed var(--card-border);
  border-radius: 16px;
}
.event-list { display: flex; flex-direction: column; gap: 10px; }
.event-row {
  display: flex;
  align-items: stretch;
  gap: 14px;
  border-radius: 18px;
  padding: 14px 16px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, border-color 0.15s;
}
.event-row:active { background: rgba(255,255,255,0.07); }
.event-row--now {
  background: linear-gradient(180deg, rgba(45,232,162,0.10), rgba(255,255,255,0.02));
  border-color: rgba(45,232,162,0.25);
}
.event-time-col {
  display: flex; flex-direction: column; align-items: flex-start;
  min-width: 46px; padding-top: 1px; flex-shrink: 0;
}
.event-time-h { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: #fff; }
.event-time-ap { font-family: var(--font-mono); font-size: 10px; color: rgba(255,255,255,0.35); }
.event-row--now .event-time-h { color: var(--mint); }
.event-row--now .event-time-ap { color: rgba(45,232,162,0.6); }
.event-color-bar {
  width: 3px;
  align-self: stretch;
  min-height: 30px;
  border-radius: 2px;
  flex-shrink: 0;
}
.event-info { flex: 1; min-width: 0; }
.event-title {
  font-size: 15px;
  font-weight: 500;
  color: rgba(255,255,255,0.92);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.event-row--now .event-title { color: #fff; }
.event-sub {
  font-size: 12.5px;
  color: rgba(255,255,255,0.45);
  margin-top: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* FAB */
.fab {
  position: fixed;
  bottom: calc(96px + env(safe-area-inset-bottom));
  right: max(20px, env(safe-area-inset-right));
  width: 52px; height: 52px;
  border-radius: 50%;
  background: var(--mint);
  color: #0a0f0e;
  font-size: 28px;
  font-weight: 300;
  line-height: 1;
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 20px rgba(45,232,162,0.4), 0 1px 4px rgba(0,0,0,0.3);
  z-index: 30;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.15s;
  will-change: transform;
  backface-visibility: hidden;
}
.fab:active { transform: scale(0.90); box-shadow: 0 2px 10px rgba(45,232,162,0.3); }

/* Create event modal */
.cal-modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.72);
  z-index: 50;
  align-items: flex-end;
  justify-content: center;
}
.cal-modal-bg.show { display: flex; }
@media (min-width: 480px) {
  .cal-modal-bg { align-items: center; padding: 20px; }
  .cal-modal { border-radius: 20px !important; max-height: 90vh !important; }
}
.cal-modal {
  background: #141c1a;
  border: 1px solid rgba(255,255,255,0.14);
  border-bottom: none;
  border-radius: 20px 20px 0 0;
  padding: 16px 20px max(28px, env(safe-area-inset-bottom));
  width: 100%;
  max-width: 480px;
  max-height: 95vh;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.cal-modal-handle {
  width: 36px; height: 4px;
  background: rgba(255,255,255,0.18);
  border-radius: 2px;
  margin: 0 auto 18px;
}
.cal-modal-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 18px;
}
.cal-field-label {
  display: block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: 6px;
}
.cal-input, .cal-textarea {
  width: 100%;
  background: rgba(0,0,0,0.28);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 11px 13px;
  color: var(--text-primary);
  font-size: 16px;
  font-family: var(--font);
  margin-bottom: 14px;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  display: block;
}
.cal-input:focus, .cal-textarea:focus { border-color: var(--mint-border); }
.cal-textarea { resize: none; min-height: 70px; line-height: 1.5; }
.cal-time-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}
.cal-time-row .cal-input { margin-bottom: 0; }
.cal-switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  margin-bottom: 14px;
}
.cal-switch-label {
  font-size: 14px;
  color: var(--text-secondary);
}
.cal-switch {
  width: 44px; height: 26px;
  background: rgba(255,255,255,0.1);
  border-radius: 13px;
  position: relative;
  cursor: pointer;
  transition: background 0.2s;
  flex-shrink: 0;
}
.cal-switch.on { background: var(--mint); }
.cal-switch::after {
  content: '';
  position: absolute;
  top: 3px; left: 3px;
  width: 20px; height: 20px;
  background: white;
  border-radius: 50%;
  transition: transform 0.2s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}
.cal-switch.on::after { transform: translateX(18px); }
.cal-modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 8px;
}
.cal-btn-cancel {
  flex: 1;
  padding: 13px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  color: var(--text-primary);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font);
  -webkit-tap-highlight-color: transparent;
}
.cal-btn-save {
  flex: 2;
  padding: 13px;
  background: linear-gradient(180deg, #2de8a2 0%, #1ec78a 100%);
  border: 1px solid rgba(45,232,162,0.5);
  border-radius: 12px;
  color: #04140d;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: var(--font);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 6px 18px -8px rgba(45,232,162,0.5);
  -webkit-tap-highlight-color: transparent;
  transition: opacity 0.15s;
}
.cal-btn-save:disabled { opacity: 0.4; cursor: not-allowed; }

/* Event detail sheet */
.sheet-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 50;
}
.sheet-bg.show { display: block; }
.event-sheet {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #141c1a;
  border: 1px solid rgba(255,255,255,0.12);
  border-bottom: none;
  border-radius: 20px 20px 0 0;
  padding: 0 20px max(28px, env(safe-area-inset-bottom));
  z-index: 51;
  max-height: 72vh;
  overflow-y: auto;
  overscroll-behavior: contain;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
  will-change: transform;
  backface-visibility: hidden;
}
.sheet-bg.show .event-sheet { transform: translateY(0); }
.sheet-handle {
  width: 36px; height: 4px;
  background: rgba(255,255,255,0.18);
  border-radius: 2px;
  margin: 12px auto 16px;
}
.sheet-accent-bar {
  height: 3px;
  border-radius: 2px;
  margin-bottom: 16px;
}
.sheet-title {
  font-size: 21px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 4px;
  line-height: 1.25;
}
.sheet-cal-name {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-bottom: 20px;
}
.sheet-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 14px;
}
.sheet-row-icon {
  font-size: 15px;
  flex-shrink: 0;
  padding-top: 1px;
  opacity: 0.65;
}
.sheet-row-text {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.55;
}

/* Spinner */
.spinner {
  width: 20px; height: 20px;
  border: 2px solid rgba(45,232,162,0.2);
  border-top-color: var(--mint);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
  margin: 16px auto;
}
@keyframes spin { to { transform: rotate(360deg) translateZ(0); } }

@media (max-width: 380px) {
  .cal-day { min-height: 56px; padding: 6px 3px 5px; }
  .cal-day-num { width: 24px; height: 24px; font-size: 13px; }
  .cal-dot { width: 4px; height: 4px; }
  .month-nav-title { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .event-sheet, .fab, .month-nav-btn { transition: none; }
  .spinner { animation: none; }
}
</style>

</head>
<body>
<div class="cal-page" id="calPage">

  <div class="cal-eyebrow">
    <span class="cal-eyebrow-tag">Calendar</span>
    <span class="cal-eyebrow-sub">Your month at a glance</span>
    <span class="cal-eyebrow-rule"></span>
  </div>

  <div class="cal-head">
    <div>
      <div class="cal-head-year" id="monthYear"></div>
      <h1 class="cal-head-month" id="monthTitle"></h1>
    </div>
    <div class="cal-head-nav">
      <button class="month-nav-btn" id="prevBtn" aria-label="Previous month">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="month-nav-btn" id="nextBtn" aria-label="Next month">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div class="cal-card" id="calCard">
    <div class="cal-dow-row">
      <span class="cal-dow">S</span><span class="cal-dow">M</span><span class="cal-dow">T</span>
      <span class="cal-dow">W</span><span class="cal-dow">T</span><span class="cal-dow">F</span>
      <span class="cal-dow">S</span>
    </div>
    <div class="cal-days-grid" id="calGrid"></div>
  </div>

  <div class="auth-card" id="authCard" style="display:none">
    <div class="auth-icon">📅</div>
    <div class="auth-title" id="authTitle">Connect Google Account</div>
    <div class="auth-body" id="authBody">Sign in with Google to see your Calendar events and Gmail inbox in Axis.</div>
    <button class="auth-btn" id="authBtn">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908C16.658 14.015 17.64 11.708 17.64 9.2z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
        <path d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.174 0 7.547 0 9s.348 2.826.957 4.039l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Sign in with Google
    </button>
  </div>

  <div class="day-panel" id="dayPanel">
    <div class="day-panel-header">
      <span class="day-panel-label" id="dayPanelLabel">Events</span>
      <span class="day-panel-date" id="dayPanelDate"></span>
    </div>
    <div id="dayPanelContent">
      <div class="day-panel-empty">Select a day to see events</div>
    </div>
  </div>

</div>

<button class="fab" id="fabCreate" aria-label="Create event">+</button>

<!-- Create event modal -->
<div class="cal-modal-bg" id="createModalBg" role="dialog" aria-modal="true" aria-label="New event">
  <div class="cal-modal">
    <div class="cal-modal-handle"></div>
    <div class="cal-modal-title">New Event</div>
    <label class="cal-field-label" for="evtTitle">Title</label>
    <input type="text" class="cal-input" id="evtTitle" placeholder="Event title" autocomplete="off">
    <div class="cal-switch-row">
      <span class="cal-switch-label">All day</span>
      <div class="cal-switch" id="allDaySwitch" role="switch" aria-checked="false" tabindex="0"></div>
    </div>
    <label class="cal-field-label" for="evtDate">Date</label>
    <input type="date" class="cal-input" id="evtDate">
    <div id="timeFields">
      <label class="cal-field-label">Time</label>
      <div class="cal-time-row">
        <input type="time" class="cal-input" id="evtStart">
        <input type="time" class="cal-input" id="evtEnd">
      </div>
    </div>
    <label class="cal-field-label" for="evtLocation">Location <span style="font-weight:400;letter-spacing:0;color:rgba(255,255,255,0.2)">(optional)</span></label>
    <input type="text" class="cal-input" id="evtLocation" placeholder="Add location" autocomplete="off">
    <label class="cal-field-label" for="evtDesc">Notes <span style="font-weight:400;letter-spacing:0;color:rgba(255,255,255,0.2)">(optional)</span></label>
    <textarea class="cal-textarea" id="evtDesc" placeholder="Add description"></textarea>
    <div class="cal-modal-actions">
      <button class="cal-btn-cancel" id="createCancelBtn">Cancel</button>
      <button class="cal-btn-save" id="createSaveBtn">Save to Calendar</button>
    </div>
  </div>
</div>

<!-- Event detail sheet -->
<div class="sheet-bg" id="sheetBg">
  <div class="event-sheet" id="eventSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-accent-bar" id="sheetAccentBar"></div>
    <div class="sheet-title" id="sheetTitle"></div>
    <div class="sheet-cal-name" id="sheetCalName"></div>
    <div id="sheetDetails"></div>
  </div>
</div>

<script>
// =================================================================
// CONFIGURATION
// 1. Go to console.cloud.google.com
// 2. Create a project → enable "Google Calendar API"
// 3. Create OAuth 2.0 credentials (type: Web application)
// 4. Add your site's origin to "Authorized JavaScript origins"
//    (e.g. https://your-app.vercel.app and http://localhost)
// 5. Paste the Client ID below
// =================================================================
const GOOGLE_CLIENT_ID = '199459906303-10ecosetgbh9tucisnoufu942dkoj13k.apps.googleusercontent.com';

// -------------------------------------------------------
const SCOPES = 'https://www.googleapis.com/auth/calendar https://www.googleapis.com/auth/gmail.readonly';
const API = 'https://www.googleapis.com/calendar/v3';

const GC_COLORS = {
  '1':'#7986CB','2':'#33B679','3':'#8E24AA','4':'#E67C73',
  '5':'#F6BF26','6':'#F4511E','7':'#039BE5','8':'#616161',
  '9':'#3F51B5','10':'#0B8043','11':'#D50000',
  'default':'#2de8a2'
};

// -------------------------------------------------------
// State
// -------------------------------------------------------
const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

const _now  = new Date();
let viewYear  = _now.getFullYear();
let viewMonth = _now.getMonth();
let todayStr  = dateFmt(_now);
let selectedDate = todayStr;
let events = {};          // 'YYYY-MM-DD' → GCal event[]
let accessToken = null;
let isAllDay = false;
let pendingEvt = null;    // event being shown in sheet

// -------------------------------------------------------
// Utils
// -------------------------------------------------------
function dateFmt(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}
function fmtTime(dtStr) {
  if (!dtStr) return '';
  return new Date(dtStr).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
}
function fmtFriendly(dateStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString([], { weekday:'long', month:'long', day:'numeric' });
}
function fmtShortLabel(dateStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  return new Date(y,m-1,d)
    .toLocaleDateString([], { weekday:'short', month:'short', day:'numeric' })
    .toUpperCase();
}
// Split a datetime into { t:'9:00', ap:'AM' } — forces 12h regardless of locale
function splitTime(dtStr) {
  const d = new Date(dtStr);
  let h = d.getHours();
  const min = d.getMinutes();
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  return { t: h + ':' + String(min).padStart(2,'0'), ap };
}
function evColor(ev) { return GC_COLORS[ev.colorId] || GC_COLORS['default']; }
function evDateStr(ev) { return (ev.start.dateTime || ev.start.date || '').slice(0,10); }
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// -------------------------------------------------------
// Google Identity Services boot — delegated to google-auth.js
// -------------------------------------------------------
function showSetupCard() {
  const card = document.getElementById('authCard');
  card.style.display = '';
  document.getElementById('authTitle').textContent = 'Google Calendar Setup';
  document.getElementById('authBody').textContent =
    'Add your Google OAuth Client ID to the GOOGLE_CLIENT_ID constant at the top of calendar.html to enable Calendar and Gmail sync.';
  document.getElementById('authBtn').style.display = 'none';
}

function showLoginCard() {
  document.getElementById('authCard').style.display = '';
}

function authenticate() {
  GoogleAuth.signIn();
}

GoogleAuth.init({
  onReady: function(tok) {
    accessToken = tok;
    document.getElementById('authCard').style.display = 'none';
    loadEvents();
  },
  onNeedAuth: function() {
    showLoginCard();
  },
  onSignOut: function() {
    accessToken = null;
    showLoginCard();
  },
});

// -------------------------------------------------------
// Calendar REST API
// -------------------------------------------------------
async function apiFetch(path, opts = {}) {
  // Always get a fresh (or silently refreshed) token before each call
  const tok = await GoogleAuth.getToken();
  if (!tok) { showLoginCard(); return null; }
  accessToken = tok;
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      'Authorization': 'Bearer ' + tok,
      'Content-Type': 'application/json',
      ...(opts.headers || {}),
    },
  });
  if (res.status === 401) {
    // Token rejected by Google despite refresh — force full re-auth
    GoogleAuth.signOut();
    return null;
  }
  if (!res.ok) return null;
  return res.json();
}

async function loadEvents() {
  if (!accessToken) return;
  // Fetch a window slightly wider than the visible month so edge cells are covered
  const rangeMin = new Date(viewYear, viewMonth - 1, 20);
  const rangeMax = new Date(viewYear, viewMonth + 1, 14);
  const params = new URLSearchParams({
    timeMin: rangeMin.toISOString(),
    timeMax: rangeMax.toISOString(),
    singleEvents: 'true',
    orderBy: 'startTime',
    maxResults: '500',
  });
  const data = await apiFetch('/calendars/primary/events?' + params);
  if (!data) return;
  events = {};
  for (const ev of (data.items || [])) {
    const ds = evDateStr(ev);
    if (!ds) continue;
    if (!events[ds]) events[ds] = [];
    events[ds].push(ev);
  }
  renderGrid();
  if (selectedDate) renderDayPanel(selectedDate);
}

async function createCalEvent(body) {
  return apiFetch('/calendars/primary/events', {
    method: 'POST',
    body: JSON.stringify(body),
  });
}

// -------------------------------------------------------
// Calendar grid render
// -------------------------------------------------------
function renderGrid() {
  document.getElementById('monthTitle').textContent = MONTHS[viewMonth];
  document.getElementById('monthYear').textContent = viewYear;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const firstDow   = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMon  = new Date(viewYear, viewMonth + 1, 0).getDate();
  const prevMonLen = new Date(viewYear, viewMonth, 0).getDate();
  const total      = Math.ceil((firstDow + daysInMon) / 7) * 7;

  const prevY = viewMonth === 0  ? viewYear - 1 : viewYear;
  const prevM = viewMonth === 0  ? 11 : viewMonth - 1;
  const nextY = viewMonth === 11 ? viewYear + 1 : viewYear;
  const nextM = viewMonth === 11 ? 0  : viewMonth + 1;

  for (let i = 0; i < total; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-day';
    let ds, dayNum;

    if (i < firstDow) {
      dayNum = prevMonLen - firstDow + i + 1;
      ds = prevY + '-' + String(prevM + 1).padStart(2,'0') + '-' + String(dayNum).padStart(2,'0');
      cell.classList.add('other-month');
    } else if (i >= firstDow + daysInMon) {
      dayNum = i - firstDow - daysInMon + 1;
      ds = nextY + '-' + String(nextM + 1).padStart(2,'0') + '-' + String(dayNum).padStart(2,'0');
      cell.classList.add('other-month');
    } else {
      dayNum = i - firstDow + 1;
      ds = viewYear + '-' + String(viewMonth + 1).padStart(2,'0') + '-' + String(dayNum).padStart(2,'0');
      cell.dataset.date = ds;
      if (ds === todayStr)     cell.classList.add('today');
      if (ds === selectedDate) cell.classList.add('selected');
      cell.addEventListener('click', () => selectDay(ds));
    }

    const dayEvs = events[ds] || [];
    const dots   = dayEvs.slice(0,3).map(ev =>
      `<span class="cal-dot" style="background:${evColor(ev)}"></span>`).join('');
    const more   = dayEvs.length > 3
      ? `<span class="cal-dot-more">+${dayEvs.length - 3}</span>` : '';

    cell.innerHTML = `<div class="cal-day-num">${dayNum}</div>` +
      (dots || more ? `<div class="cal-dots">${dots}${more}</div>` : '');
    grid.appendChild(cell);
  }
}

// -------------------------------------------------------
// Day selection + panel
// -------------------------------------------------------
function selectDay(ds) {
  selectedDate = ds;
  document.querySelectorAll('.cal-day[data-date]').forEach(c => {
    c.classList.toggle('selected', c.dataset.date === ds);
  });
  renderDayPanel(ds);
}

function renderDayPanel(ds) {
  document.getElementById('dayPanelLabel').textContent = fmtShortLabel(ds);
  const dateEl  = document.getElementById('dayPanelDate');
  const content = document.getElementById('dayPanelContent');
  if (!accessToken) {
    dateEl.textContent = '';
    content.innerHTML = '<div class="day-panel-empty">Connect Google Calendar above to see events</div>';
    return;
  }
  const dayEvs = events[ds] || [];
  dateEl.textContent = dayEvs.length
    ? dayEvs.length + (dayEvs.length === 1 ? ' event' : ' events') : '';
  if (dayEvs.length === 0) {
    content.innerHTML = '<div class="day-panel-empty">No events</div>';
    return;
  }
  const now = new Date();
  content.innerHTML = '<div class="event-list">' + dayEvs.map((ev, i) => {
    const color  = evColor(ev);
    const allday = !!ev.start.date;
    let colH, colAp, sub, nowCls = '';
    if (allday) {
      colH = 'All'; colAp = 'day';
      sub = ev.location ? esc(ev.location) : 'All day';
    } else {
      const sp = splitTime(ev.start.dateTime);
      colH = sp.t; colAp = sp.ap;
      sub = ev.location ? esc(ev.location) : 'until ' + esc(fmtTime(ev.end.dateTime));
      if (ds === todayStr) {
        const s = new Date(ev.start.dateTime), e = new Date(ev.end.dateTime);
        if (now >= s && now <= e) nowCls = ' event-row--now';
      }
    }
    return `<div class="event-row${nowCls}" data-idx="${i}">
      <div class="event-time-col">
        <span class="event-time-h">${esc(colH)}</span>
        <span class="event-time-ap">${esc(colAp)}</span>
      </div>
      <div class="event-color-bar" style="background:${color}"></div>
      <div class="event-info">
        <div class="event-title">${esc(ev.summary || '(No title)')}</div>
        <div class="event-sub">${sub}</div>
      </div>
    </div>`;
  }).join('') + '</div>';
  content.querySelectorAll('.event-row').forEach(row => {
    row.addEventListener('click', () => openEventSheet(parseInt(row.dataset.idx)));
  });
}

// -------------------------------------------------------
// Event detail sheet
// -------------------------------------------------------
function openEventSheet(idx) {
  const ev = (events[selectedDate] || [])[idx];
  if (!ev) return;
  pendingEvt = ev;

  const color = evColor(ev);
  document.getElementById('sheetAccentBar').style.background = color;
  document.getElementById('sheetTitle').textContent = ev.summary || '(No title)';
  document.getElementById('sheetCalName').textContent =
    ev.organizer?.displayName || ev.organizer?.email || 'Google Calendar';

  const allday  = !!ev.start.date;
  const dateRef = (ev.start.date || ev.start.dateTime || '').slice(0,10);
  const timeStr = allday
    ? 'All day · ' + fmtFriendly(dateRef)
    : fmtFriendly(dateRef) + ' · ' + fmtTime(ev.start.dateTime) + ' – ' + fmtTime(ev.end.dateTime);

  let html = `<div class="sheet-row">
    <span class="sheet-row-icon">🕐</span>
    <div class="sheet-row-text">${esc(timeStr)}</div>
  </div>`;
  if (ev.location) {
    html += `<div class="sheet-row">
      <span class="sheet-row-icon">📍</span>
      <div class="sheet-row-text">${esc(ev.location)}</div>
    </div>`;
  }
  if (ev.description) {
    html += `<div class="sheet-row">
      <span class="sheet-row-icon">📝</span>
      <div class="sheet-row-text">${esc(ev.description)}</div>
    </div>`;
  }
  document.getElementById('sheetDetails').innerHTML = html;
  document.getElementById('sheetBg').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeSheet() {
  document.getElementById('sheetBg').classList.remove('show');
  document.body.style.overflow = '';
  pendingEvt = null;
}

// -------------------------------------------------------
// Create event modal
// -------------------------------------------------------
function openCreateModal() {
  if (!accessToken) { authenticate(); return; }
  document.getElementById('evtTitle').value    = '';
  document.getElementById('evtDate').value     = selectedDate || todayStr;
  document.getElementById('evtStart').value    = '09:00';
  document.getElementById('evtEnd').value      = '10:00';
  document.getElementById('evtLocation').value = '';
  document.getElementById('evtDesc').value     = '';
  setAllDay(false);
  document.getElementById('createSaveBtn').disabled = false;
  document.getElementById('createSaveBtn').textContent = 'Save to Calendar';
  document.getElementById('createModalBg').classList.add('show');
  document.body.style.overflow = 'hidden';
  setTimeout(() => document.getElementById('evtTitle').focus(), 80);
}

function closeCreateModal() {
  document.getElementById('createModalBg').classList.remove('show');
  document.body.style.overflow = '';
}

function setAllDay(on) {
  isAllDay = on;
  const sw = document.getElementById('allDaySwitch');
  sw.classList.toggle('on', on);
  sw.setAttribute('aria-checked', String(on));
  document.getElementById('timeFields').style.display = on ? 'none' : '';
}

async function saveEvent() {
  const title = document.getElementById('evtTitle').value.trim();
  if (!title) { document.getElementById('evtTitle').focus(); return; }
  const date  = document.getElementById('evtDate').value;
  if (!date)  return;

  const saveBtn = document.getElementById('createSaveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';

  let body;
  if (isAllDay) {
    body = { summary: title, start: { date }, end: { date } };
  } else {
    const st = document.getElementById('evtStart').value || '09:00';
    const en = document.getElementById('evtEnd').value   || '10:00';
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    body = {
      summary: title,
      start: { dateTime: `${date}T${st}:00`, timeZone: tz },
      end:   { dateTime: `${date}T${en}:00`, timeZone: tz },
    };
  }
  const loc  = document.getElementById('evtLocation').value.trim();
  const desc = document.getElementById('evtDesc').value.trim();
  if (loc)  body.location    = loc;
  if (desc) body.description = desc;

  const result = await createCalEvent(body);
  saveBtn.disabled = false;
  saveBtn.textContent = 'Save to Calendar';

  if (result) {
    closeCreateModal();
    selectedDate = date;
    await loadEvents();
  } else {
    alert('Could not save the event. Please check your connection and try again.');
  }
}

// -------------------------------------------------------
// Month navigation
// -------------------------------------------------------
function changeMonth(delta) {
  viewMonth += delta;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  if (viewMonth <  0) { viewMonth = 11; viewYear--; }
  events = {};
  renderGrid();
  document.getElementById('dayPanelLabel').textContent = 'Events';
  document.getElementById('dayPanelDate').textContent = '';
  document.getElementById('dayPanelContent').innerHTML =
    '<div class="day-panel-empty">Select a day to see events</div>';
  if (accessToken) loadEvents();
}

// Horizontal swipe on the calendar card to change month
(function wireSwipe() {
  const card = document.getElementById('calCard');
  let sx = 0, sy = 0;
  card.addEventListener('touchstart', e => {
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
  }, { passive: true });
  card.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4) {
      changeMonth(dx < 0 ? 1 : -1);
    }
  }, { passive: true });
})();

// -------------------------------------------------------
// Wire up events
// -------------------------------------------------------
document.getElementById('prevBtn').onclick = () => changeMonth(-1);
document.getElementById('nextBtn').onclick = () => changeMonth(1);
document.getElementById('fabCreate').onclick = openCreateModal;
document.getElementById('authBtn').onclick = authenticate;
document.getElementById('createCancelBtn').onclick = closeCreateModal;
document.getElementById('createSaveBtn').onclick = saveEvent;

document.getElementById('allDaySwitch').onclick = () => setAllDay(!isAllDay);
document.getElementById('allDaySwitch').onkeydown = e => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setAllDay(!isAllDay); }
};

document.getElementById('sheetBg').addEventListener('click', e => {
  if (e.target === document.getElementById('sheetBg')) closeSheet();
});
document.getElementById('createModalBg').addEventListener('click', e => {
  if (e.target === document.getElementById('createModalBg')) closeCreateModal();
});

// -------------------------------------------------------
// Boot
// -------------------------------------------------------
(function init() {
  renderGrid();
  renderDayPanel(todayStr);
  if (!GOOGLE_CLIENT_ID) showSetupCard();
})();
</script>
<!-- Google Identity Services — onload triggers auth init -->
<!-- GIS script removed — auth is now handled server-side via /api/google-callback -->
</body>
</html>
