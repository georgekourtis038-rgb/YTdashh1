document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

style=\"font-size:12px;color:rgba(255,255,255,.55);line-height:1.4\">Calm, precise, anticipatory<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;border-radius:18px;padding:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)\">\n                <div style=\"font-family:'Geist','Space Grotesk',sans-serif;font-weight:600;font-size:15px;color:rgba(255,255,255,.85);margin-bottom:6px\">Coach<\u002Fdiv>\n                <div style=\"font-size:12px;color:rgba(255,255,255,.45);line-height:1.4\">Direct, energizing, candid<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <!-- preferences toggles -->\n            <div style=\"font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.16em;color:rgba(255,255,255,.42);text-transform:uppercase;margin:6px 0 10px 4px\">Preferences<\u002Fdiv>\n            <div style=\"border-radius:24px;padding:6px 20px;margin-bottom:16px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.022));border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)\">\n              <div style=\"display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid rgba(255,255,255,.05)\">\n                <div style=\"flex:1\"><div style=\"font-size:15px;color:rgba(255,255,255,.92);font-weight:500\">Daily briefing<\u002Fdiv><div style=\"font-size:12.5px;color:rgba(255,255,255,.42);margin-top:2px\">Every morning at 7:00<\u002Fdiv><\u002Fdiv>\n                <div onclick=\"{{ briefingToggle }}\" style=\"{{ briefingTrack }}\"><div style=\"{{ briefingKnob }}\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid rgba(255,255,255,.05)\">\n                <div style=\"flex:1\"><div style=\"font-size:15px;color:rgba(255,255,255,.92);font-weight:500\">Push notifications<\u002Fdiv><div style=\"font-size:12.5px;color:rgba(255,255,255,.42);margin-top:2px\">Reminders &amp; nudges<\u002Fdiv><\u002Fdiv>\n                <div onclick=\"{{ notifToggle }}\" style=\"{{ notifTrack }}\"><div style=\"{{ notifKnob }}\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:14px;padding:15px 0\">\n                <div style=\"flex:1\"><div style=\"font-size:15px;color:rgba(255,255,255,.92);font-weight:500\">Appearance<\u002Fdiv><div style=\"font-size:12.5px;color:rgba(255,255,255,.42);margin-top:2px\">Dark · Aurora<\u002Fdiv><\u002Fdiv>\n                <span style=\"font-family:'Geist Mono',monospace;font-size:13px;color:rgba(255,255,255,.5)\">Dark<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <!-- sign out -->\n            <button style=\"width:100%;height:54px;border-radius:17px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:rgba(255,255,255,.7);font-family:'Geist',sans-serif;font-weight:500;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px\">\n              <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 8l-4 4 4 4M6 12h10\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n              Sign out\n            <\u002Fbutton>\n            <div style=\"text-align:center;font-family:'Geist Mono',monospace;font-size:11px;color:rgba(255,255,255,.28);margin-top:16px\">Axis · v2.0 Aurora<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:absolute;left:0;right:0;bottom:0;height:30px;background:linear-gradient(0deg,#070b0a,transparent);z-index:20;pointer-events:none\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    todos: [\n      { t: 'Finalize Q3 roadmap', done: true },\n      { t: 'Upper day — gym at 5:00', done: false },\n      { t: 'Roadmap review · 2:00 PM', done: false },\n      { t: 'Read 20 pages', done: false },\n    ],\n    waterMl: 2400,\n    chip: '',\n    briefingOn: true,\n    notifOn: true,\n  };\n\n  _track(on) {\n    return 'width:48px;height:29px;border-radius:16px;flex:0 0 auto;padding:3px;cursor:pointer;transition:background .2s,box-shadow .2s;display:flex;justify-content:' + (on ? 'flex-end' : 'flex-start') + ';background:' + (on ? 'linear-gradient(180deg,#2de8a2,#1ec78a)' : 'rgba(255,255,255,.12)') + ';box-shadow:' + (on ? '0 0 16px -4px rgba(45,232,162,.7),inset 0 1px 1px rgba(255,255,255,.2)' : 'inset 0 1px 2px rgba(0,0,0,.3)');\n  }\n  _knob() {\n    return 'width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.35)';\n  }\n\n  renderVals() {\n    const target = 3000;\n    const w = this.state.waterMl;\n    const pct = Math.min(100, Math.round((w / target) * 100));\n    const boxOn = 'width:22px;height:22px;border-radius:7px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#2de8a2;border:1px solid #2de8a2;box-shadow:0 0 12px rgba(45,232,162,.45)';\n    const boxOff = 'width:22px;height:22px;border-radius:7px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.22)';\n    const txtOn = \"font-family:-apple-system,'Geist',sans-serif;font-weight:500;font-size:15.5px;color:rgba(255,255,255,.4);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.28)\";\n    const txtOff = \"font-family:-apple-system,'Geist',sans-serif;font-weight:500;font-size:15.5px;color:rgba(255,255,255,.92)\";\n\n    const todos = this.state.todos.map((t, i) => ({\n      t: t.t, done: t.done,\n      box: t.done ? boxOn : boxOff,\n      txt: t.done ? txtOn : txtOff,\n      toggle: () => this.setState(s => ({ todos: s.todos.map((x, j) => j === i ? { ...x, done: !x.done } : x) })),\n    }));\n\n    const chips = ['What needs me today?', 'Plan around my 5pm lift', 'Summarize unread inbox'].map(label => ({\n      label, pick: () => this.setState({ chip: label }),\n    }));\n\n    return {\n      todos,\n      doneCount: this.state.todos.filter(t => t.done).length,\n      totalCount: this.state.todos.length,\n      waterText: (w / 1000).toFixed(1) + ' L',\n      waterPctText: pct + '%',\n      waterFill: 'height:100%;width:' + pct + '%;border-radius:7px;background:linear-gradient(90deg,#4f8df0,#6f9bff);box-shadow:0 0 14px rgba(111,155,255,.5)',\n      addBottle: () => this.setState(s => ({ waterMl: Math.min(4000, s.waterMl + 500) })),\n      addGlass: () => this.setState(s => ({ waterMl: Math.min(4000, s.waterMl + 355) })),\n      chips,\n      chipVal: this.state.chip,\n      onChat: (e) => this.setState({ chip: e.target.value }),\n      briefingTrack: this._track(this.state.briefingOn),\n      briefingKnob: this._knob(),\n      briefingToggle: () => this.setState(s => ({ briefingOn: !s.briefingOn })),\n      notifTrack: this._track(this.state.notifOn),\n      notifKnob: this._knob(),\n      notifToggle: () => this.setState(s => ({ notifOn: !s.notifOn })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
