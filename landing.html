<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060908">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="axis-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Axis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
html,body{
  width:100%;height:100%;
  background:#060908;
  overflow:hidden;
  font-family:'Geist','Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;
}

.scene{
  position:relative;
  width:100vw;height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 44px) 32px calc(env(safe-area-inset-bottom,0px) + 54px);
  background:radial-gradient(135% 80% at 50% -8%,#102a22 0%,#0a1512 38%,#070b0a 70%,#060908 100%);
  animation:sceneIn 0.6s ease both;
}
@keyframes sceneIn{0%{opacity:0}100%{opacity:1}}

/* ── top label ── */
.top-label{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  margin-top:14px;
  animation:slideUp 0.55s cubic-bezier(0.16,1,0.3,1) 0.1s both;
}
.top-label span{
  font-family:'Geist Mono',monospace;
  font-size:12px;letter-spacing:.42em;
  color:rgba(45,232,162,.8);
  text-transform:uppercase;
  padding-left:.42em;
}

/* ── ring graphic ── */
.ring-wrap{
  position:relative;
  width:266px;height:266px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  animation:slideUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.18s both;
}

/* ambient glow */
.ring-glow{
  position:absolute;
  width:240px;height:240px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(45,232,162,.16),transparent 65%);
  filter:blur(8px);
  pointer-events:none;
}

/* static concentric rings */
.ring-static{
  position:absolute;
  border-radius:50%;
  pointer-events:none;
}
.rs1{inset:13px;border:1px solid rgba(255,255,255,.06);}
.rs2{inset:48px;border:1px solid rgba(255,255,255,.05);}
.rs3{inset:83px;border:1px solid rgba(45,232,162,.14);}

/* spinning outer ring + dot layer */
.ring-spin-outer{
  position:absolute;inset:0;
  border-radius:50%;
  border:1.5px solid transparent;
  border-top-color:#2de8a2;
  border-right-color:rgba(45,232,162,.35);
  filter:drop-shadow(0 0 7px rgba(45,232,162,.55));
  animation:axSpin 7s linear infinite;
  will-change:transform;
}
.ring-dot-outer-track{
  position:absolute;inset:0;
  border-radius:50%;
  animation:axSpin 7s linear infinite;
  will-change:transform;
}
.ring-dot-outer-track .dot{
  position:absolute;top:-4px;left:50%;
  transform:translateX(-50%);
  width:9px;height:9px;border-radius:50%;
  background:#2de8a2;
  box-shadow:0 0 14px 2px #2de8a2;
}

/* spinning inner ring + dot layer */
.ring-spin-inner{
  position:absolute;inset:48px;
  border-radius:50%;
  border:1.5px solid transparent;
  border-bottom-color:rgba(111,155,255,.6);
  animation:axSpinRev 11s linear infinite;
  will-change:transform;
}
.ring-dot-inner-track{
  position:absolute;inset:48px;
  border-radius:50%;
  animation:axSpinRev 11s linear infinite;
  will-change:transform;
}
.ring-dot-inner-track .dot{
  position:absolute;bottom:-3px;left:50%;
  transform:translateX(-50%);
  width:6px;height:6px;border-radius:50%;
  background:#6f9bff;
  box-shadow:0 0 10px 1px #6f9bff;
}

/* center core */
.ring-core{
  width:96px;height:96px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,rgba(255,255,255,.14),rgba(255,255,255,.03) 60%);
  border:1px solid rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;
  animation:axBreath 4.5s ease-in-out infinite;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.15);
  position:relative;z-index:2;
}
.ring-core-icon{
  width:20px;height:20px;
  border:2.5px solid #2de8a2;
  border-radius:50%;
  border-right-color:transparent;
  border-bottom-color:transparent;
  box-shadow:0 0 14px rgba(45,232,162,.7);
}

/* ── bottom section ── */
.bottom-section{
  display:flex;flex-direction:column;align-items:center;gap:14px;
  width:100%;
  animation:slideUp 0.65s cubic-bezier(0.16,1,0.3,1) 0.26s both;
}
.axis-title{
  font-family:'Geist','Space Grotesk',sans-serif;
  font-weight:700;font-size:62px;letter-spacing:.04em;
  color:#fff;line-height:1;
  text-shadow:0 0 40px rgba(45,232,162,.25);
}
.axis-sub{
  font-size:15px;
  color:rgba(255,255,255,.5);
  letter-spacing:.01em;
  text-align:center;
}

/* enter button */
.enter-btn{
  margin-top:18px;width:100%;height:58px;
  border-radius:18px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  text-decoration:none;cursor:pointer;
  background:linear-gradient(180deg,rgba(45,232,162,.16),rgba(45,232,162,.07));
  border:1.5px solid rgba(45,232,162,.55);
  color:#eafff6;
  font-family:'Geist',sans-serif;font-weight:600;font-size:17px;letter-spacing:.02em;
  box-shadow:0 0 30px -6px rgba(45,232,162,.5),inset 0 1px 0 rgba(255,255,255,.12);
  transition:box-shadow 0.2s,border-color 0.2s;
  -webkit-tap-highlight-color:transparent;
}
.enter-btn:hover{
  border-color:rgba(45,232,162,.75);
  box-shadow:0 0 40px -4px rgba(45,232,162,.65),inset 0 1px 0 rgba(255,255,255,.16);
}
.enter-btn:active{transform:scale(0.97);}

/* status row */
.status-row{
  display:flex;align-items:center;gap:9px;
  margin-top:6px;
}
.status-dot{
  width:7px;height:7px;border-radius:50%;
  background:#2de8a2;
  box-shadow:0 0 9px #2de8a2;
  animation:axPulse 2.4s ease-in-out infinite;
  flex-shrink:0;
}
.status-text{
  font-family:'Geist Mono',monospace;
  font-size:12px;letter-spacing:.06em;
  color:rgba(255,255,255,.42);
}

/* ── keyframes ── */
@keyframes axSpin{
  from{transform:rotate(0deg)}
  to  {transform:rotate(360deg)}
}
@keyframes axSpinRev{
  from{transform:rotate(0deg)}
  to  {transform:rotate(-360deg)}
}
@keyframes axBreath{
  0%,100%{transform:scale(1);opacity:1}
  50%    {transform:scale(1.055);opacity:0.82}
}
@keyframes axPulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%    {opacity:0.45;transform:scale(0.85)}
}
@keyframes slideUp{
  0%  {opacity:0;transform:translateY(22px)}
  100%{opacity:1;transform:translateY(0)}
}

/* exit animation class */
.scene.exit{
  transition:opacity 0.4s ease, transform 0.4s cubic-bezier(0.4,0,1,1);
  opacity:0;
  transform:scale(1.04);
}
</style>
</head>
<body>
<div class="scene" id="scene">

  <!-- top: welcome label -->
  <div class="top-label">
    <span>Welcome back</span>
  </div>

  <!-- middle: ring graphic -->
  <div class="ring-wrap">
    <div class="ring-glow"></div>
    <div class="ring-static rs1"></div>
    <div class="ring-static rs2"></div>
    <div class="ring-static rs3"></div>
    <div class="ring-spin-outer"></div>
    <div class="ring-dot-outer-track"><div class="dot"></div></div>
    <div class="ring-spin-inner"></div>
    <div class="ring-dot-inner-track"><div class="dot"></div></div>
    <div class="ring-core">
      <div class="ring-core-icon"></div>
    </div>
  </div>

  <!-- bottom: AXIS + enter -->
  <div class="bottom-section">
    <h1 class="axis-title">AXIS</h1>
    <p class="axis-sub" id="axisGreeting">Your personal operating system</p>
    <a href="index.html" class="enter-btn" id="enterBtn">
      Enter
      <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
        <path d="M3 8.5h10M9 4.5l4 4-4 4" stroke="#2de8a2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <div class="status-row">
      <span class="status-dot"></span>
      <span class="status-text" id="statusText">systems online · synced</span>
    </div>
  </div>

</div>

<script>
(function () {
  /* ── greeting ── */
  var h = new Date().getHours();
  var greeting = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  var greetEl = document.getElementById('axisGreeting');
  if (greetEl) greetEl.textContent = greeting;

  /* ── status: count tracked systems ── */
  try {
    var count = 0;
    if (localStorage.getItem('po_water_v1')) count++;
    if (localStorage.getItem('po_coach_weights')) count++;
    if (localStorage.getItem('po_coach_v1')) count++;
    if (localStorage.getItem('goals:' + (function() {
      var d = new Date();
      if (d.getHours() < 6) d.setDate(d.getDate() - 1);
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    })())) count++;
    if (localStorage.getItem('dash_weight')) count++;
    var statusEl = document.getElementById('statusText');
    if (statusEl && count > 0) statusEl.textContent = count + ' systems online · synced';
  } catch (e) {}

  /* ── exit animation ── */
  var enterBtn = document.getElementById('enterBtn');
  var scene    = document.getElementById('scene');
  if (enterBtn && scene) {
    enterBtn.addEventListener('click', function (e) {
      e.preventDefault();
      var dest = enterBtn.getAttribute('href');
      scene.classList.add('exit');
      setTimeout(function () { window.location.href = dest; }, 420);
    });
  }
})();
</script>
</body>
</html>
