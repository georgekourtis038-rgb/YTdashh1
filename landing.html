<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070c0b">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Axis</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  width:100%;height:100%;
  background:#070c0b;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}

.scene{
  position:relative;
  width:100vw;height:100dvh;
  display:flex;align-items:center;justify-content:center;
  will-change:opacity;
  animation:sceneIn 0.8s ease both;
}
@keyframes sceneIn{0%{opacity:0;}100%{opacity:1;}}

.scene::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(rgba(45,232,162,0.022) 1px,transparent 1px);
  background-size:28px 28px;
  pointer-events:none;z-index:0;
}

/* star canvas sits behind everything — own GPU layer */
@keyframes starFadeIn{0%{opacity:0}100%{opacity:1}}
#starCanvas{
  position:absolute;inset:0;
  pointer-events:none;z-index:0;
  will-change:transform;
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
  animation:starFadeIn 1.5s ease 0.4s both;
}

/* deep teal centered ellipse glow */
.bg-glow{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 60% at 50% 50%, rgba(45,232,162,0.07) 0%, transparent 70%);
  pointer-events:none;z-index:0;
}

/* ambient layers */
.ambient{
  position:absolute;
  width:min(90vw,640px);height:min(90vw,640px);
  border-radius:50%;
  background:radial-gradient(circle,rgba(45,232,162,0.08) 0%,rgba(45,232,162,0.025) 45%,transparent 68%);
  pointer-events:none;z-index:0;
  will-change:transform,opacity;
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
  animation:ambientPulse 5.5s ease-in-out infinite;
}
@keyframes ambientPulse{
  0%,100%{-webkit-transform:scale(1) translateZ(0);    transform:scale(1) translateZ(0);    opacity:1;}
  50%    {-webkit-transform:scale(1.14) translateZ(0); transform:scale(1.14) translateZ(0); opacity:0.5;}
}
.ambient2{
  position:absolute;
  width:min(150vw,1000px);height:min(150vw,1000px);
  border-radius:50%;
  background:radial-gradient(circle,rgba(45,232,162,0.028) 0%,transparent 58%);
  pointer-events:none;z-index:0;
  opacity:0.6;
}

/* ── axis stage: single GPU layer, floats up/down ── */
.axis-stage{
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;
  will-change:transform;
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
  transform-origin:center center;
  animation:axisFloat 4s ease-in-out infinite;
}
@keyframes axisFloat{
  0%,100%{-webkit-transform:translate3d(0,0,0);    transform:translate3d(0,0,0);}
  50%    {-webkit-transform:translate3d(0,-12px,0); transform:translate3d(0,-12px,0);}
}

@keyframes axisIn{
  0%  {opacity:0;-webkit-transform:scale(0.85) translateZ(0);transform:scale(0.85) translateZ(0);}
  100%{opacity:1;-webkit-transform:scale(1) translateZ(0);   transform:scale(1) translateZ(0);}
}
.axis-wrap{
  width:min(116vw,760px);height:min(116vw,760px);flex-shrink:0;
  will-change:transform,opacity;
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
  animation:axisIn 1s cubic-bezier(0.16,1,0.3,1) both;
}
.axis-wrap svg{width:100%;height:100%;overflow:visible;}

/* AXIS brand: bigger, bolder, static glow fades in with opacity only */
.axis-brand{
  position:absolute;z-index:5;
  left:50%;top:calc(50% + 42px);
  transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;
  pointer-events:none;
}
@keyframes axisBloom{
  0%  {opacity:0;}
  100%{opacity:1;}
}
.axis-brand-text{
  font-size:42px;
  font-weight:800;
  letter-spacing:10px;
  padding-left:10px;
  color:#fff;
  text-shadow:
    0 0 20px rgba(45,232,162,0.8),
    0 0 60px rgba(45,232,162,0.4),
    0 0 120px rgba(45,232,162,0.2);
  will-change:transform,opacity;
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
  animation:axisBloom 0.9s ease 1.1s both;
}

/* ── ring gyroscope: GPU-composited rotation ── */
.r1,.r2,.r3,.r4{
  transform-box:view-box;
  transform-origin:center center;
  will-change:transform;
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
}
.r1{animation:ringCW  20s linear infinite;}
.r2{animation:ringCCW 30s linear infinite;}
.r3{animation:ringCW  40s linear infinite;}
.r4{animation:ringCCW 50s linear infinite;}
@keyframes ringCW{
  from{-webkit-transform:translate3d(0,0,0) rotate(0deg);   transform:translate3d(0,0,0) rotate(0deg);}
  to  {-webkit-transform:translate3d(0,0,0) rotate(360deg); transform:translate3d(0,0,0) rotate(360deg);}
}
@keyframes ringCCW{
  from{-webkit-transform:translate3d(0,0,0) rotate(0deg);    transform:translate3d(0,0,0) rotate(0deg);}
  to  {-webkit-transform:translate3d(0,0,0) rotate(-360deg); transform:translate3d(0,0,0) rotate(-360deg);}
}

/* ── arm pendulum ── */
.arm-group{
  transform-box:view-box;
  transform-origin:center center;
  will-change:transform;
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
  animation:armPendulum 6s ease-in-out infinite;
}
@keyframes armPendulum{
  0%,100%{-webkit-transform:translate3d(0,0,0) rotate(-8deg); transform:translate3d(0,0,0) rotate(-8deg);}
  50%    {-webkit-transform:translate3d(0,0,0) rotate(8deg);  transform:translate3d(0,0,0) rotate(8deg);}
}

/* origin breathing */
.ob1{animation:ob 3s ease-in-out infinite;}
@keyframes ob{0%,100%{opacity:0.72;}50%{opacity:0.18;}}

/* ── card entrance keyframes (per-card target opacity) ── */
@keyframes cardIn0{0%{opacity:0;-webkit-transform:translate3d(0,14px,0);transform:translate3d(0,14px,0)}100%{opacity:0.70;-webkit-transform:translate3d(0,0,0);transform:translate3d(0,0,0)}}
@keyframes cardIn1{0%{opacity:0;-webkit-transform:translate3d(0,14px,0);transform:translate3d(0,14px,0)}100%{opacity:0.75;-webkit-transform:translate3d(0,0,0);transform:translate3d(0,0,0)}}
@keyframes cardIn2{0%{opacity:0;-webkit-transform:translate3d(0,14px,0);transform:translate3d(0,14px,0)}100%{opacity:1;  -webkit-transform:translate3d(0,0,0);transform:translate3d(0,0,0)}}
@keyframes cardIn3{0%{opacity:0;-webkit-transform:translate3d(0,14px,0);transform:translate3d(0,14px,0)}100%{opacity:0.85;-webkit-transform:translate3d(0,0,0);transform:translate3d(0,0,0)}}
@keyframes cardIn4{0%{opacity:0;-webkit-transform:translate3d(0,14px,0);transform:translate3d(0,14px,0)}100%{opacity:1;  -webkit-transform:translate3d(0,0,0);transform:translate3d(0,0,0)}}

/* ── glass pill cards ── */
.card{
  position:absolute;z-index:8;
  display:flex;align-items:center;gap:9px;
  padding:9px 15px;
  border-radius:50px;
  background:linear-gradient(135deg,rgba(18,40,30,0.52),rgba(6,14,10,0.68));
  backdrop-filter:blur(20px) saturate(1.6);
  -webkit-backdrop-filter:blur(20px) saturate(1.6);
  border:1px solid rgba(45,232,162,0.15);
  box-shadow:
    0 4px 22px rgba(0,0,0,0.52),
    0 0 12px rgba(45,232,162,0.06),
    inset 0 1px 0 rgba(255,255,255,0.055);
  white-space:nowrap;
  cursor:pointer;
  transition:border-color 0.25s,box-shadow 0.25s;
  will-change:transform,opacity;
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
}
.card:hover{
  opacity:1 !important;
  border-color:rgba(45,232,162,0.34);
  box-shadow:
    0 4px 22px rgba(0,0,0,0.52),
    0 0 22px rgba(45,232,162,0.15),
    inset 0 1px 0 rgba(255,255,255,0.08);
}
.card:active{-webkit-transform:scale(0.95) translateZ(0);transform:scale(0.95) translateZ(0);}

.card-icon{width:17px;height:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.card-text{display:flex;flex-direction:column;gap:1px;}
.card-label{font-size:11.5px;font-weight:600;letter-spacing:0.04em;color:rgba(255,255,255,0.75);}
.card-data {font-size:9.5px; font-weight:500;letter-spacing:0.02em;color:rgba(45,232,162,0.7);}

/* ── card positions, depth (opacity + scale baked into keyframes) ──
   All positioned relative to viewport center via calc(50% ± Xpx)
   so they orbit the axis regardless of screen size. */

/* Water: top-left, farthest → opacity 0.70, scale 0.88 */
.card-water{
  top:calc(50% - 170px);left:calc(50% - 180px);
  opacity:0.70;
  animation:cardIn0 0.45s ease 0.2s both, cf1 7s ease-in-out infinite 0.65s;
}
@keyframes cf1{
  0%,100%{-webkit-transform:translate3d(0,0,0) scale(0.88);       transform:translate3d(0,0,0) scale(0.88);}
  33%    {-webkit-transform:translate3d(11px,-18px,0) scale(0.88); transform:translate3d(11px,-18px,0) scale(0.88);}
  66%    {-webkit-transform:translate3d(-8px,-9px,0) scale(0.88);  transform:translate3d(-8px,-9px,0) scale(0.88);}
}

/* Weight: top-right, far → opacity 0.75, scale 0.91 */
.card-weight{
  top:calc(50% - 162px);left:calc(50% + 60px);
  opacity:0.75;
  animation:cardIn1 0.45s ease 0.28s both, cf2 8.5s ease-in-out infinite 0.73s;
}
@keyframes cf2{
  0%,100%{-webkit-transform:translate3d(0,0,0) scale(0.91);        transform:translate3d(0,0,0) scale(0.91);}
  40%    {-webkit-transform:translate3d(-11px,14px,0) scale(0.91);  transform:translate3d(-11px,14px,0) scale(0.91);}
  70%    {-webkit-transform:translate3d(9px,-11px,0) scale(0.91);   transform:translate3d(9px,-11px,0) scale(0.91);}
}

/* Fitness: right-middle, nearest → opacity 1, scale 1 */
.card-fitness{
  top:calc(50% + 28px);left:calc(50% + 96px);
  opacity:1;
  animation:cardIn2 0.45s ease 0.36s both, cf3 6.5s ease-in-out infinite 0.81s;
}
@keyframes cf3{
  0%,100%{-webkit-transform:translate3d(0,0,0);        transform:translate3d(0,0,0);}
  30%    {-webkit-transform:translate3d(-10px,-15px,0); transform:translate3d(-10px,-15px,0);}
  60%    {-webkit-transform:translate3d(11px,10px,0);   transform:translate3d(11px,10px,0);}
}

/* Goals: bottom-left, mid → opacity 0.85, scale 0.94 */
.card-goals{
  top:calc(50% + 115px);left:calc(50% - 172px);
  opacity:0.85;
  animation:cardIn3 0.45s ease 0.44s both, cf4 9s ease-in-out infinite 0.89s;
}
@keyframes cf4{
  0%,100%{-webkit-transform:translate3d(0,0,0) scale(0.94);       transform:translate3d(0,0,0) scale(0.94);}
  25%    {-webkit-transform:translate3d(13px,-11px,0) scale(0.94); transform:translate3d(13px,-11px,0) scale(0.94);}
  75%    {-webkit-transform:translate3d(-9px,13px,0) scale(0.94);  transform:translate3d(-9px,13px,0) scale(0.94);}
}

/* AI: bottom-center, nearest → opacity 1, scale 1 */
.card-ai{
  top:calc(50% + 142px);left:calc(50% - 58px);
  opacity:1;
  animation:cardIn4 0.45s ease 0.52s both, cf5 7.5s ease-in-out infinite 0.97s;
}
@keyframes cf5{
  0%,100%{-webkit-transform:translate3d(0,0,0);         transform:translate3d(0,0,0);}
  35%    {-webkit-transform:translate3d(-13px,-13px,0);  transform:translate3d(-13px,-13px,0);}
  65%    {-webkit-transform:translate3d(10px,12px,0);    transform:translate3d(10px,12px,0);}
}

/* ── floating diamond nodes — brighter, larger ── */
.fnode{
  position:absolute;z-index:2;
  background:rgba(45,232,162,0.12);
  border:1px solid rgba(45,232,162,0.35);
  box-shadow:
    0 0 12px rgba(45,232,162,0.32),
    0 0 30px rgba(45,232,162,0.14);
  pointer-events:none;
  will-change:transform,opacity;
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
  transform-origin:center center;
}
.fn1{width:10px;height:10px;top:19%;left:27%; animation:nf1 11s ease-in-out infinite;}
.fn2{width: 7px;height: 7px;top:31%;right:21%;animation:nf2 13s ease-in-out infinite;}
.fn3{width:12px;height:12px;top:56%;left:16%;animation:nf3 9s  ease-in-out infinite;}
.fn4{width: 6px;height: 6px;top:16%;left:51%;animation:nf4 14s ease-in-out infinite;}
.fn5{width: 9px;height: 9px;top:71%;right:26%;animation:nf5 10s ease-in-out infinite;}
.fn6{width:11px;height:11px;top:45%;left:7%; animation:nf1 12s ease-in-out infinite 2.5s;}

@keyframes nf1{
  0%  {-webkit-transform:rotate(45deg) translate3d(0,0,0);        transform:rotate(45deg) translate3d(0,0,0);        opacity:0.65;}
  25% {-webkit-transform:rotate(45deg) translate3d(18px,-22px,0);  transform:rotate(45deg) translate3d(18px,-22px,0);  opacity:1;}
  60% {-webkit-transform:rotate(45deg) translate3d(-14px,-8px,0);  transform:rotate(45deg) translate3d(-14px,-8px,0);  opacity:0.8;}
  100%{-webkit-transform:rotate(45deg) translate3d(0,0,0);        transform:rotate(45deg) translate3d(0,0,0);        opacity:0.65;}
}
@keyframes nf2{
  0%  {-webkit-transform:rotate(45deg) translate3d(0,0,0);          transform:rotate(45deg) translate3d(0,0,0);          opacity:0.55;}
  30% {-webkit-transform:rotate(45deg) translate3d(-18px,-16px,0);   transform:rotate(45deg) translate3d(-18px,-16px,0);   opacity:0.95;}
  70% {-webkit-transform:rotate(45deg) translate3d(12px,14px,0);     transform:rotate(45deg) translate3d(12px,14px,0);     opacity:0.72;}
  100%{-webkit-transform:rotate(45deg) translate3d(0,0,0);          transform:rotate(45deg) translate3d(0,0,0);          opacity:0.55;}
}
@keyframes nf3{
  0%  {-webkit-transform:rotate(45deg) translate3d(0,0,0);         transform:rotate(45deg) translate3d(0,0,0);         opacity:0.7;}
  20% {-webkit-transform:rotate(45deg) translate3d(20px,12px,0);    transform:rotate(45deg) translate3d(20px,12px,0);    opacity:1;}
  65% {-webkit-transform:rotate(45deg) translate3d(-10px,18px,0);   transform:rotate(45deg) translate3d(-10px,18px,0);   opacity:0.82;}
  100%{-webkit-transform:rotate(45deg) translate3d(0,0,0);         transform:rotate(45deg) translate3d(0,0,0);         opacity:0.7;}
}
@keyframes nf4{
  0%  {-webkit-transform:rotate(45deg) translate3d(0,0,0);          transform:rotate(45deg) translate3d(0,0,0);          opacity:0.5;}
  40% {-webkit-transform:rotate(45deg) translate3d(-22px,16px,0);    transform:rotate(45deg) translate3d(-22px,16px,0);    opacity:0.92;}
  80% {-webkit-transform:rotate(45deg) translate3d(16px,-12px,0);    transform:rotate(45deg) translate3d(16px,-12px,0);    opacity:0.68;}
  100%{-webkit-transform:rotate(45deg) translate3d(0,0,0);          transform:rotate(45deg) translate3d(0,0,0);          opacity:0.5;}
}
@keyframes nf5{
  0%  {-webkit-transform:rotate(45deg) translate3d(0,0,0);          transform:rotate(45deg) translate3d(0,0,0);          opacity:0.6;}
  35% {-webkit-transform:rotate(45deg) translate3d(14px,-24px,0);    transform:rotate(45deg) translate3d(14px,-24px,0);    opacity:1;}
  70% {-webkit-transform:rotate(45deg) translate3d(-16px,10px,0);    transform:rotate(45deg) translate3d(-16px,10px,0);    opacity:0.78;}
  100%{-webkit-transform:rotate(45deg) translate3d(0,0,0);          transform:rotate(45deg) translate3d(0,0,0);          opacity:0.6;}
}

/* ── single exit container: one compositing layer for all content ── */
.content-layer{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  will-change:transform,opacity;
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
}

/* ── Enter CTA — glowing mint button with opacity pulse ── */
.enter-wrap{
  position:absolute;
  bottom:calc(env(safe-area-inset-bottom,0px) + 42px);
  left:50%;transform:translateX(-50%);
  z-index:9;
}
.enter-btn{
  display:inline-flex;align-items:center;
  padding:15px 56px;
  border-radius:50px;
  background:rgba(45,232,162,0.10);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:2px solid #2de8a2;
  color:#fff;
  font-size:13.5px;font-weight:600;letter-spacing:0.2em;padding-left:calc(56px + 0.2em);
  text-decoration:none;
  text-shadow:0 0 10px rgba(45,232,162,0.5);
  box-shadow:
    0 0 20px rgba(45,232,162,0.4),
    0 6px 30px rgba(0,0,0,0.48),
    inset 0 1px 0 rgba(255,255,255,0.07);
  transition:transform 0.15s,border-color 0.2s;
  will-change:transform,opacity;
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
  animation:enterPulse 2s ease-in-out infinite;
}
.enter-btn:hover{
  border-color:rgba(45,232,162,0.9);
  box-shadow:
    0 0 50px rgba(45,232,162,0.7),
    0 6px 30px rgba(0,0,0,0.48),
    inset 0 1px 0 rgba(255,255,255,0.1);
}
.enter-btn:active{-webkit-transform:scale(0.95) translateZ(0);transform:scale(0.95) translateZ(0);}
@keyframes enterPulse{
  0%,100%{opacity:0.85;}
  50%    {opacity:1;}
}

@media(max-width:390px){
  .card-water  {left:calc(50% - 162px);}
  .card-weight {left:calc(50% + 46px);}
  .card-fitness{left:calc(50% + 78px);}
  .card-goals  {left:calc(50% - 158px);}
  .axis-brand-text{font-size:34px;letter-spacing:8px;}
}
</style>
</head>
<body>
<div class="scene">
  <!-- star particle field: animated on canvas (single GPU layer) -->
  <canvas id="starCanvas"></canvas>

  <!-- deep teal ellipse glow behind everything -->
  <div class="bg-glow"></div>

  <div class="ambient"></div>
  <div class="ambient2"></div>

  <!-- floating diamond nodes -->
  <div class="fnode fn1"></div>
  <div class="fnode fn2"></div>
  <div class="fnode fn3"></div>
  <div class="fnode fn4"></div>
  <div class="fnode fn5"></div>
  <div class="fnode fn6"></div>

  <!-- single exit layer: axis + cards + CTA animate out together -->
  <div class="content-layer" id="contentLayer">

    <!-- axis stage: SVG + brand float as one unit -->
    <div class="axis-stage">
      <div class="axis-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
          <defs>
            <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="3.5" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <filter id="gs" x="-100%" y="-100%" width="300%" height="300%">
              <feGaussianBlur stdDeviation="9" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <filter id="gm" x="-70%" y="-70%" width="240%" height="240%">
              <feGaussianBlur stdDeviation="5.5" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>

          <!-- rings: opacity baked as stroke-opacity, CSS only does rotation -->
          <circle class="r1" cx="250" cy="250" r="72"  fill="none" stroke="#2de8a2" stroke-width="1"    stroke-dasharray="10,8"  stroke-opacity="0.38" filter="url(#g)"/>
          <circle class="r2" cx="250" cy="250" r="118" fill="none" stroke="#2de8a2" stroke-width="0.8"  stroke-dasharray="13,10" stroke-opacity="0.28" filter="url(#g)"/>
          <circle class="r3" cx="250" cy="250" r="166" fill="none" stroke="#2de8a2" stroke-width="0.65" stroke-dasharray="15,13" stroke-opacity="0.2"  filter="url(#g)"/>
          <circle class="r4" cx="250" cy="250" r="218" fill="none" stroke="#2de8a2" stroke-width="0.5"  stroke-dasharray="18,16" stroke-opacity="0.13" filter="url(#g)"/>

          <!-- arm pendulum group -->
          <g class="arm-group">
            <g stroke="#2de8a2" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-dasharray="9,6" filter="url(#g)">
              <line x1="250" y1="250" x2="250" y2="92"/>
              <line x1="250" y1="250" x2="387" y2="328"/>
              <line x1="250" y1="250" x2="113" y2="328"/>
            </g>
            <g fill="#2de8a2" filter="url(#gm)">
              <polygon points="250,80 243,93 257,93"/>
              <polygon points="387,328 370,327 377,314"/>
              <polygon points="113,328 123,314 130,327"/>
            </g>
          </g>

          <!-- static node shapes in arm gaps -->
          <g filter="url(#g)" opacity="0.55">
            <rect x="152" y="142" width="9"  height="9"  rx="1.5" fill="rgba(45,232,162,0.07)" stroke="#2de8a2" stroke-width="0.8"  transform="rotate(45 156.5 146.5)"/>
            <rect x="326" y="150" width="7"  height="7"  rx="1"   fill="rgba(45,232,162,0.06)" stroke="#2de8a2" stroke-width="0.75" transform="rotate(45 329.5 153.5)"/>
            <rect x="349" y="296" width="8"  height="8"  rx="1.5" fill="rgba(45,232,162,0.05)" stroke="#2de8a2" stroke-width="0.75" transform="rotate(45 353 300)"/>
            <rect x="138" y="294" width="7"  height="7"  rx="1"   fill="rgba(45,232,162,0.06)" stroke="#2de8a2" stroke-width="0.7"  transform="rotate(45 141.5 297.5)"/>
            <rect x="246" y="126" width="6"  height="6"  rx="1"   fill="rgba(45,232,162,0.08)" stroke="#2de8a2" stroke-width="0.8"  transform="rotate(45 249 129)"/>
            <rect x="393" y="213" width="7"  height="7"  rx="1"   fill="rgba(45,232,162,0.05)" stroke="#2de8a2" stroke-width="0.65" transform="rotate(45 396.5 216.5)"/>
            <rect x="96"  y="218" width="6"  height="6"  rx="1"   fill="rgba(45,232,162,0.06)" stroke="#2de8a2" stroke-width="0.65" transform="rotate(45 99 221)"/>
          </g>

          <!-- origin: breathing glow + fixed core -->
          <circle class="ob1" cx="250" cy="250" r="22" fill="#2de8a2" fill-opacity="0.06" filter="url(#gs)"/>
          <circle cx="250" cy="250" r="11" fill="none" stroke="#2de8a2" stroke-width="1.2" stroke-opacity="0.32" filter="url(#g)"/>
          <circle cx="250" cy="250" r="4.5" fill="#2de8a2" filter="url(#gs)"/>
        </svg>
      </div>

      <div class="axis-brand">
        <span class="axis-brand-text">AXIS</span>
      </div>
    </div>

    <!-- feature cards with live data -->
    <div class="card card-water">
      <div class="card-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 1.5C8 1.5 3 7.5 3 10.5C3 13.26 5.24 15.5 8 15.5C10.76 15.5 13 13.26 13 10.5C13 7.5 8 1.5 8 1.5Z" fill="#2de8a2" fill-opacity="0.85"/>
        </svg>
      </div>
      <div class="card-text">
        <span class="card-label">Water</span>
        <span class="card-data" id="cdWater">—</span>
      </div>
    </div>

    <div class="card card-weight">
      <div class="card-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="2" y="9" width="12" height="5" rx="2" stroke="#2de8a2" stroke-width="1.2"/>
          <path d="M6 9V7a2 2 0 114 0v2" stroke="#2de8a2" stroke-width="1.2" stroke-linecap="round" fill="none"/>
          <circle cx="8" cy="4" r="1.5" fill="#2de8a2" fill-opacity="0.8"/>
        </svg>
      </div>
      <div class="card-text">
        <span class="card-label">Weight</span>
        <span class="card-data" id="cdWeight">—</span>
      </div>
    </div>

    <div class="card card-fitness">
      <div class="card-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M1 8h2.5M12.5 8H15M3.5 8a4.5 4.5 0 019 0M5.5 5.5v5M10.5 5.5v5" stroke="#2de8a2" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="card-text">
        <span class="card-label">Fitness</span>
        <span class="card-data" id="cdFitness">—</span>
      </div>
    </div>

    <div class="card card-goals">
      <div class="card-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="6.5" stroke="#2de8a2" stroke-width="1.2"/>
          <circle cx="8" cy="8" r="3.5" stroke="#2de8a2" stroke-width="1"/>
          <circle cx="8" cy="8" r="1.6" fill="#2de8a2"/>
        </svg>
      </div>
      <div class="card-text">
        <span class="card-label">Goals</span>
        <span class="card-data" id="cdGoals">—</span>
      </div>
    </div>

    <div class="card card-ai">
      <div class="card-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 2L9.3 6.3L13.5 7.5L9.3 8.7L8 13L6.7 8.7L2.5 7.5L6.7 6.3L8 2Z" fill="#2de8a2" fill-opacity="0.9"/>
          <path d="M13 1.5L13.6 3L15 3.5L13.6 4L13 5.5L12.4 4L11 3.5L12.4 3L13 1.5Z" fill="#2de8a2" fill-opacity="0.55"/>
        </svg>
      </div>
      <div class="card-text">
        <span class="card-label">AI Assistant</span>
        <span class="card-data" id="cdAI">Ask Axis</span>
      </div>
    </div>

    <div class="enter-wrap">
      <a href="index.html" class="enter-btn" id="enterBtn">ENTER</a>
    </div>

  </div><!-- /.content-layer -->
</div>

<script>
(function () {
  /* ── live card data from localStorage ── */
  function pad2(n) { return String(n).padStart(2, '0'); }
  function activeDate() {
    var d = new Date();
    if (d.getHours() < 6) d.setDate(d.getDate() - 1);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function fill(id, txt) { var e = document.getElementById(id); if (e) e.textContent = txt; }

  function refreshCards() {
    var today = activeDate();

    // Water: po_water_v1 → history[date] ml consumed + profile-computed target
    try {
      var wData = JSON.parse(localStorage.getItem('po_water_v1') || '{}');
      var ml    = (wData.history && wData.history[today]) || 0;
      var p     = wData.profile || {};
      var wKg   = wData.weightUnit === 'lb' ? (p.weightKg || 75) / 2.20462 : (p.weightKg || 75);
      var tgtMl = wKg * 35
        + ((p.activityHrsPerWeek || 0) / 7) * 500
        + Math.max(0, ((wData.caffeineMgPerDay || 200) - 200) * 1.5)
        + (wData.substances || []).reduce(function(s, x) {
            return s + Math.max(0, ((x.dose != null ? x.dose : x.defaultDose) || 0) * (x.mlPerUnit || 0));
          }, 0);
      if (p.sex === 'm') tgtMl += 200;
      if ((p.age || 0) >= 50) tgtMl += 100;
      if (ml > 0 || tgtMl > 0) {
        fill('cdWater', (ml / 1000).toFixed(1) + 'L / ' + (tgtMl / 1000).toFixed(1) + 'L');
      }
    } catch (e) {}

    // Weight: po_coach_weights → most recent entry, converted to lb
    try {
      var entries = JSON.parse(localStorage.getItem('po_coach_weights') || 'null');
      if (Array.isArray(entries) && entries.length) {
        var sorted = entries.slice().sort(function(a, b) {
          return (b.dateKey || '') > (a.dateKey || '') ? 1 : -1;
        });
        var latest = sorted[0];
        if (latest && typeof latest.weight === 'number' && latest.weight > 0) {
          var gymState = JSON.parse(localStorage.getItem('po_coach_v1') || '{}');
          var wUnit    = gymState.units || 'kg';
          var wLb      = wUnit === 'lb' ? latest.weight : latest.weight * 2.20462;
          fill('cdWeight', wLb.toFixed(1) + ' lb');
        }
      }
    } catch (e) {}

    // Goals: goals:YYYY-MM-DD → count done / total
    try {
      var goals = JSON.parse(localStorage.getItem('goals:' + today) || 'null');
      if (Array.isArray(goals) && goals.length) {
        var done = goals.filter(function(g) { return g.done; }).length;
        fill('cdGoals', done + ' / ' + goals.length + ' done');
      }
    } catch (e) {}

    // Fitness: po_coach_v1 → splitRotation + splitAnchor
    try {
      var gym    = JSON.parse(localStorage.getItem('po_coach_v1') || '{}');
      var rot    = gym.splitRotation;
      var anchor = gym.splitAnchor;
      if (rot && rot.length && anchor && anchor.date != null && anchor.index != null) {
        var a = new Date(anchor.date), t = new Date();
        a.setHours(0, 0, 0, 0); t.setHours(0, 0, 0, 0);
        var diff = Math.round((t - a) / 86400000);
        var idx  = ((anchor.index + diff) % rot.length + rot.length) % rot.length;
        var spl  = rot[idx] || '';
        fill('cdFitness', /^(rest|off)$/i.test(spl) ? 'Rest Day' : spl + ' Day');
      }
    } catch (e) {}
  }

  refreshCards();
  setInterval(refreshCards, 30000);

  /* ── star particle field on canvas ── */
  var canvas = document.getElementById('starCanvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize, { passive: true });

  var stars = [];
  for (var i = 0; i < 46; i++) {
    stars.push({
      x:     Math.random() * window.innerWidth,
      y:     Math.random() * window.innerHeight,
      r:     Math.random() > 0.55 ? 1.5 : 1,
      vx:    (Math.random() - 0.5) * 0.2,
      vy:    (Math.random() - 0.5) * 0.2,
      base:  0.08 + Math.random() * 0.1,
      phase: Math.random() * 6.28,
      spd:   0.007 + Math.random() * 0.012
    });
  }

  function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var W = canvas.width, H = canvas.height;
    for (var j = 0; j < stars.length; j++) {
      var s = stars[j];
      s.x += s.vx; s.y += s.vy;
      if (s.x < -4) s.x = W + 4; else if (s.x > W + 4) s.x = -4;
      if (s.y < -4) s.y = H + 4; else if (s.y > H + 4) s.y = -4;
      s.phase += s.spd;
      var o = s.base * (0.55 + 0.45 * Math.sin(s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, 6.2832);
      ctx.fillStyle = 'rgba(45,232,162,' + o.toFixed(3) + ')';
      ctx.fill();
    }
    requestAnimationFrame(drawStars);
  }
  drawStars();

  /* ── exit animation: single container fade — one GPU layer ── */
  var enterBtn = document.getElementById('enterBtn');
  if (enterBtn) {
    enterBtn.addEventListener('click', function (e) {
      e.preventDefault();
      var dest = enterBtn.getAttribute('href');
      var contentLayer = document.getElementById('contentLayer');
      if (contentLayer) {
        contentLayer.style.transition = 'opacity 0.45s ease, transform 0.45s cubic-bezier(0.4,0,1,1)';
        contentLayer.style.opacity = '0';
        contentLayer.style.transform = 'scale(1.04) translateZ(0)';
      }
      setTimeout(function () { window.location.href = dest; }, 460);
    });
  }
})();
</script>
</body>
