<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d0c">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="axis-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Axis · Jarvis</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="topbar.js" defer></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #0a0d0c;
  --accent:      #2de8a2;
  --accent-2:    #1ec78a;
  --accent-glow: rgba(45,232,162,0.5);
  --blue:        #6f9bff;
  --text-1:      rgba(255,255,255,0.92);
  --text-2:      rgba(255,255,255,0.62);
  --text-3:      rgba(255,255,255,0.42);
  --card-bg:     linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.022));
  --card-border: rgba(255,255,255,0.08);
  --accent-card-bg:     linear-gradient(180deg, rgba(45,232,162,0.08), rgba(255,255,255,0.022));
  --accent-card-border: rgba(45,232,162,0.16);
  --font: 'Space Grotesk', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: 'Space Mono', ui-monospace, monospace;
}

html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--text-1);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  position: relative;
}

/* ── Aurora background ─────────────────────────────────────────────── */
.aurora { position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none;
  background: radial-gradient(135% 80% at 50% -8%, #102a22 0%, #0a1512 36%, #070b0a 72%, #060908 100%); }
.aurora::before, .aurora::after {
  content: ''; position: absolute; border-radius: 50%;
  filter: blur(70px); opacity: 0.5; will-change: transform; backface-visibility: hidden;
}
.aurora::before { width: 70vw; height: 70vw; left: -18vw; top: -22vh;
  background: radial-gradient(circle, rgba(45,232,162,0.30), transparent 66%);
  animation: auroraA 22s ease-in-out infinite; }
.aurora::after { width: 62vw; height: 62vw; right: -20vw; top: 6vh;
  background: radial-gradient(circle, rgba(111,155,255,0.22), transparent 66%);
  animation: auroraB 26s ease-in-out infinite; }
@keyframes auroraA { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(6vw,4vh) scale(1.12); } }
@keyframes auroraB { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-5vw,6vh) scale(1.08); } }

/* ── Layout ────────────────────────────────────────────────────────── */
.surface {
  position: relative;
  height: 100%;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: calc(env(safe-area-inset-top) + 78px) 18px 0;
  padding-bottom: 168px;
}
.surface::-webkit-scrollbar { width: 0; }

/* ── Briefing card ─────────────────────────────────────────────────── */
.brief {
  background: var(--accent-card-bg);
  border: 1px solid var(--accent-card-border);
  border-radius: 24px;
  padding: 22px 20px 20px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.07);
  animation: rise 0.55s cubic-bezier(.2,.7,.2,1) both;
}
.brief-eyebrow {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-3); display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
}
.brief-eyebrow .dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 10px var(--accent-glow); animation: pulse 2.6s ease-in-out infinite;
}
.brief-eyebrow .clock { margin-left: auto; letter-spacing: 0.08em; color: var(--text-2); }
.greeting { font-size: 27px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.12; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.chip {
  display: inline-flex; align-items: baseline; gap: 6px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09);
  border-radius: 12px; padding: 7px 11px;
}
.chip .k { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); }
.chip .v { font-family: var(--mono); font-size: 13px; color: var(--text-1); }
.chip.warn .v { color: #ffcf7a; }
.chip.good .v { color: var(--accent); }

.brief-body {
  margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.07);
  font-size: 15.5px; line-height: 1.55; color: var(--text-1); white-space: pre-wrap;
  min-height: 1.4em;
}
.brief-body.thinking { color: var(--text-3); }
.cursor { display: inline-block; width: 7px; height: 1.05em; vertical-align: -0.18em;
  background: var(--accent); border-radius: 2px; margin-left: 2px; animation: blink 1s steps(2) infinite; }

/* ── Response surface ──────────────────────────────────────────────── */
.response { margin-top: 20px; }
.response.empty { display: none; }
.response-q {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--text-3); margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
}
.response-q::before { content: '›'; color: var(--accent); font-size: 14px; }
.response-body { font-size: 16px; line-height: 1.6; color: var(--text-1); white-space: pre-wrap; }

/* ── Dock (input) ──────────────────────────────────────────────────── */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  padding: 0 14px max(14px, env(safe-area-inset-bottom));
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.dock::before {
  content: ''; position: absolute; inset: -40px 0 0; z-index: -1; pointer-events: none;
  background: linear-gradient(180deg, transparent, rgba(6,9,8,0.65) 38%, rgba(6,9,8,0.95));
}
.fg-btn {
  align-self: center;
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-3); background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 999px; padding: 7px 14px;
  cursor: pointer; transition: color .2s, border-color .2s;
}
.fg-btn:hover, .fg-btn:active { color: var(--accent); border-color: var(--accent-card-border); }
.fg-btn svg { width: 12px; height: 12px; }

.bar {
  width: 100%; max-width: 640px;
  display: flex; align-items: center; gap: 8px;
  background: rgba(12,18,16,0.72);
  -webkit-backdrop-filter: blur(26px) saturate(170%);
  backdrop-filter: blur(26px) saturate(170%);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 26px;
  box-shadow: 0 14px 44px -10px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.09);
  padding: 7px 7px 7px 18px;
}
.bar input {
  flex: 1; min-width: 0; background: none; border: none; outline: none;
  color: var(--text-1); font-family: var(--font); font-size: 16px; padding: 10px 0;
}
.bar input::placeholder { color: var(--text-3); }
.icon-btn {
  flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05);
  color: var(--text-2); transition: transform .12s, background .2s, color .2s;
}
.icon-btn:active { transform: scale(0.92); }
.icon-btn svg { width: 18px; height: 18px; }
.mic-btn.listening {
  background: rgba(45,232,162,0.16); border-color: var(--accent-card-border); color: var(--accent);
  animation: micpulse 1.3s ease-in-out infinite;
}
.send-btn {
  background: linear-gradient(180deg, var(--accent), var(--accent-2));
  border: none; color: #04140d;
  box-shadow: 0 4px 16px -4px var(--accent-glow);
}
.send-btn:disabled { opacity: 0.4; box-shadow: none; }

/* ── Future George overlay ─────────────────────────────────────────── */
.fg-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: radial-gradient(135% 80% at 50% -8%, #102a22 0%, #0a1512 38%, #070b0a 78%, #060908 100%);
  display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 22px) 22px max(22px, env(safe-area-inset-bottom));
  opacity: 0; visibility: hidden; transform: translateY(14px);
  transition: opacity .3s, transform .3s, visibility .3s;
}
.fg-overlay.open { opacity: 1; visibility: visible; transform: none; }
.fg-top { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
.fg-top .label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-3); }
.fg-close {
  margin-left: auto; width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text-2);
  display: inline-flex; align-items: center; justify-content: center; font-size: 18px;
}
.fg-progress { display: flex; gap: 6px; margin-bottom: 30px; }
.fg-progress .seg { flex: 1; height: 4px; border-radius: 3px; background: rgba(255,255,255,0.08); transition: background .3s; }
.fg-progress .seg.done { background: linear-gradient(90deg, var(--accent-2), var(--accent)); box-shadow: 0 0 10px var(--accent-glow); }
.fg-progress .seg.active { background: rgba(45,232,162,0.4); }

.fg-stage { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.fg-domain { font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
.fg-question { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.22; }
.fg-hint { color: var(--text-3); font-size: 14px; margin-top: 10px; line-height: 1.5; }
.fg-answer {
  margin-top: 22px; flex: 1; width: 100%; resize: none;
  background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px;
  padding: 16px; color: var(--text-1); font-family: var(--font); font-size: 16px; line-height: 1.55;
  outline: none; -webkit-overflow-scrolling: touch;
}
.fg-answer:focus { border-color: var(--accent-card-border); }
.fg-nav { display: flex; gap: 10px; margin-top: 18px; }
.btn {
  height: 52px; border-radius: 14px; font-family: var(--font); font-size: 15px; font-weight: 600;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: none; transition: transform .12s, opacity .2s;
}
.btn:active { transform: scale(0.98); }
.btn-primary { flex: 1; background: linear-gradient(180deg, var(--accent), var(--accent-2)); color: #04140d; }
.btn-primary:disabled { opacity: 0.4; }
.btn-ghost {
  flex: 0 0 auto; padding: 0 20px; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1); color: var(--text-2);
}
.fg-saving { text-align: center; color: var(--text-3); font-size: 13px; margin-top: 14px; font-family: var(--mono); min-height: 1em; }

@keyframes rise   { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
@keyframes pulse  { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
@keyframes blink  { 0% { opacity: 1; } 50% { opacity: 0; } }
@keyframes micpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(45,232,162,0.4); } 50% { box-shadow: 0 0 0 7px rgba(45,232,162,0); } }

@media (prefers-reduced-motion: reduce) {
  .aurora::before, .aurora::after, .brief, .brief-eyebrow .dot, .mic-btn.listening, .cursor { animation: none !important; }
}
</style>
</head>
<body>
<div class="aurora"></div>

<main class="surface" id="surface">
  <section class="brief" id="brief">
    <div class="brief-eyebrow">
      <span class="dot"></span> Jarvis
      <span class="clock" id="clock"></span>
    </div>
    <h1 class="greeting" id="greeting">Good evening, Sir</h1>
    <div class="chips" id="chips"></div>
    <div class="brief-body thinking" id="briefBody">Pulling the day together…</div>
  </section>

  <section class="response empty" id="response">
    <div class="response-q" id="responseQ"></div>
    <div class="response-body" id="responseBody"></div>
  </section>
</main>

<div class="dock">
  <button class="fg-btn" id="fgOpen" type="button">
    <svg viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    Future George
  </button>
  <div class="bar">
    <input id="input" type="text" placeholder="Ask Jarvis…" autocomplete="off" enterkeyhint="send" aria-label="Message">
    <button class="icon-btn mic-btn" id="mic" type="button" aria-label="Voice">
      <svg viewBox="0 0 18 18" fill="none"><rect x="6.2" y="1.5" width="5.6" height="9.6" rx="2.8" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 8.2a5.5 5.5 0 0 0 11 0M9 13.7V16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <button class="icon-btn send-btn" id="send" type="button" aria-label="Send" disabled>
      <svg viewBox="0 0 18 18" fill="none"><path d="M9 15V3M9 3L4 8M9 3l5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>

<!-- ── Future George setup / edit flow ──────────────────────────────── -->
<div class="fg-overlay" id="fgOverlay" aria-hidden="true">
  <div class="fg-top">
    <span class="brief-eyebrow" style="margin:0"><span class="dot"></span></span>
    <span class="label">Future George</span>
    <button class="fg-close" id="fgClose" type="button" aria-label="Close">✕</button>
  </div>
  <div class="fg-progress" id="fgProgress"></div>
  <div class="fg-stage">
    <div class="fg-domain" id="fgDomain"></div>
    <div class="fg-question" id="fgQuestion"></div>
    <div class="fg-hint" id="fgHint"></div>
    <textarea class="fg-answer" id="fgAnswer" placeholder="Speak plainly…"></textarea>
    <div class="fg-nav">
      <button class="btn btn-ghost" id="fgBack" type="button">Back</button>
      <button class="btn btn-primary" id="fgNext" type="button">Next</button>
    </div>
    <div class="fg-saving" id="fgSaving"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ── Storage helpers ────────────────────────────────────────────────
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (_) { return null; } }
  function lsRaw(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }

  // ── Date helpers (6 AM day boundary) ───────────────────────────────
  function pad(n) { return String(n).padStart(2, '0'); }
  function fmt(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function calendarToday() { return fmt(new Date()); }
  function activeDate() { const d = new Date(); if (d.getHours() < 6) d.setDate(d.getDate() - 1); return fmt(d); }

  // ── Identity ───────────────────────────────────────────────────────
  function firstName() {
    const s = lsGet('settings') || {};
    if (s.firstName) return s.firstName;
    const raw = lsRaw('dash_name') || '';
    if (raw) { const sp = raw.indexOf(' '); return sp >= 0 ? raw.slice(0, sp) : raw; }
    return '';
  }
  function timeOfDay() { const h = new Date().getHours(); return h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening'; }

  // ── Live data collectors ───────────────────────────────────────────
  function waterData() {
    const state = lsGet('po_water_v1') || {};
    const doneMl = ((state.history || {})[calendarToday()]) || 0;
    let targetMl = 2500;
    try {
      const lbs = parseFloat(lsRaw('dash_weight'));
      if (!isNaN(lbs) && lbs > 0) {
        const kg = lbs / 2.205;
        const sex = (lsRaw('dash_sex') || 'm').toLowerCase();
        const adj = (sex === 'female' || sex === 'f') ? 0 : 200;
        targetMl = Math.max(2000, Math.min(6000, Math.round(((kg * 35) + adj) / 50) * 50));
      }
    } catch (_) {}
    return { doneMl, targetMl, pct: targetMl ? Math.round(doneMl / targetMl * 100) : 0 };
  }
  function supplementData() {
    const items = lsGet('stack:items');
    const total = Array.isArray(items) ? items.length : 0;
    const taken = lsGet('stack:taken:' + activeDate()) || {};
    const done = (taken && typeof taken === 'object') ? Object.keys(taken).length : 0;
    return { done, total };
  }
  function goalData() {
    const goals = lsGet('goals:' + activeDate()) || [];
    const done = goals.filter(function (g) { return g && g.done; }).length;
    return { done, total: goals.length, pending: goals.filter(function (g) { return g && !g.done; }) };
  }
  function streakCount() { const s = lsGet('goal_streak_v1') || {}; return typeof s.count === 'number' ? s.count : 0; }
  function weightInfo() { const w = lsRaw('dash_weight'); const n = w != null ? parseFloat(w) : NaN; return isNaN(n) ? null : n; }

  // ── Future George profile ──────────────────────────────────────────
  const FG_CACHE = 'future_george_v1';
  const FG_DIMENSIONS = [
    { key: 'spiritual', label: 'Spiritual', question: 'Who are you becoming spiritually?',
      hint: 'Bible reading, prayer, the rhythm of your faith and who you answer to.' },
    { key: 'physical', label: 'Physical', question: 'What does your body look like a year from now?',
      hint: 'Target weight, calories, training split — the standard you hold for it.' },
    { key: 'mental', label: 'Mental', question: 'What is Future George learning?',
      hint: 'Books to finish, topics and skills to master, how you guard your focus.' },
    { key: 'financial', label: 'Financial', question: 'What does winning financially mean for you?',
      hint: 'Income targets, Kourtis Construction, savings, the number you are chasing.' },
    { key: 'creative', label: 'Creative', question: 'What are you building or releasing?',
      hint: 'Music made, projects shipped — the body of work with your name on it.' },
    { key: 'character', label: 'Character', question: 'How does Future George carry himself?',
      hint: 'Discipline, the word you keep, how you show up for others under pressure.' }
  ];
  let fgProfile = lsGet(FG_CACHE) || null;

  function cacheFG(p) { try { localStorage.setItem(FG_CACHE, JSON.stringify(p)); } catch (_) {} }

  async function loadFG() {
    try {
      const r = await fetch('/api/future-george', { method: 'GET' });
      if (r.ok) {
        const j = await r.json();
        if (j && j.profile) { fgProfile = j.profile; cacheFG(fgProfile); }
      }
    } catch (_) { /* keep cached copy */ }
    return fgProfile;
  }
  async function saveFG(profile) {
    cacheFG(profile); fgProfile = profile;
    try {
      const r = await fetch('/api/future-george', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ profile: profile })
      });
      if (r.ok) { const j = await r.json(); if (j && j.profile) { fgProfile = j.profile; cacheFG(fgProfile); } return true; }
    } catch (_) {}
    return false;
  }

  function fgHasContent(p) {
    if (!p) return false;
    return FG_DIMENSIONS.some(function (d) { return p[d.key] && String(p[d.key].summary || '').trim(); });
  }
  function fgProfileText(p) {
    if (!fgHasContent(p)) return '';
    let out = '';
    FG_DIMENSIONS.forEach(function (d) {
      const v = p[d.key] && String(p[d.key].summary || '').trim();
      if (v) out += '\n  ' + d.label.toUpperCase() + ': ' + v;
    });
    return out;
  }

  // ── System prompt ──────────────────────────────────────────────────
  const JARVIS_PERSONA =
"You are Jarvis, the AI assistant embedded in Axis — a personal operating system built for George. You have full visibility into his health, fitness, tasks, and daily operations.\n\n" +
"Your personality is modelled after J.A.R.V.I.S. from Iron Man. You are calm, precise, and formal. You address George as \"Sir\" naturally — woven into a sentence, never standing alone, never in every line.\n\n" +
"Core rules:\n" +
"1. Be terse. The fewest words that are complete and clear. No padding.\n" +
"2. Anticipate. After the answer, surface the next fact he'd want — unasked.\n" +
"3. Never perform enthusiasm. No \"Great\", \"Of course\", \"Certainly\", \"Absolutely\", \"Happy to help\". Lead with the answer, not an acknowledgement.\n" +
"4. Speak in briefings, not conversation.\n" +
"5. Flag problems plainly, once. Do not lecture.\n" +
"6. Own what you don't know: \"I don't have that data, Sir.\"\n" +
"7. Dry wit is permitted, sparingly, only when earned.\n" +
"8. Formal register. No slang, no emoji, no exclamation marks.";

  function buildSystem() {
    const name = firstName() || 'George';
    const now = new Date();
    const dateStr = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    const timeStr = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    const water = waterData(), supp = supplementData(), goals = goalData();
    const streak = streakCount(), wt = weightInfo();

    let p = JARVIS_PERSONA;

    const fgText = fgProfileText(fgProfile);
    if (fgText) {
      p += "\n\n=== FUTURE GEORGE — who he is becoming ===" +
           "\nThis is George's stated direction. Filter every response through it: measure today against where he said he's going, and name any drift plainly. Reference it the way a chief-of-staff references the boss's known priorities — naturally, never by reading it back." +
           fgText;
    } else {
      p += "\n\n=== FUTURE GEORGE ===\nNot yet defined. If it would genuinely help, you may note once that the Future George profile is empty — but do not nag.";
    }

    p += "\n\n=== LIVE DATA (" + dateStr + ", " + timeStr + ") ===";
    p += "\nWATER: " + water.doneMl + "ml / " + water.targetMl + "ml (" + water.pct + "%)";
    p += "\nSUPPLEMENTS: " + supp.done + "/" + supp.total + " taken today";
    p += "\nGOALS: " + goals.done + "/" + goals.total + " complete";
    if (goals.pending.length) p += "\n  Pending: " + goals.pending.map(function (g) { return g.text; }).join(' | ');
    p += "\nSTREAK: " + streak + " day" + (streak !== 1 ? 's' : '');
    if (wt != null) p += "\nWEIGHT: " + wt + " lbs";
    p += "\n\nGeorge's first name is " + name + ".";
    return p;
  }

  // ── /api/chat streaming ────────────────────────────────────────────
  async function streamChat(messages, onChunk) {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system: buildSystem(), messages: messages, max_tokens: 1000 })
    });
    if (!res.ok) {
      let detail = 'HTTP ' + res.status;
      try { const j = await res.json(); detail = j.error || detail; } catch (_) {}
      throw new Error(detail);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '', full = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim(); if (!raw) continue;
        try {
          const evt = JSON.parse(raw);
          if (evt.type === 'content_block_delta' && evt.delta && evt.delta.type === 'text_delta') {
            full += evt.delta.text; if (onChunk) onChunk(full);
          }
        } catch (_) {}
      }
    }
    return full;
  }

  // ── Greeting card render ───────────────────────────────────────────
  const $ = function (id) { return document.getElementById(id); };

  function renderClock() {
    $('clock').textContent = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
  }
  function renderGreeting() {
    const n = firstName();
    $('greeting').textContent = 'Good ' + timeOfDay() + (n ? ', ' + n : ', Sir');
  }
  function renderChips() {
    const water = waterData(), supp = supplementData(), goals = goalData();
    const chips = [];
    chips.push({ k: 'Water', v: water.pct + '%', cls: water.pct >= 80 ? 'good' : water.pct < 40 ? 'warn' : '' });
    if (supp.total) chips.push({ k: 'Stack', v: supp.done + '/' + supp.total, cls: supp.done >= supp.total ? 'good' : '' });
    chips.push({ k: 'Goals', v: goals.done + '/' + goals.total, cls: goals.total && goals.done >= goals.total ? 'good' : '' });
    const streak = streakCount();
    if (streak > 0) chips.push({ k: 'Streak', v: streak + 'd', cls: 'good' });
    $('chips').innerHTML = chips.map(function (c) {
      return '<span class="chip ' + (c.cls || '') + '"><span class="k">' + c.k + '</span><span class="v">' + c.v + '</span></span>';
    }).join('');
  }

  // ── Proactive briefing on load ─────────────────────────────────────
  async function runBriefing() {
    const body = $('briefBody');
    body.classList.add('thinking');
    body.textContent = 'Pulling the day together…';
    const prompt = "Deliver my standing briefing for right now, Sir. Two or three sentences. Lead with whatever matters most given the time of day and the live data — water, supplements, goals, streak — and one line on where I stand against who I'm becoming if the Future George profile is set. No preamble.";
    try {
      let first = true;
      await streamChat([{ role: 'user', content: prompt }], function (full) {
        if (first) { body.classList.remove('thinking'); first = false; }
        body.innerHTML = escapeHtml(full) + '<span class="cursor"></span>';
        scrollDown();
      });
      body.innerHTML = escapeHtml(body.textContent);
    } catch (err) {
      body.classList.remove('thinking');
      body.textContent = localBriefing();
    }
  }
  function localBriefing() {
    // Offline / error fallback — composed from local data, in voice.
    const water = waterData(), supp = supplementData(), goals = goalData();
    const bits = [];
    bits.push('You are at ' + water.doneMl + 'ml of ' + water.targetMl + 'ml today, Sir — ' + water.pct + '%.');
    if (supp.total) bits.push(supp.done + ' of ' + supp.total + ' supplements logged.');
    bits.push(goals.total ? (goals.done + ' of ' + goals.total + ' goals done.') : 'No goals set yet.');
    return bits.join(' ');
  }

  // ── Ask / response surface ─────────────────────────────────────────
  let busy = false;
  async function ask(text) {
    text = String(text || '').trim();
    if (!text || busy) return;
    busy = true;
    $('send').disabled = true;
    const resp = $('response'), q = $('responseQ'), b = $('responseBody');
    resp.classList.remove('empty');
    q.textContent = text;
    b.classList.add('thinking'); b.textContent = '';
    b.innerHTML = '<span class="cursor"></span>';
    scrollResponse();
    try {
      let first = true;
      await streamChat([{ role: 'user', content: text }], function (full) {
        if (first) { b.classList.remove('thinking'); first = false; }
        b.innerHTML = escapeHtml(full) + '<span class="cursor"></span>';
        scrollResponse();
      });
      b.innerHTML = escapeHtml(b.textContent);
    } catch (err) {
      b.classList.remove('thinking');
      b.textContent = 'I could not reach the network, Sir. ' + (err.message || '');
    } finally {
      busy = false;
      $('send').disabled = $('input').value.trim() === '';
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function scrollDown() { const s = $('surface'); s.scrollTop = s.scrollHeight; }
  function scrollResponse() { $('response').scrollIntoView({ block: 'start', behavior: 'smooth' }); }

  // ── Input wiring ───────────────────────────────────────────────────
  const input = $('input'), send = $('send');
  input.addEventListener('input', function () { send.disabled = input.value.trim() === '' || busy; });
  function submit() { const v = input.value; input.value = ''; send.disabled = true; ask(v); }
  send.addEventListener('click', submit);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });

  // ── Voice (Web Speech API) ─────────────────────────────────────────
  (function () {
    const mic = $('mic');
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { mic.style.display = 'none'; return; }
    const rec = new SR();
    rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = false;
    let listening = false, finalText = '';
    rec.onresult = function (e) {
      let interim = '';
      finalText = '';
      for (let i = 0; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalText += t; else interim += t;
      }
      input.value = (finalText + interim).trim();
      send.disabled = input.value.trim() === '';
    };
    rec.onend = function () {
      listening = false; mic.classList.remove('listening');
      if (input.value.trim()) submit();
    };
    rec.onerror = function () { listening = false; mic.classList.remove('listening'); };
    mic.addEventListener('click', function () {
      if (listening) { rec.stop(); return; }
      try { input.value = ''; finalText = ''; rec.start(); listening = true; mic.classList.add('listening'); } catch (_) {}
    });
  })();

  // ── Future George flow ─────────────────────────────────────────────
  const fgOverlay = $('fgOverlay');
  let fgStep = 0, fgDraft = null;

  function fgWorkingCopy() {
    const base = (fgProfile && typeof fgProfile === 'object') ? JSON.parse(JSON.stringify(fgProfile)) : {};
    FG_DIMENSIONS.forEach(function (d) {
      if (!base[d.key] || typeof base[d.key] !== 'object') base[d.key] = { summary: '', goals: [] };
      if (typeof base[d.key].summary !== 'string') base[d.key].summary = '';
      if (!Array.isArray(base[d.key].goals)) base[d.key].goals = [];
    });
    return base;
  }
  function openFG() {
    fgDraft = fgWorkingCopy();
    fgStep = 0;
    fgOverlay.classList.add('open');
    fgOverlay.setAttribute('aria-hidden', 'false');
    renderFGStep();
  }
  function closeFG() {
    fgOverlay.classList.remove('open');
    fgOverlay.setAttribute('aria-hidden', 'true');
    $('fgSaving').textContent = '';
  }
  function renderProgress() {
    $('fgProgress').innerHTML = FG_DIMENSIONS.map(function (_, i) {
      const cls = i < fgStep ? 'done' : i === fgStep ? 'active' : '';
      return '<span class="seg ' + cls + '"></span>';
    }).join('');
  }
  function renderFGStep() {
    const d = FG_DIMENSIONS[fgStep];
    renderProgress();
    $('fgDomain').textContent = (fgStep + 1) + ' / ' + FG_DIMENSIONS.length + ' · ' + d.label;
    $('fgQuestion').textContent = d.question;
    $('fgHint').textContent = d.hint;
    const ans = $('fgAnswer');
    ans.value = (fgDraft[d.key] && fgDraft[d.key].summary) || '';
    $('fgBack').style.visibility = fgStep === 0 ? 'hidden' : 'visible';
    $('fgNext').textContent = fgStep === FG_DIMENSIONS.length - 1 ? 'Save' : 'Next';
    $('fgSaving').textContent = '';
    setTimeout(function () { ans.focus(); }, 60);
  }
  function captureFG() {
    const d = FG_DIMENSIONS[fgStep];
    fgDraft[d.key].summary = $('fgAnswer').value.trim();
  }
  $('fgOpen').addEventListener('click', openFG);
  $('fgClose').addEventListener('click', closeFG);
  $('fgBack').addEventListener('click', function () { captureFG(); if (fgStep > 0) { fgStep--; renderFGStep(); } });
  $('fgNext').addEventListener('click', async function () {
    captureFG();
    if (fgStep < FG_DIMENSIONS.length - 1) { fgStep++; renderFGStep(); return; }
    // Final — save
    const btn = this; btn.disabled = true;
    $('fgSaving').textContent = 'Saving to Axis…';
    const ok = await saveFG(fgDraft);
    btn.disabled = false;
    $('fgSaving').textContent = ok ? 'Saved, Sir.' : 'Saved locally — sync will retry.';
    renderChips();
    setTimeout(function () {
      closeFG();
      // Re-brief now that the profile changed.
      runBriefing();
    }, 700);
  });

  // ── React to data changes from other tabs/pages ────────────────────
  window.addEventListener('storage', function (e) {
    if (!e.key) return;
    if (e.key === 'po_water_v1' || e.key.indexOf('stack:') === 0 || e.key.indexOf('goals:') === 0 || e.key === 'goal_streak_v1') {
      renderChips();
    }
  });

  // ── Boot ───────────────────────────────────────────────────────────
  renderClock(); renderGreeting(); renderChips();
  setInterval(renderClock, 30000);
  (async function () {
    await loadFG();
    renderChips();
    runBriefing();
  })();
})();
</script>
</body>
</html>
