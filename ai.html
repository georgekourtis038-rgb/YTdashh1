    const supa = _getSupa();
    if (!supa) return;
    try {
      supa.channel('app_state_chat_sessions')
        .on('postgres_changes',
          { event: '*', schema: 'public', table: 'app_state', filter: 'key=eq.chat_sessions' },
          function(payload) {
            if (!payload.new || !payload.new.data) return;
            if (JSON.stringify(payload.new.data) === _sessLastJson) return; // our own echo
            applyRemoteSessions(payload.new.data);
          })
        .subscribe();
    } catch (_) {}
  }
  function genSessionId()      { return 'chat_' + Date.now(); }

  function getPreview(messages) {
    for (let i = 0; i < messages.length; i++) {
      const m = messages[i];
      if (m.content && m.content.trim() && !m.hidden) {
        const txt = stripMd(m.content);
        if (!txt) continue;
        return txt.slice(0, 72) + (txt.length > 72 ? '…' : '');
      }
    }
    return 'New conversation';
  }

  function upsertSession(session) {
    touch(session);
    const sessions = getSessions();
    const idx = sessions.findIndex(function(s){ return s.id === session.id; });
    if (idx >= 0) sessions[idx] = session;
    else sessions.unshift(session);
    // Never trim the briefing session
    while (sessions.length > SESSIONS_MAX && sessions[sessions.length - 1].id !== BRIEFING_SESSION_ID) sessions.pop();
    saveSessions(sessions);
    pushSessions();
  }

  function saveCurrentSession() {
    if (!activeSessionId) return;
    const sessions = getSessions();
    const session  = sessions.find(function(s){ return s.id === activeSessionId; });
    if (!session || !chatHistory.length) return;
    session.messages = chatHistory.map(function(m){ return Object.assign({}, m, { ts: m.ts || Date.now() }); });
    if (!session.isBriefing) session.preview = getPreview(session.messages);
    touch(session);
    saveSessions(sessions);
    pushSessions();
  }

  // Auto-name a fresh conversation from its first user message (AI-generated).
  // Runs once, in the background; never overrides a manual rename or a title
  // that already exists (e.g. branched briefings).
  async function autoNameSession(sessionId, firstUserText) {
    if (!sessionId || sessionId === BRIEFING_SESSION_ID) return;
    if (!getAIPrefs().autoName) return; // auto-naming disabled in Settings → Axis AI
    const pre = getSessions().find(function(s){ return s.id === sessionId; });
    if (!pre || pre.autoTitled || pre.title) return;
    try {
      const system = 'You write an extremely short title for a chat, based on the user\'s first message. '
        + 'Rules: 2 to 4 words, Title Case, max 28 characters, no quotes, no trailing punctuation, no emoji. '
        + 'Reply with ONLY the title.';
      const raw = await callClaude(system, [{ role: 'user', content: String(firstUserText || '').slice(0, 800) }]);
      let title = stripMd(raw).replace(/^["'\s]+|["'\s.]+$/g, '').replace(/\s+/g, ' ').trim().slice(0, 32);
      if (!title) return;
      const sessions = getSessions();
      const s = sessions.find(function(x){ return x.id === sessionId; });
      if (!s || s.id === BRIEFING_SESSION_ID || s.autoTitled || s.title) return;
      s.title = title;
      s.autoTitled = true;
      touch(s);
      saveSessions(sessions);
      pushSessions();
      renderSidebar();
    } catch (_) { /* leave the first-message preview as the label */ }
  }

  function ensureBriefingSessionExists() {
    const sessions = getSessions();
    if (sessions.find(function(s){ return s.id === BRIEFING_SESSION_ID; })) return;
    sessions.unshift({
      id: BRIEFING_SESSION_ID,
      isBriefing: true,
      createdAt: new Date(0).toISOString(),
      briefingDates: [],
      messages: [],
      preview: 'Daily Briefing'
    });
    saveSessions(sessions);
  }

  // ── DOM helpers ──────────────────────────────────────────────────
  function scrollToBottom() { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }

  function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // Strip action tags + markdown markers for plain previews
  function stripMd(s) {
    return String(s || '')
      .replace(/<action>[\s\S]*?<\/action>/g, '')
      .replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/[*_`#>]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // Inline markdown on already-escaped text: **bold**, *italic*, `code`
  function mdInline(s) {
    return s
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }

  // Render a bubble's text with light markdown (bold, italic, code, bullets,
  // bold-line headers, paragraph spacing). Input is raw model text.
  function renderRich(el, text) {
    const esc   = escHtml(text || '');
    const lines = esc.split('\n');
    let html = '', inList = false;
    for (let i = 0; i < lines.length; i++) {
      const line   = lines[i];
      const bullet = line.match(/^\s*(?:[-•]|\d+\.)\s+(.*)$/);
      if (bullet) {
        if (!inList) { html += '<ul class="md-ul">'; inList = true; }
        html += '<li>' + mdInline(bullet[1]) + '</li>';
        continue;
      }
      if (inList) { html += '</ul>'; inList = false; }
      if (line.trim() === '') { html += '<div class="md-gap"></div>'; continue; }
      // A line that is entirely bold reads as a small header
      const headerMatch = line.match(/^\s*\*\*([^*]+)\*\*\s*:?\s*$/);
      if (headerMatch) { html += '<div class="md-h">' + mdInline(headerMatch[1]) + '</div>'; continue; }
      html += '<div class="md-line">' + mdInline(line) + '</div>';
    }
    if (inList) html += '</ul>';
    el.innerHTML = html;
  }

  function buildMsgEl(role, content, opts) {
    opts = opts || {};
    // Normalize: stored messages use 'assistant'; live flow uses 'ai'.
    const norm   = (role === 'user') ? 'user' : 'ai';
    const wrap   = document.createElement('div');
    const bubble = document.createElement('div');
    wrap.className   = 'msg msg-' + norm + (opts.isStatic ? ' msg-static' : '');
    bubble.className = 'msg-bubble';
    if (opts.isBriefing) {
      const header = document.createElement('div');
      header.className = 'msg-briefing-header';
      header.innerHTML = '<span class="msg-briefing-icon">⚡</span><span class="msg-briefing-label">Daily Briefing</span>';
      bubble.appendChild(header);
    }
    const textNode = document.createElement('span');
    textNode.className = 'msg-text';
    if (norm === 'ai') {
      // Strip any tool-call tags and render light markdown.
      renderRich(textNode, parseActions(content || '').clean);
    } else {
      textNode.textContent = content;
    }
    bubble.appendChild(textNode);
    if (opts.isBriefing && typeof opts.onBranch === 'function') {
      addBranchButton(bubble, opts.onBranch);
    }
    wrap.appendChild(bubble);
    return { wrap, bubble, textNode };
  }

  // "Discuss in new chat" — appended to briefing messages in the briefing thread.
  function addBranchButton(bubble, onClick) {
    const btn = document.createElement('button');
    btn.className = 'briefing-branch-btn';
    btn.type = 'button';
    btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6 3v8a4 4 0 0 0 4 4h8M14 11l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>Discuss in new chat';
    btn.addEventListener('click', function(e){ e.stopPropagation(); onClick(); });
    bubble.appendChild(btn);
    return btn;
  }

  // Spin off a fresh conversation seeded with a briefing, so the permanent
  // briefing thread stays clean. The briefing is stored as a hidden user msg
  // (for API context — Anthropic requires a leading user turn) plus the
  // visible assistant briefing bubble.
  function branchOffBriefing(text) {
    saveCurrentSession();
    const id = genSessionId();
    activeSessionId = id;
    try { localStorage.setItem(ACTIVE_KEY, id); } catch (_) {}
    const ts = Date.now();
    const hiddenUser   = { role: 'user', content: 'For reference, here is the daily briefing I want to discuss:\n\n' + text, hidden: true, ts: ts };
    const assistantMsg = { role: 'assistant', content: text, briefing: true, ts: ts + 1 };
    chatHistory = [hiddenUser, assistantMsg];
    const firstLine = stripMd((text || '').split('\n')[0] || '').slice(0, 36);
    upsertSession({
      id: id,
      createdAt: new Date().toISOString(),
      messages: chatHistory.slice(),
      title: firstLine ? ('Briefing — ' + firstLine) : 'Briefing follow-up',
      preview: stripMd(text).slice(0, 60)
    });
    renderThread(chatHistory);
    closeSidebar();
    renderSidebar();
    const input = document.getElementById('chatInput');
    if (input) { input.focus(); }
  }

  function appendMsg(role, content, opts) {
    const { wrap } = buildMsgEl(role, content, opts);
    document.getElementById('chatThread').appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  function appendTyping() {
    const thread = document.getElementById('chatThread');
    const wrap   = document.createElement('div');
    wrap.className = 'msg msg-ai msg-typing msg-static';
    wrap.innerHTML = '<div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
    thread.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  function appendDateSep(dateStr) {
    const sep = document.createElement('div');
    sep.className   = 'chat-date-sep';
    sep.textContent = dateStr;
    document.getElementById('chatThread').appendChild(sep);
  }

  function appendActionCard(message) {
    const card = document.createElement('div');
    card.className = 'action-card';
    card.innerHTML = '<span class="action-card-check">✓</span><span class="action-card-text"></span>';
    card.querySelector('.action-card-text').textContent = message;
    document.getElementById('chatThread').appendChild(card);
    scrollToBottom();
  }

  function renderThread(messages) {
    const thread = document.getElementById('chatThread');
    thread.innerHTML = '';
    if (!messages || !messages.length) return;
    const frag = document.createDocumentFragment();
    const allowBranch = (activeSessionId === BRIEFING_SESSION_ID);
    let lastDate = '';
    messages.forEach(function(m) {
      if (m.hidden) return;
      const dateKey = m.ts ? fmt(new Date(m.ts)) : '';
      if (dateKey && dateKey !== lastDate) {
        const sep = document.createElement('div');
        sep.className   = 'chat-date-sep';
        sep.textContent = new Date(dateKey + 'T12:00:00').toLocaleDateString('en-US', { weekday:'long', month:'short', day:'numeric' });
        frag.appendChild(sep);
        lastDate = dateKey;
      }
      const onBranch = (m.briefing && allowBranch)
        ? (function(txt){ return function(){ branchOffBriefing(txt); }; })(m.content)
        : null;
      const { wrap } = buildMsgEl(m.role, m.content, { isStatic: true, isBriefing: m.briefing, onBranch: onBranch });
      frag.appendChild(wrap);
      // Re-render any tool-action confirmation cards that were stored with this message
      if (m.role !== 'user' && Array.isArray(m.actions)) {
        m.actions.forEach(function(r) {
          const card = document.createElement('div');
          card.className = 'action-card msg-static';
          card.innerHTML = '<span class="action-card-check">✓</span><span class="action-card-text"></span>';
          card.querySelector('.action-card-text').textContent = r;
          frag.appendChild(card);
        });
      }
    });
    thread.appendChild(frag);
    scrollToBottom();
  }

  // ── Action executors ─────────────────────────────────────────────
  async function addCalendarEvent(params) {
    const tok = await GoogleAuth.getToken();
    if (!tok) return 'Calendar not connected — sign in via the email page first.';
    try {
      const tz    = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const start = params.time ? new Date(params.date+'T'+params.time+':00') : null;
      const end   = start ? new Date(start.getTime()+(params.duration_minutes||60)*60000) : null;
      const body  = {
        summary: params.title,
        start: start ? { dateTime: start.toISOString(), timeZone: tz } : { date: params.date },
        end:   end   ? { dateTime: end.toISOString(),   timeZone: tz } : { date: params.date }
      };
      const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events',
        { method:'POST', headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'}, body: JSON.stringify(body) });
      if (!res.ok) return 'Calendar error ' + res.status;
      return '"' + params.title + '" added to calendar on ' + params.date;
    } catch(e) { return 'Calendar error: ' + e.message; }
  }

  async function markEmailRead(msgId) {
    const tok = await GoogleAuth.getToken();
    if (!tok) return 'Gmail not connected — sign in via the email page first.';
    try {
      const res = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/'+msgId+'/modify',
        { method:'POST', headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},
          body: JSON.stringify({ removeLabelIds: ['UNREAD'] }) });
      if (!res.ok) return 'Gmail error ' + res.status;
      _cachedGmailEmails = _cachedGmailEmails.filter(function(e){ return e.id !== msgId; });
      try {
        const cache = JSON.parse(localStorage.getItem('axis_gmail_cache')||'[]');
        localStorage.setItem('axis_gmail_cache', JSON.stringify(cache.filter(function(e){ return e.id !== msgId; })));
      } catch(_) {}
      return 'Email marked as read.';
    } catch(e) { return 'Gmail error: ' + e.message; }
  }

  // ── Supabase sync after tool actions ────────────────────────────
  // Mirrors the exact scope + row key that health.html and index.html use,
  // so the cloud value is up-to-date before any page reload can overwrite it.
  function _collectScope(scopeFn) {
    const out = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !scopeFn(k)) continue;
      try { out[k] = JSON.parse(localStorage.getItem(k)); } catch(_) {}
    }
    return out;
  }

  async function syncAfterAction(tool) {
    // health scope  (same row key health.html uses)
    if (tool === 'set_water_target' || tool === 'set_calorie_target') {
      const data = _collectScope(function(k){
        return k === 'po_water_v1' || k.indexOf('calorie_') === 0 || k.indexOf('stack:') === 0;
      });
      await _supaUpsert('health', data);
    }
    // goals scope  (same as index.html)
    if (tool === 'add_goal' || tool === 'update_goal' || tool === 'delete_goal' ||
        tool === 'add_todo' || tool === 'update_todo' || tool === 'delete_todo') {
      const data = _collectScope(function(k){
        return k === 'axis_goals' || k === 'goal_streak_v1' || k.indexOf('goals:') === 0;
      });
      await _supaUpsert('goals', data);
    }
    // add_calendar_event / mark_email_read hit external APIs directly — no localStorage to sync
  }

  async function executeAction(tool, params) {
    // Respect the user's tool permissions (Settings → Axis AI)
    const _tp = getAIPrefs().tools;
    const _cat = (tool === 'set_calorie_target' || tool === 'set_water_target') ? 'targets'
      : (tool === 'add_calendar_event') ? 'calendar'
      : (tool === 'mark_email_read') ? 'email'
      : 'goals';
    if (!_tp[_cat]) return 'That action is turned off in Settings → Axis AI.';

    let result;
    if (tool === 'set_calorie_target') {
      lsSet('calorie_targets_v1', Object.assign(lsGet('calorie_targets_v1')||{}, params));
      result = 'Calorie target set to '+params.kcal+' kcal/day'+(params.protein?' · '+params.protein+'g protein':'')+(params.carbs?' · '+params.carbs+'g carbs':'')+(params.fat?' · '+params.fat+'g fat':'');
    } else if (tool === 'set_water_target') {
      const state = lsGet('po_water_v1') || {};
      if (!state.settings) state.settings = {};
      state.settings.targetMl = params.target_ml;
      lsSet('po_water_v1', state);
      result = 'Water target updated to ' + params.target_ml + ' ml/day';
    } else if (tool === 'add_goal') {
      const goals = lsGet('axis_goals') || [];
      const start = params.start != null ? params.start : null;
      const goal = {
        id: _genId('g'),
        category: params.category || 'custom',
        title: params.title,
        targetValue: params.target != null ? params.target : null,
        unit: params.unit || '',
        startValue: start,
        currentValue: params.current != null ? params.current : start,
        startDate: new Date().toISOString().slice(0, 10),
        deadline: params.deadline || null,
      };
      goals.push(goal);
      lsSet('axis_goals', goals);
      result = 'Long-term goal "' + params.title + '" created';
    } else if (tool === 'update_goal') {
      const goals = lsGet('axis_goals') || [];
      const idx   = goals.findIndex(function(g){ return g.id === params.id; });
      if (idx===-1) return 'Goal not found: ' + params.id;
      if (params.title    != null) goals[idx].title        = params.title;
      if (params.target   != null) goals[idx].targetValue  = params.target;
      if (params.unit     != null) goals[idx].unit         = params.unit;
      if (params.start    != null) goals[idx].startValue   = params.start;
      if (params.current  != null) goals[idx].currentValue = params.current;
      if (params.deadline != null) goals[idx].deadline     = params.deadline;
      lsSet('axis_goals', goals);
      result = 'Goal "' + goals[idx].title + '" updated';
    } else if (tool === 'delete_goal') {
      const goals = lsGet('axis_goals') || [];
      const idx   = goals.findIndex(function(g){ return g.id === params.id; });
      if (idx===-1) return 'Goal not found: ' + params.id;
      const title = goals[idx].title;
      goals.splice(idx, 1);
      lsSet('axis_goals', goals);
      result = 'Goal "' + title + '" deleted';
    } else if (tool === 'add_todo') {
      if (!params.text) return 'No task text provided';
      const dayKey = _resolveDayKey(params.when);
      const todos = lsGet('goals:' + dayKey) || [];
      todos.push({ text: params.text, done: false });
      lsSet('goals:' + dayKey, todos);
      result = 'Added "' + params.text + '" to ' + (params.when === 'tomorrow' ? 'tomorrow' : 'today');
    } else if (tool === 'update_todo') {
      const dayKey = _resolveDayKey(params.when);
      const todos = lsGet('goals:' + dayKey) || [];
      const q = String(params.text || '').toLowerCase();
      let idx = todos.findIndex(function(t){ return (t.text || '').toLowerCase() === q; });
      if (idx === -1) idx = todos.findIndex(function(t){ return (t.text || '').toLowerCase().indexOf(q) !== -1; });
      if (idx === -1) return 'Task not found: ' + params.text;
      if (params.new_text != null) todos[idx].text = params.new_text;
      if (params.done != null) {
        todos[idx].done = !!params.done;
        todos[idx].doneAt = params.done ? new Date().toISOString() : undefined;
      }
      lsSet('goals:' + dayKey, todos);
      result = 'Updated "' + todos[idx].text + '"' + (params.done != null ? (params.done ? ' — marked done' : ' — marked not done') : '');
    } else if (tool === 'delete_todo') {
      const dayKey = _resolveDayKey(params.when);
      const todos = lsGet('goals:' + dayKey) || [];
      const q = String(params.text || '').toLowerCase();
      let idx = todos.findIndex(function(t){ return (t.text || '').toLowerCase() === q; });
      if (idx === -1) idx = todos.findIndex(function(t){ return (t.text || '').toLowerCase().indexOf(q) !== -1; });
      if (idx === -1) return 'Task not found: ' + params.text;
      const removed = todos[idx].text;
      todos.splice(idx, 1);
      lsSet('goals:' + dayKey, todos);
      result = 'Deleted "' + removed + '"';
    } else if (tool === 'add_calendar_event') {
      return await addCalendarEvent(params);
    } else if (tool === 'mark_email_read') {
      return await markEmailRead(params.id);
    } else {
      return 'Unknown tool: ' + tool;
    }
    // Push the affected scope to Supabase immediately so a page refresh can't
    // overwrite the new value with a stale cloud snapshot.
    await syncAfterAction(tool);
    return result;
  }

  function parseActions(text) {
    const actions = [];
    const clean   = text.replace(/<action>([\s\S]*?)<\/action>/g, function(_, inner) {
      try { const p = JSON.parse(inner.trim()); if (p.tool && p.params) actions.push(p); } catch(_) {}
      return '';
    }).replace(/\n{3,}/g, '\n\n').trim();
    return { clean, actions };
  }

  // ── Send message ─────────────────────────────────────────────────
  async function sendMessage(text) {
    text = text.trim();
    if (!text) return;
    const input   = document.getElementById('chatInput');
    const sendBtn = document.getElementById('chatSend');
    input.value   = '';
    input.disabled = true; sendBtn.disabled = true;

    // First visible user turn in this chat → eligible for AI auto-naming
    const isFirstUserTurn = !chatHistory.some(function(m){ return m.role === 'user' && !m.hidden; });
    const namingSessionId = activeSessionId;

    const userMsg = { role: 'user', content: text, ts: Date.now() };
    chatHistory.push(userMsg);
    appendMsg('user', text);

    const typingEl = appendTyping();
    const thread   = document.getElementById('chatThread');
    const { wrap: aiWrap, bubble: aiBubble, textNode: aiText } = buildMsgEl('ai', '');
    aiBubble.classList.add('streaming');
    let attached = false;

    try {
      const full = await streamClaude(chatHistory.slice(), function(accumulated) {
        if (!attached) { typingEl.remove(); thread.appendChild(aiWrap); attached = true; }
        aiText.textContent = accumulated;
        scrollToBottom();
      });
      aiBubble.classList.remove('streaming');
      if (!attached) { typingEl.remove(); appendMsg('ai', 'No response received.'); }
      else {
        const { clean, actions } = parseActions(full);
        renderRich(aiText, clean);
        const aiMsg = { role: 'assistant', content: full, ts: Date.now() };
        chatHistory.push(aiMsg);
        // Background memory extraction — don't await, non-blocking
        extractMemories(text, clean || full, activeSessionId);
        // Execute tool actions, render + persist their confirmation cards
        const results = [];
        for (const action of actions) {
          const r = await executeAction(action.tool, action.params);
          results.push(r);
          appendActionCard(r);
        }
        if (results.length) aiMsg.actions = results;
        saveCurrentSession();
        // Name the conversation from its first message (background, non-blocking)
        if (isFirstUserTurn && namingSessionId !== BRIEFING_SESSION_ID) {
          autoNameSession(namingSessionId, text);
        }
      }
    } catch (err) {
      aiBubble.classList.remove('streaming');
      typingEl.remove();
      if (attached) aiWrap.remove();
      chatHistory.pop();
      const errMsg = (err && err.message) ? err.message : String(err);
      console.error('[chat] sendMessage error:', errMsg);
      appendMsg('ai', 'Error: ' + errMsg);
    } finally {
      input.disabled = false; sendBtn.disabled = false; input.focus();
    }
  }

  // ── Daily Briefing (persistent, one chat forever) ────────────────
  // opts.silent → generate + persist without touching the DOM (used when the
  // wake-time trigger fires while the user is in another conversation).
  async function runTodaysBriefing(opts) {
    const silent   = !!(opts && opts.silent);
    const todayKey = todayStr();
    const sessions = getSessions();
    const session  = sessions.find(function(s){ return s.id === BRIEFING_SESSION_ID; });
    if (session && Array.isArray(session.briefingDates) && session.briefingDates.includes(todayKey)) return;
    if (_briefingRunning) return;
    _briefingRunning = true;

    const thread    = document.getElementById('chatThread');
    const now       = new Date();
    const dateLabel = now.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });

    let sep = null, loadRow = null, bWrap = null, bBubble = null, bText = null, attached = false;

    if (!silent) {
      sep = document.createElement('div');
      sep.className   = 'chat-date-sep';
      sep.textContent = dateLabel;
      thread.appendChild(sep);

      loadRow = document.createElement('div');
      loadRow.className = 'briefing-loading-row';
      loadRow.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div><span>Preparing your briefing…</span>';
      thread.appendChild(loadRow);
      scrollToBottom();

      const built = buildMsgEl('ai', '', { isBriefing: true });
      bWrap = built.wrap; bBubble = built.bubble; bText = built.textNode;
      bBubble.classList.add('streaming');
    }

    let briefingFull = '';

    function attachBriefing() {
      if (silent || attached) return;
      attached = true;
      if (loadRow && loadRow.parentNode) loadRow.remove();
      if (bWrap && !bWrap.parentNode) thread.appendChild(bWrap);
    }

    const bp = getAIPrefs().briefing;
    let briefingRequest = 'Daily briefing — ' + dateLabel + '. Format strictly as follows:\n'
      + '1. Start with the date as a bold header: "' + dateLabel + '"\n';
    let _bn = 2;
    if (bp.goals)    briefingRequest += _bn++ + '. Long-term goals: brief current status and one concrete action for today to stay on track.\n';
    if (bp.calendar) briefingRequest += _bn++ + '. Calendar: highlight any events today or tomorrow (skip if none).\n';
    if (bp.emails)   briefingRequest += _bn++ + '. Emails: flag up to two unread emails worth acting on (skip if none).\n';
    if (bp.health)   briefingRequest += _bn++ + '. Health: one line on hydration/nutrition pace for the day (skip if no data).\n';
    briefingRequest += 'Tone: concise, professional, butler. No exclamation marks, no motivational language. Under 120 words total.';

    // Build API messages: existing session history + today's request
    const existingMsgs = (session && session.messages ? session.messages : [])
      .map(function(m){ return { role: m.role, content: m.content || '' }; })
      .filter(function(m){ return m.content; });
    const apiMessages = existingMsgs.concat([{ role: 'user', content: briefingRequest }]);

    try {
      briefingFull = await streamClaude(apiMessages, function(accumulated) {
        if (silent) return;
        attachBriefing();
        bText.textContent = accumulated;
        scrollToBottom();
      });
      if (!briefingFull) throw new Error('empty response from API');
      if (!silent) {
        bBubble.classList.remove('streaming');
        attachBriefing();
        renderRich(bText, briefingFull);
        // Non-silent briefings only render inside the briefing thread → branchable
        addBranchButton(bBubble, function(){ branchOffBriefing(briefingFull); });
      }

      // Persist hidden user msg + assistant briefing to the session
      const hiddenUserMsg = { role: 'user', content: briefingRequest, hidden: true, ts: Date.now() };
      const assistantMsg  = { role: 'assistant', content: briefingFull, briefing: true, ts: Date.now() };

      const sessions2 = getSessions();
      const s2 = sessions2.find(function(s){ return s.id === BRIEFING_SESSION_ID; });
      if (s2) {
        if (!Array.isArray(s2.briefingDates)) s2.briefingDates = [];
        s2.briefingDates.push(todayKey);
        if (!Array.isArray(s2.messages)) s2.messages = [];
        s2.messages.push(hiddenUserMsg);
        s2.messages.push(assistantMsg);
        s2.preview = dateLabel + ' — ' + stripMd(briefingFull).slice(0, 50) + '…';
        touch(s2);
        saveSessions(sessions2);
        pushSessions();
      }

      // Rebuild chatHistory from saved session if it's the one on screen
      if (activeSessionId === BRIEFING_SESSION_ID) {
        const s3 = getSessions().find(function(s){ return s.id === BRIEFING_SESSION_ID; });
        if (s3) {
          chatHistory = (s3.messages || []).map(function(m){
            return { role: m.role, content: m.content, hidden: m.hidden, briefing: m.briefing, ts: m.ts };
          });
        }
      }

      // Legacy cache for push-init
      const obj = { date: todayKey, text: briefingFull };
      try { localStorage.setItem('axis_briefing_cache', JSON.stringify(obj)); } catch(_) {}
      _supaUpsert('briefing', obj);

    } catch (err) {
      const errMsg = (err && err.message) ? err.message : String(err);
      console.error('[briefing] error:', errMsg);
      if (!silent) {
        bBubble.classList.remove('streaming');
        attachBriefing();
        if (briefingFull) {
          renderRich(bText, briefingFull + '\n\n[Briefing cut short — ' + errMsg + ']');
        } else {
          bText.textContent = 'Could not load briefing: ' + errMsg;
        }
        const retryBtn = document.createElement('button');
        retryBtn.className   = 'briefing-retry-btn';
        retryBtn.textContent = '⟳ Retry';
        retryBtn.addEventListener('click', function() {
          retryBtn.remove();
          if (bWrap) bWrap.remove();
          if (sep && sep.parentNode) sep.remove();
          runTodaysBriefing();
        });
        bBubble.appendChild(retryBtn);
      }
    } finally {
      _briefingRunning = false;
    }

    renderSidebar();
  }

  // ── Wake-time scheduling ─────────────────────────────────────────
  // The briefing should fire at the user's wake time, not merely on app open.
  // (A PWA can't run while fully closed — this fires whenever the app is open
  //  at/after wake time, and stays armed while it's open.)
  function getWakeMinutes() {
    const raw = lsRaw('dash_wake_time') || '08:00';
    const m = /^(\d{1,2}):(\d{2})$/.exec(raw);
    if (!m) return 8 * 60;
    return (parseInt(m[1], 10) % 24) * 60 + (parseInt(m[2], 10) % 60);
  }
  // Briefing fires at the user's chosen briefing time, falling back to wake time.
  function getBriefingMinutes() {
    const t = getAIPrefs().briefing.time;
    const m = /^(\d{1,2}):(\d{2})$/.exec(t || '');
    if (m) return (parseInt(m[1], 10) % 24) * 60 + (parseInt(m[2], 10) % 60);
    return getWakeMinutes();
  }
  function briefingDoneToday() {
    const s = getSessions().find(function(x){ return x.id === BRIEFING_SESSION_ID; });
    return !!(s && Array.isArray(s.briefingDates) && s.briefingDates.includes(todayStr()));
  }
  function maybeRunBriefingNow() {
    if (!getAIPrefs().briefing.enabled) return; // briefing disabled in Settings → Axis AI
    if (briefingDoneToday()) return;
    const now    = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    if (nowMin < getBriefingMinutes()) return; // before briefing time — keep waiting
    const silent = activeSessionId !== BRIEFING_SESSION_ID;
    runTodaysBriefing({ silent: silent });
  }
  function scheduleBriefing() {
    clearTimeout(_briefingTimer);
    if (!getAIPrefs().briefing.enabled) return; // disabled — nothing to schedule
    const now    = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const wake   = getBriefingMinutes();
    if (!briefingDoneToday() && nowMin < wake) {
      const msUntil = ((wake - nowMin) * 60 - now.getSeconds()) * 1000;
      _briefingTimer = setTimeout(maybeRunBriefingNow, Math.max(1000, msUntil));
    }
    // Safety net: re-check every 5 min (covers crossing wake time with the tab
    // left open, clock drift, and day rollover).
    if (!_briefingInterval) {
      _briefingInterval = setInterval(function() {
        maybeRunBriefingNow();
        if (!briefingDoneToday()) scheduleBriefing();
      }, 5 * 60 * 1000);
    }
  }

  // ── New chat (regular — no briefing) ─────────────────────────────
  function newChat() {
    saveCurrentSession();
    const id = genSessionId();
    activeSessionId = id;
    localStorage.setItem(ACTIVE_KEY, id);
    chatHistory = [];
    upsertSession({ id, createdAt: new Date().toISOString(), messages: [], preview: 'New conversation' });
    document.getElementById('chatThread').innerHTML = '';
    closeSidebar();
    renderSidebar();
  }

  // ── Load session ─────────────────────────────────────────────────
  async function loadSession(id) {
    saveCurrentSession();
    activeSessionId = id;
    localStorage.setItem(ACTIVE_KEY, id);
    const session = getSessions().find(function(s){ return s.id === id; });
    if (!session) return;
    chatHistory = (session.messages || []).map(function(m){
      return { role: m.role, content: m.content, hidden: m.hidden, briefing: m.briefing, ts: m.ts };
    });
    renderThread(session.messages || []);
    closeSidebar();
    renderSidebar();
    if (id === BRIEFING_SESSION_ID) {
      await runTodaysBriefing();
    }
  }

  // ── Rename / delete sessions ─────────────────────────────────────
  function renameSession(id) {
    const sessions = getSessions();
    const s = sessions.find(function(x){ return x.id === id; });
    if (!s) return;
    const current = s.title || stripMd(s.preview) || '';
    const name = window.prompt('Rename conversation', current);
    if (name === null) return;
    const t = name.trim();
    if (t) { s.title = t; s.autoTitled = true; } else { delete s.title; }
    touch(s);
    saveSessions(sessions);
    pushSessions();
    renderSidebar();
  }

  function deleteSession(id) {
    if (id === BRIEFING_SESSION_ID) return; // briefing is permanent
    if (!window.confirm('Delete this conversation? This cannot be undone.')) return;
    const remaining = getSessions().filter(function(x){ return x.id !== id; });
    saveSessions(remaining);
    const tomb = getDeleted(); tomb[id] = Date.now(); saveDeleted(tomb); // tombstone so it stays deleted across devices
    pushSessions();
    if (activeSessionId === id) {
      activeSessionId = BRIEFING_SESSION_ID;
      localStorage.setItem(ACTIVE_KEY, BRIEFING_SESSION_ID);
      const bs = getSessions().find(function(x){ return x.id === BRIEFING_SESSION_ID; });
      const msgs = (bs && bs.messages) ? bs.messages : [];
      chatHistory = msgs.map(function(m){
        return { role: m.role, content: m.content, hidden: m.hidden, briefing: m.briefing, ts: m.ts };
      });
      renderThread(msgs);
    }
    renderSidebar();
  }

  // ── Sidebar ──────────────────────────────────────────────────────
  const ICON_KEBAB = '<svg width="4" height="16" viewBox="0 0 4 16" fill="currentColor"><circle cx="2" cy="2" r="1.9"></circle><circle cx="2" cy="8" r="1.9"></circle><circle cx="2" cy="14" r="1.9"></circle></svg>';

  // ── Row options popover ──────────────────────────────────────────
  let _rowMenuId = null;
  function openRowMenu(btn, sessionId) {
    const menu = document.getElementById('rowMenu');
    _rowMenuId = sessionId;
    menu.classList.add('open');           // display first so we can measure
    const r  = btn.getBoundingClientRect();
    const mw = menu.offsetWidth;
    const mh = menu.offsetHeight;
    let left = r.right - mw;
    if (left < 8) left = 8;
    let top = r.bottom + 6;
    if (top + mh > window.innerHeight - 8) top = r.top - mh - 6; // flip up near bottom
    menu.style.left = left + 'px';
    menu.style.top  = top + 'px';
  }
  function closeRowMenu() {
    const menu = document.getElementById('rowMenu');
    if (menu) menu.classList.remove('open');
    _rowMenuId = null;
  }

  function renderSidebar() {
    const list = document.getElementById('sidebarList');
    list.innerHTML = '';
    const allSessions = getSessions();

    // Briefing session pinned at top
    const briefingSession = allSessions.find(function(s){ return s.id === BRIEFING_SESSION_ID; });
    if (briefingSession) {
      const row = document.createElement('div');
      row.className = 'sidebar-row sidebar-briefing-row' + (activeSessionId === BRIEFING_SESSION_ID ? ' active' : '');
      const main = document.createElement('button');
      main.className = 'sidebar-row-main';
      main.innerHTML = '<span class="sidebar-row-date">⚡ Daily Briefing</span>'
        + '<span class="sidebar-row-preview">' + escHtml(stripMd(briefingSession.preview) || 'Daily Briefing') + '</span>';
      main.addEventListener('click', function(){ loadSession(BRIEFING_SESSION_ID); });
      row.appendChild(main);
      list.appendChild(row);
    }

    // Regular sessions sorted newest first
    const regular = allSessions
      .filter(function(s){ return s.id !== BRIEFING_SESSION_ID; })
      .slice()
      .sort(function(a, b){ return b.createdAt.localeCompare(a.createdAt); });

    if (!regular.length && !briefingSession) {
      list.innerHTML = '<p class="sidebar-empty">No past conversations</p>';
      return;
    }

    regular.forEach(function(s) {
      const row = document.createElement('div');
      row.className = 'sidebar-row' + (s.id === activeSessionId ? ' active' : '');

      const main = document.createElement('button');
      main.className = 'sidebar-row-main';
      const d = new Date(s.createdAt);
      const dateLabel = d.toLocaleDateString('en-US', {
        month: 'short', day: 'numeric',
        year: d.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined
      });
      const display = s.title ? s.title : (stripMd(s.preview) || 'New conversation');
      main.innerHTML = '<span class="sidebar-row-date">' + escHtml(dateLabel) + '</span>'
        + '<span class="sidebar-row-preview">' + escHtml(display) + '</span>';
      main.addEventListener('click', function(){ loadSession(s.id); });
      row.appendChild(main);

      const acts = document.createElement('div');
      acts.className = 'sidebar-row-actions';
      const menuBtn = document.createElement('button');
      menuBtn.className = 'sidebar-row-menu-btn';
      menuBtn.setAttribute('aria-label', 'Conversation options');
      menuBtn.innerHTML = ICON_KEBAB;
      menuBtn.addEventListener('click', function(e){
        e.stopPropagation();
        if (_rowMenuId === s.id) { closeRowMenu(); return; }
        openRowMenu(menuBtn, s.id);
      });
      acts.appendChild(menuBtn);
      row.appendChild(acts);

      list.appendChild(row);
    });
  }

  function openSidebar() {
    renderSidebar();
    document.getElementById('chatSidebar').classList.add('open');
    document.getElementById('sidebarOverlay').classList.add('open');
  }
  function closeSidebar() {
    closeRowMenu();
    document.getElementById('chatSidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('open');
  }

  // ── Boot ─────────────────────────────────────────────────────────
  async function boot() {
    document.getElementById('aiGreeting').textContent = getGreeting();

    await Promise.all([fetchCalendarEvents(), fetchGmailEmails()]);

    // Sync memories from Supabase (cross-device)
    const remoteMemories = await _supaFetch('axis_memory');
    if (Array.isArray(remoteMemories) && remoteMemories.length) {
      const local = getMemories();
      const merged = remoteMemories.concat(local.filter(function(rm) {
        return !remoteMemories.some(function(r) { return r.fact === rm.fact; });
      }));
      merged.sort(function(a, b) { return b.timestamp - a.timestamp; });
      lsSet(MEMORY_KEY, merged.slice(0, MEMORY_MAX));
    }

    // Sync sessions from Supabase (cross-device, conflict-free union merge)
    const remoteSessions = await _supaFetch('chat_sessions');
    if (remoteSessions) {
      _sessApplying = true;
      try { mergeSessionState(remoteSessions); } finally { _sessApplying = false; }
    }
    // Live updates from other devices
    subscribeSessions();

    // Ensure the permanent briefing session exists
    ensureBriefingSessionExists();

    // Restore last active session; default to briefing session
    let activeId = localStorage.getItem(ACTIVE_KEY);
    let session  = activeId ? getSessions().find(function(s){ return s.id === activeId; }) : null;
    if (!session) {
      activeId = BRIEFING_SESSION_ID;
      session  = getSessions().find(function(s){ return s.id === BRIEFING_SESSION_ID; });
    }
    activeSessionId = activeId;
    localStorage.setItem(ACTIVE_KEY, activeId);

    if (session && session.messages && session.messages.length) {
      chatHistory = session.messages.map(function(m){
        return { role: m.role, content: m.content, hidden: m.hidden, briefing: m.briefing, ts: m.ts };
      });
      renderThread(session.messages);
    }

    // Daily briefing: only run at/after the user's briefing time — not merely
    // on open. If the app is opened earlier, it's scheduled to fire then.
    const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
    if (getAIPrefs().briefing.enabled && !briefingDoneToday() && nowMin >= getBriefingMinutes()) {
      const silent = activeSessionId !== BRIEFING_SESSION_ID;
      await runTodaysBriefing({ silent: silent });
    }
    scheduleBriefing();
    renderSidebar();

    // Wire UI
    const input   = document.getElementById('chatInput');
    const sendBtn = document.getElementById('chatSend');
    sendBtn.addEventListener('click', function(){ sendMessage(input.value); });
    input.addEventListener('keydown', function(e){
      if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(input.value); }
    });
    document.getElementById('aiHomeBtn').addEventListener('click', function() {
      let url = 'index.html';
      try { url = sessionStorage.getItem('axisReturnUrl') || 'index.html'; } catch (_) {}
      window.location.href = url;
    });
    document.getElementById('sidebarToggle').addEventListener('click', openSidebar);
    document.getElementById('sidebarClose').addEventListener('click',  closeSidebar);

    // Row options popover: item actions, outside-click + scroll dismissal
    document.getElementById('rowMenu').addEventListener('click', function(e){
      const item = e.target.closest('.row-menu-item');
      if (!item) return;
      const id = _rowMenuId;
      closeRowMenu();
      if (!id) return;
      if (item.dataset.act === 'rename')      renameSession(id);
      else if (item.dataset.act === 'delete') deleteSession(id);
    });
    document.addEventListener('click', function(e){
      if (!_rowMenuId) return;
      if (e.target.closest('#rowMenu') || e.target.closest('.sidebar-row-menu-btn')) return;
      closeRowMenu();
    });
    document.getElementById('sidebarList').addEventListener('scroll', closeRowMenu, { passive: true });
    window.addEventListener('resize', closeRowMenu);
    document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);
    document.getElementById('sidebarNewBtn').addEventListener('click', newChat);
    document.getElementById('memoryBtn').addEventListener('click', openMemoryPanel);
    document.getElementById('memoryPanelClose').addEventListener('click', closeMemoryPanel);
    document.getElementById('memoryOverlay').addEventListener('click', closeMemoryPanel);
    document.getElementById('memoryClearBtn').addEventListener('click', function() {
      if (confirm('Clear all memories? This cannot be undone.')) clearAllMemories();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, { once: true });
  } else {
    boot();
  }
})();
</script>
</body>
