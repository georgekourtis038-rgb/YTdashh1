<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f0e">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="axis-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Axis AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="topbar.js" defer></script>
<script src="google-auth.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0f0e;
  --mint: #2de8a2;
  --mint-dim: rgba(45,232,162,0.4);
  --card-bg: rgba(255,255,255,0.04);
  --card-border: rgba(255,255,255,0.08);
  --label: rgba(255,255,255,0.4);
  --subtle: rgba(255,255,255,0.3);
  --font: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'Space Mono', ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

html, body {
  width: 100%;
  min-height: 100%;
  background: var(--bg);
  color: #fff;
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
body {
  padding-bottom: calc(84px + env(safe-area-inset-bottom));
}

/* ── Shell ── */
.ai-shell {
  max-width: 680px;
  margin: 0 auto;
  padding: 0 20px 24px;
}

/* ── Header row ── */
.ai-toprow {
  position: sticky;
  top: 0;
  z-index: 25;
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 -20px 14px;
  padding: calc(env(safe-area-inset-top) + 12px) 20px 14px;
  background: linear-gradient(180deg, var(--bg) 74%, rgba(10,15,14,0));
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
}
.ai-head-text { flex: 1; min-width: 0; }
.ai-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  color: rgba(45,232,162,0.8);
  text-transform: uppercase;
  font-weight: 400;
  margin-bottom: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ai-greeting {
  font-size: 23px;
  font-weight: 600;
  color: #fff;
  letter-spacing: -0.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ── Header avatar orb (Aurora) ── */
.ai-avatar {
  position: relative;
  width: 44px; height: 44px;
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
}
.ai-avatar-glow {
  position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle, rgba(45,232,162,0.3), transparent 68%);
  animation: axBreath 4s ease-in-out infinite;
  pointer-events: none;
}
.ai-avatar-ring {
  position: relative;
  width: 36px; height: 36px; border-radius: 50%;
  background: conic-gradient(from 180deg, #2de8a2, #6f9bff, #2de8a2);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 18px rgba(45,232,162,0.5);
}
.ai-avatar-core {
  width: 29px; height: 29px; border-radius: 50%;
  background: #0a1512;
  display: flex; align-items: center; justify-content: center;
}
.ai-avatar-mark {
  width: 11px; height: 11px; border-radius: 50%;
  border: 2px solid #2de8a2;
  border-right-color: transparent; border-bottom-color: transparent;
  animation: axSpin 3.5s linear infinite;
}

/* ── Header icon buttons ── */
.ai-icon-btn {
  width: 38px; height: 38px;
  border-radius: 10px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  color: var(--label);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, color 0.15s;
  margin-top: 2px;
}
.ai-icon-btn:hover, .ai-icon-btn:active { background: rgba(255,255,255,0.08); color: #fff; }

/* ── Chat thread ── */
.chat-thread {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ── Message bubbles ── */
.msg {
  display: flex;
  max-width: 85%;
  will-change: transform;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  animation: msgIn 0.35s cubic-bezier(0.22,1,0.36,1) both;
}
.msg.msg-static { animation: none; }

@keyframes msgIn {
  from { opacity: 0; transform: translateY(10px) translateZ(0); }
  to   { opacity: 1; transform: translateY(0)    translateZ(0); }
}

.msg-user { align-self: flex-end; flex-direction: row-reverse; }
.msg-ai   { align-self: flex-start; }

.msg-bubble {
  padding: 12px 16px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.55;
}
.msg-user .msg-bubble {
  background: linear-gradient(180deg, #2de8a2, #1ec78a);
  border: none;
  color: #04140d;
  border-bottom-right-radius: 4px;
  font-weight: 500;
}
.msg-ai .msg-bubble {
  background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.022));
  border: 1px solid rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.88);
  border-bottom-left-radius: 4px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.07);
}

/* ── Rich text (markdown) inside bubbles ── */
.msg-text { display: block; }
.msg-text .md-line { min-height: 1px; }
.msg-text .md-line + .md-line { margin-top: 1px; }
.msg-text .md-gap { height: 9px; }
.msg-bubble strong { font-weight: 700; color: #fff; }
.msg-user .msg-bubble strong { color: #04140d; }
.msg-bubble em { font-style: italic; }
.msg-bubble code {
  font-family: var(--font-mono);
  font-size: 0.88em;
  background: rgba(255,255,255,0.08);
  padding: 1px 5px; border-radius: 5px;
}
.msg-user .msg-bubble code { background: rgba(0,0,0,0.12); }
.msg-text .md-ul {
  margin: 5px 0 4px; padding-left: 18px;
  list-style: none;
}
.msg-text .md-ul li { position: relative; margin: 4px 0; }
.msg-text .md-ul li::before {
  content: ''; position: absolute; left: -13px; top: 0.62em;
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--mint);
}
.msg-user .msg-text .md-ul li::before { background: rgba(4,20,13,0.5); }
.msg-text .md-h {
  font-weight: 700; color: #fff; font-size: 1.02em;
  margin-bottom: 3px; letter-spacing: -0.01em;
}

/* ── Briefing message ── */
.msg-briefing-header {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}
.msg-briefing-icon { font-size: 12px; }
.msg-briefing-label {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--mint);
  text-transform: uppercase;
  font-weight: 700;
  opacity: 0.8;
}

/* ── Typing indicator ── */
.msg-typing .msg-bubble { padding: 14px 18px; }
.typing-dots { display: flex; gap: 4px; align-items: center; }
.typing-dots span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--mint-dim);
  animation: dotPulse 1.2s ease-in-out infinite;
  will-change: transform, opacity;
  -webkit-backface-visibility: hidden; backface-visibility: hidden;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotPulse {
  0%, 80%, 100% { opacity: 0.3; transform: scale(0.8) translateZ(0); }
  40%            { opacity: 1;   transform: scale(1)   translateZ(0); }
}

/* ── Date separator ── */
.chat-date-sep {
  display: flex; align-items: center; gap: 10px;
  margin: 8px 0; color: var(--subtle); font-size: 11px;
  letter-spacing: 1px; text-transform: uppercase;
}
.chat-date-sep::before, .chat-date-sep::after {
  content: ''; flex: 1; height: 1px;
  background: var(--card-border);
}

/* ── Chat input bar (liquid glass) ── */
.chat-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 12px 16px max(16px, calc(env(safe-area-inset-bottom) + 8px));
  background: linear-gradient(0deg, rgba(7,11,10,0.94) 38%, rgba(7,11,10,0));
  display: flex; justify-content: center;
  z-index: 30;
  pointer-events: none;
}
.chat-bar-inner {
  pointer-events: auto;
  width: 100%; max-width: 680px;
  display: flex; align-items: center; gap: 8px;
  padding: 7px 7px 7px 8px;
  border-radius: 20px;
  background: rgba(14,20,18,0.82);
  -webkit-backdrop-filter: blur(26px) saturate(170%);
  backdrop-filter: blur(26px) saturate(170%);
  box-shadow:
    0 14px 44px -10px rgba(0,0,0,0.7),
    inset 0 1px 0 rgba(255,255,255,0.09),
    inset 0 0 0 1px rgba(255,255,255,0.07);
}
.chat-input {
  flex: 1;
  background: transparent;
  border: none;
  border-radius: 14px;
  padding: 11px 8px 11px 10px;
  font-size: 16px; /* 16px prevents iOS zoom */
  font-family: var(--font);
  color: #fff;
  outline: none;
  -webkit-appearance: none; appearance: none;
}
.chat-input::placeholder { color: var(--subtle); }
.chat-input:focus { border: none; }
.chat-send-btn {
  width: 44px; height: 44px; border-radius: 14px;
  background: linear-gradient(180deg, #2de8a2, #1ec78a);
  border: none;
  color: #04140d;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  box-shadow: 0 0 18px -2px rgba(45,232,162,0.6);
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s ease, transform 0.1s ease;
}
.chat-send-btn:active { background: rgba(45,232,162,0.22); transform: scale(0.93) translateZ(0); }
.chat-send-btn:disabled { opacity: 0.35; pointer-events: none; }

/* ── Streaming cursor ── */
.streaming::after {
  content: '▋';
  display: inline-block;
  animation: cursorBlink 0.65s step-end infinite;
  color: var(--mint);
  margin-left: 1px;
  vertical-align: baseline;
  will-change: opacity;
}
@keyframes cursorBlink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0; }
}

/* ── Action confirmation cards ── */
.action-card {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 14px 16px;
  background: linear-gradient(180deg, rgba(45,232,162,0.08), rgba(255,255,255,0.022));
  border: 1px solid rgba(45,232,162,0.16);
  border-radius: 18px; border-bottom-left-radius: 4px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 8px 30px -14px rgba(45,232,162,0.35);
  animation: msgIn 0.35s cubic-bezier(0.22,1,0.36,1) both;
  will-change: transform; -webkit-backface-visibility: hidden; backface-visibility: hidden;
  align-self: flex-start; max-width: 85%;
}
.action-card.msg-static { animation: none; }
.action-card-check { color: var(--mint); font-size: 13px; flex-shrink: 0; margin-top: 2px; }
.action-card-text  { font-size: 13px; color: rgba(45,232,162,0.88); line-height: 1.45; }
.action-card.action-confirm {
  flex-direction: column; gap: 12px;
  background: linear-gradient(180deg, rgba(242,192,99,0.08), rgba(255,255,255,0.022));
  border-color: rgba(242,192,99,0.22);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 8px 30px -14px rgba(242,192,99,0.35);
}
.action-confirm .action-card-text { color: rgba(245,222,179,0.92); }
.confirm-btns { display: flex; gap: 8px; align-self: stretch; }
.confirm-btns button {
  flex: 1; padding: 9px 12px; border-radius: 11px; font-size: 13px; font-weight: 600;
  font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.confirm-yes { border: none; background: linear-gradient(180deg,#fff,#e8e5dd); color: #0a0a0b; box-shadow: inset 0 1px 0 rgba(255,255,255,0.55); }
.confirm-no  { border: 1px solid rgba(255,255,255,0.12); background: transparent; color: rgba(255,255,255,0.55); }

/* ── Page entry animations ── */
.ai-toprow { animation: revealUp 0.65s cubic-bezier(0.16,1,0.3,1) 0.05s both; }
@keyframes revealUp {
  from { opacity: 0; transform: translateY(40px) translateZ(0); }
  to   { opacity: 1; transform: translateY(0)    translateZ(0); }
}

/* ────────────────────────────────────────────────────────────────
   SIDEBAR
   ──────────────────────────────────────────────────────────────── */
.sidebar-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 200;
  -webkit-tap-highlight-color: transparent;
}
.sidebar-overlay.open { display: block; }

.chat-sidebar {
  position: fixed; top: 0; left: 0; bottom: 0;
  width: min(300px, 85vw);
  background: radial-gradient(120% 50% at 50% -10%, #102018 0%, #0c1110 50%, #0a0e0d 100%);
  border-right: 1px solid rgba(255,255,255,0.07);
  z-index: 201;
  display: flex; flex-direction: column;
  transform: translateX(-100%) translateZ(0);
  transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
  will-change: transform; -webkit-backface-visibility: hidden; backface-visibility: hidden;
  /* No overflow:hidden on glass-adjacent elements */
}
.chat-sidebar.open { transform: translateX(0) translateZ(0); }

.sidebar-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: max(20px, calc(env(safe-area-inset-top) + 16px)) 16px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  flex-shrink: 0;
}
.sidebar-title {
  font-family: var(--font-mono);
  font-size: 12px; font-weight: 400;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: rgba(45,232,162,0.85);
}
.sidebar-close {
  width: 28px; height: 28px; border-radius: 8px;
  background: transparent; border: none;
  color: var(--subtle); font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: color 0.15s;
}
.sidebar-close:hover { color: #fff; }

.sidebar-list {
  flex: 1 1 auto; min-height: 0; height: 0; overflow-y: auto;
  padding: 10px 12px;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  display: block;            /* block flow → rows keep full height, list scrolls */
}
.sidebar-empty {
  padding: 24px 16px; font-size: 13px; color: var(--subtle); text-align: center;
}
.sidebar-row {
  position: relative;
  display: flex; align-items: stretch; gap: 4px;
  margin-bottom: 6px;
  border-radius: 14px;
  background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.018));
  border: 1px solid rgba(255,255,255,0.07);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
  transition: border-color 0.15s, background 0.15s;
  overflow: hidden;
}
.sidebar-row:last-child { margin-bottom: 0; }
.sidebar-row:active { background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03)); }
.sidebar-row.active {
  background: linear-gradient(180deg, rgba(45,232,162,0.12), rgba(45,232,162,0.035));
  border-color: rgba(45,232,162,0.3);
}
.sidebar-row-main {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; gap: 3px;
  padding: 11px 12px;
  background: transparent; border: none;
  text-align: left; cursor: pointer;
  font-family: var(--font);
  -webkit-tap-highlight-color: transparent;
}
.sidebar-row-date {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 400; letter-spacing: 0.1em;
  text-transform: uppercase; color: rgba(255,255,255,0.42);
}
.sidebar-row-preview {
  font-size: 13px; color: rgba(255,255,255,0.7);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sidebar-row.active .sidebar-row-date    { color: var(--mint); }
.sidebar-row.active .sidebar-row-preview { color: #fff; }

.sidebar-row-actions {
  display: flex; align-items: center;
  padding-right: 5px; flex-shrink: 0;
}
.sidebar-row-menu-btn {
  width: 32px; height: 32px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: none;
  color: rgba(255,255,255,0.42);
  cursor: pointer; flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, color 0.15s;
}
.sidebar-row-menu-btn:active { background: rgba(255,255,255,0.1); }
.sidebar-row.active .sidebar-row-menu-btn { color: rgba(255,255,255,0.72); }

/* ── Row options popover (rename / delete) ── */
.row-menu {
  position: fixed; z-index: 230;
  min-width: 156px;
  padding: 5px;
  background: linear-gradient(180deg, #18211d, #111714);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 13px;
  box-shadow: 0 18px 44px -12px rgba(0,0,0,0.75), inset 0 1px 0 rgba(255,255,255,0.06);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  display: none;
}
.row-menu.open { display: block; animation: menuIn 0.14s ease both; }
@keyframes menuIn {
  from { opacity: 0; transform: translateY(-5px) scale(0.97); }
  to   { opacity: 1; transform: none; }
}
.row-menu-item {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 11px 12px; border-radius: 9px;
  background: transparent; border: none;
  color: rgba(255,255,255,0.9);
  font-family: var(--font); font-size: 14px; font-weight: 500;
  text-align: left; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.12s;
}
.row-menu-item:active { background: rgba(255,255,255,0.08); }
.row-menu-item.delete { color: #ff7a7a; }
.row-menu-item svg { flex-shrink: 0; opacity: 0.9; }

.sidebar-new-btn {
  margin: 10px 12px calc(12px + env(safe-area-inset-bottom));
  padding: 13px; border-radius: 14px;
  background: linear-gradient(180deg, #2de8a2, #1ec78a);
  border: none;
  color: #04140d; font-size: 14px; font-weight: 700;
  font-family: var(--font); cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.1s, box-shadow 0.15s;
  box-shadow: 0 0 22px -8px rgba(45,232,162,0.7), inset 0 1px 1px rgba(255,255,255,0.2);
  flex-shrink: 0;
}
.sidebar-new-btn:active { transform: scale(0.97); }

/* ── Memory panel ── */
.memory-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 200;
  -webkit-tap-highlight-color: transparent;
}
.memory-overlay.open { display: block; }

.memory-panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(320px, 90vw);
  background: radial-gradient(120% 50% at 50% -10%, #102018 0%, #0c1110 50%, #0a0e0d 100%);
  border-left: 1px solid rgba(255,255,255,0.07);
  z-index: 201;
  display: flex; flex-direction: column;
  transform: translateX(100%) translateZ(0);
  transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
  will-change: transform; -webkit-backface-visibility: hidden; backface-visibility: hidden;
}
.memory-panel.open { transform: translateX(0) translateZ(0); }

.memory-panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: max(20px, calc(env(safe-area-inset-top) + 16px)) 16px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  flex-shrink: 0;
}
.memory-panel-title {
  font-family: var(--font-mono);
  font-size: 12px; font-weight: 400;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: rgba(45,232,162,0.85);
}
.memory-panel-close {
  width: 28px; height: 28px; border-radius: 8px;
  background: transparent; border: none;
  color: var(--subtle); font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: color 0.15s;
}
.memory-panel-close:hover { color: #fff; }

.memory-list {
  flex: 1; overflow-y: auto; padding: 12px;
  overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: 8px;
}
.memory-empty {
  padding: 24px 16px; font-size: 13px; color: var(--subtle); text-align: center;
}
.memory-chip {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 12px 13px;
  background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.018));
  border: 1px solid rgba(255,255,255,0.07);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
  border-radius: 14px;
  font-size: 13px;
  color: rgba(255,255,255,0.78);
  line-height: 1.45;
}
.memory-chip-text { flex: 1; }
.memory-chip-del {
  background: transparent; border: none;
  color: var(--subtle); font-size: 14px; line-height: 1;
  cursor: pointer; padding: 0; flex-shrink: 0;
  margin-top: 1px;
  -webkit-tap-highlight-color: transparent;
  transition: color 0.15s;
}
.memory-chip-del:hover { color: rgba(255,80,80,0.8); }

.memory-count-label {
  padding: 12px 14px 6px;
  font-family: var(--font-mono);
  font-size: 11px; color: rgba(255,255,255,0.4);

<script>
(function () {
  'use strict';

  // ── Storage helpers ──────────────────────────────────────────────
  function lsGet(k)    { try { return JSON.parse(localStorage.getItem(k)); } catch (_) { return null; } }
  function lsRaw(k)    { try { return localStorage.getItem(k); }            catch (_) { return null; } }
  function lsSet(k, v) {
    try {
      const s = JSON.stringify(v);
      localStorage.setItem(k, s);
      window.dispatchEvent(new StorageEvent('storage', { key: k, newValue: s, storageArea: localStorage }));
      if (window._pcTriggerSync) window._pcTriggerSync(k);
    } catch (_) {}
  }
  function _genId(prefix) {
    return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }
  // Resolve a tool "when" value to a goals: date key
  function _resolveDayKey(when) {
    if (!when || when === 'today') return activeDate();
    if (when === 'tomorrow') return tomorrowDate();
    if (/^\d{4}-\d{2}-\d{2}$/.test(when)) return when;
    return activeDate();
  }

  // ── Briefing session ID (fixed, never deleted) ───────────────────
  const BRIEFING_SESSION_ID = 'axis_daily_briefing';

  // ── Supabase ─────────────────────────────────────────────────────
  const _SUPA_URL  = 'https://oyylbiscxnymnmetyrho.supabase.co';
  const _SUPA_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95eWxiaXNjeG55bW5tZXR5cmhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMzQ1MDgsImV4cCI6MjA5NTcxMDUwOH0.3xxHcp3Z4vJWHEGFV_iUW_YeJ2gdUPqYiNAQkYnR-qU';
  let _supaClient  = null;

  function _getSupa() {
    if (_supaClient) return _supaClient;
    if (!window.supabase) return null;
    _supaClient = window.supabase.createClient(_SUPA_URL, _SUPA_KEY);
    return _supaClient;
  }

  async function _supaUpsert(key, data) {
    const supa = _getSupa();
    if (!supa) return;
    try {
      await supa.from('app_state').upsert(
        { key, data, updated_at: new Date().toISOString() },
        { onConflict: 'key' }
      );
    } catch (_) {}
  }

  async function _supaFetch(key) {
    const supa = _getSupa();
    if (!supa) return null;
    try {
      const { data, error } = await supa.from('app_state').select('data').eq('key', key).maybeSingle();
      if (error || !data || !data.data) return null;
      return data.data;
    } catch (_) { return null; }
  }

  // ── Date helpers (6 AM day boundary) ────────────────────────────
  function pad(n)      { return String(n).padStart(2, '0'); }
  function fmt(d)      { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayStr()  { return fmt(new Date()); }
  function activeDate(){ const d = new Date(); if (d.getHours() < 6) d.setDate(d.getDate() - 1); return fmt(d); }
  function tomorrowDate(){ const d = new Date(); if (d.getHours() >= 6) d.setDate(d.getDate() + 1); return fmt(d); }
  function calendarToday(){ return fmt(new Date()); }

  // ── Profile ──────────────────────────────────────────────────────
  function getFirstName() {
    const s = lsGet('settings') || {};
    if (s.firstName) return s.firstName;
    const raw = lsRaw('dash_name') || '';
    if (raw) { const sp = raw.indexOf(' '); return sp >= 0 ? raw.slice(0, sp) : raw; }
    return '';
  }
  function getGreeting() {
    const h = new Date().getHours();
    const name = getFirstName();
    const time = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    return name ? time + ', ' + name : time;
  }

  // ── Data collectors ──────────────────────────────────────────────
  function getWaterData() {
    const state  = lsGet('po_water_v1') || {};
    const today  = calendarToday();
    const doneMl = ((state.history || {})[today]) || 0;
    let targetMl = 2500;
    try {
      const lbs = parseFloat(lsGet('dash_weight'));
      if (!isNaN(lbs) && lbs > 0) {
        const kg  = lbs / 2.205;
        const sex = lsRaw('dash_sex') || 'm';
        const adj = (sex === 'female' || sex === 'f') ? 0 : 200;
        targetMl  = Math.max(2000, Math.min(6000, Math.round(((kg * 35) + adj) / 50) * 50));
      }
    } catch (_) {}
    return { doneMl, targetMl };
  }
  function getGoalData(dateKey) { return lsGet('goals:' + dateKey) || []; }
  function getStreak() { const s = lsGet('goal_streak_v1') || {}; return typeof s.count === 'number' ? s.count : 0; }
  function getWeightInfo() {
    const latestLbs = lsGet('dash_weight') != null ? parseFloat(lsGet('dash_weight')) : null;
    let trendStr = null;
    try {
      const log = (lsGet('po_gym_v1') || {}).weightLog;
      if (Array.isArray(log) && log.length > 1) {
        const recent = log.slice(-7);
        const delta  = recent[recent.length - 1].weight - recent[0].weight;
        if (!isNaN(delta)) trendStr = (delta >= 0 ? '+' : '') + delta.toFixed(1) + ' lbs over last ' + recent.length + ' entries';
      }
    } catch (_) {}
    return { latestLbs, trendStr };
  }
  function getLtGoals() {
    let g;
    try { g = JSON.parse(localStorage.getItem('axis_goals') || 'null') || []; } catch(_) { return []; }
    let changed = false;
    g.forEach(function(x){ if (!x.id) { x.id = _genId('g'); changed = true; } });
    if (changed) lsSet('axis_goals', g);
    return g;
  }
  function getGymSplitToday() {
    try {
      const cycle = lsGet('dash_gym_cycle');
      if (cycle && cycle.type === 'cycle' && Array.isArray(cycle.days) && cycle.days.length && cycle.startDate) {
        const today = new Date(); today.setHours(0,0,0,0);
        const start = new Date(cycle.startDate + 'T00:00:00'); start.setHours(0,0,0,0);
        const diff  = Math.max(0, Math.round((today - start) / 86400000));
        return cycle.days[diff % cycle.days.length] || null;
      }
      const split = lsGet('dash_gym_split') || {};
      return split[['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()]] || null;
    } catch (_) { return null; }
  }
  function getGymSessionsPerWeek() {
    try {
      const cycle = lsGet('dash_gym_cycle');
      if (cycle && cycle.type === 'cycle' && Array.isArray(cycle.days) && cycle.days.length) {
        const active = cycle.days.filter(function(d) { return d && !/^(rest|off)$/i.test(d); }).length;
        return Math.round(active / cycle.days.length * 7);
      }
      const split = lsGet('dash_gym_split') || {};
      const count = Object.values(split).filter(function(v) { return v && !/^(rest|off)$/i.test(v); }).length;
      return count || null;
    } catch (_) { return null; }
  }
  function getWorkoutHistory() {
    try {
      const s = lsGet('po_coach_v1');
      if (!s || !Array.isArray(s.exercises) || !s.logs) return [];
      const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 7); cutoff.setHours(0,0,0,0);
      const bySess = {};
      s.exercises.forEach(function(ex) {
        (s.logs[ex.id] || []).forEach(function(l) {
          const key = l.sid ? l.sid.slice(0,10) : (l.date||'').slice(0,10);
          if (!key || new Date(key+'T00:00:00') < cutoff) return;
          if (!bySess[key]) bySess[key] = [];
          bySess[key].push({ ex, log: l });
        });
      });
      return Object.entries(bySess).sort(function(a,b){ return b[0].localeCompare(a[0]); }).map(function(entry) {
        const [dateKey, sets] = entry;
        const byEx = {};
        sets.forEach(function(item) {
          if (!byEx[item.ex.id]) byEx[item.ex.id] = { name: item.ex.name, sets: [] };
          byEx[item.ex.id].sets.push({ reps: item.log.reps, weight: item.log.weight, bw: item.ex.bw });
        });
        const exercises  = Object.values(byEx);
        const totalVol   = exercises.reduce(function(sum, e) {
          return sum + e.sets.reduce(function(s2, set) { return s2 + (set.weight||0)*(set.reps||0); }, 0);
        }, 0);
        return { date: dateKey, exercises, totalVol: Math.round(totalVol), units: s.units || 'kg' };
      });
    } catch (_) { return []; }
  }
  function getNutritionTargets() {
    try {
      const weightLbs = parseFloat(lsRaw('dash_weight'));
      const heightCm  = parseFloat(lsRaw('dash_height'));
      const age       = parseFloat(lsRaw('dash_age'));
      const sex       = (lsRaw('dash_sex') || '').toLowerCase();
      if (isNaN(weightLbs)||weightLbs<=0||isNaN(heightCm)||heightCm<=0||isNaN(age)||age<=0) return null;
      const weightKg  = weightLbs / 2.205;
      const isFemale  = sex==='f'||sex==='female';
      const bmr       = Math.round((10*weightKg)+(6.25*heightCm)-(5*age)+(isFemale?-161:5));
      const sessions  = getGymSessionsPerWeek() || 0;
      let multiplier, activityLabel;
      if (sessions>=5)      { multiplier=1.725; activityLabel='active'; }
      else if (sessions>=3) { multiplier=1.55;  activityLabel='moderate'; }
      else if (sessions>=1) { multiplier=1.375; activityLabel='light'; }
      else                  { multiplier=1.2;   activityLabel='sedentary'; }
      const tdee  = Math.round(bmr * multiplier);
      let recommendedCals = tdee, deficitNote = null;
      const goals = getLtGoals();
      const weightGoal = goals.find(function(g){ return g.category==='weight'&&g.targetValue!=null&&g.deadline; });
      if (weightGoal) {
        const targetLbs = (weightGoal.unit==='kg') ? parseFloat(weightGoal.targetValue)*2.205 : parseFloat(weightGoal.targetValue);
        const lbsToLose = weightLbs - targetLbs;
        if (lbsToLose > 0.5) {
          const today = new Date(); today.setHours(0,0,0,0);
          const daysLeft = Math.round((new Date(weightGoal.deadline+'T00:00:00') - today) / 86400000);
          if (daysLeft > 0) {
            const dailyDeficit = Math.min(1000, Math.round((lbsToLose*3500)/daysLeft));
            recommendedCals = tdee - dailyDeficit;
            deficitNote = dailyDeficit + ' kcal/day deficit · lose ' + lbsToLose.toFixed(1) + ' lbs by ' + weightGoal.deadline + ' (' + daysLeft + ' days remaining)';
          }
        }
      }
      return { bmr, tdee, activityLabel, recommendedCals, deficitNote,
               proteinMin: Math.round(weightLbs*0.8), proteinMax: Math.round(weightLbs*1.0) };
    } catch (_) { return null; }
  }

  // ── Gmail inbox context ──────────────────────────────────────────
  let _cachedGmailEmails = []; // [{ id, sender, subject, snippet }]

  function loadGmailFromCache() {
    try {
      const cache = JSON.parse(localStorage.getItem('axis_gmail_cache') || 'null');
      if (Array.isArray(cache) && cache.length) { _cachedGmailEmails = cache.slice(0,5); return true; }
    } catch (_) {}
    return false;
  }

  async function fetchGmailEmails() {
    if (loadGmailFromCache()) return;
    const tok = await GoogleAuth.getToken();
    if (!tok) return;
    try {
      const listRes = await fetch('https://www.googleapis.com/gmail/v1/users/me/messages?q=in:inbox+is:unread&maxResults=5',
        { headers: { 'Authorization': 'Bearer ' + tok } });
      if (!listRes.ok) return;
      const msgs = (await listRes.json()).messages || [];
      const details = await Promise.all(msgs.map(function(m) {
        return fetch('https://www.googleapis.com/gmail/v1/users/me/messages/'+m.id+'?format=metadata&metadataHeaders=From,Subject',
          { headers: { 'Authorization': 'Bearer ' + tok } }
        ).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
      }));
      _cachedGmailEmails = details.filter(Boolean).map(function(msg) {
        const hdrs    = (msg.payload && msg.payload.headers) || [];
        const from    = (hdrs.find(function(h){ return h.name==='From'; }) || {}).value || '';
        const subject = (hdrs.find(function(h){ return h.name==='Subject'; }) || {}).value || '(No subject)';
        const m2      = from.match(/^(.+?)\s*<[^>]+>$/);
        const sender  = m2 ? m2[1].replace(/^"|"$/g,'').trim() : from.split('@')[0];
        return { id: msg.id, sender, subject, snippet: (msg.snippet||'').slice(0,120) };
      });
    } catch (_) {}
  }

  // ── Google Calendar context ───────────────────────────────────────
  let _calendarEvents = { today: [], tomorrow: [] };

  async function fetchCalendarEvents() {
    const tok = await GoogleAuth.getToken();
    if (!tok) return;
    try {
      const tz       = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const now      = new Date();
      const todayStart = new Date(now); todayStart.setHours(0,0,0,0);
      const todayEnd   = new Date(now); todayEnd.setHours(23,59,59,999);
      const tomStart   = new Date(todayStart); tomStart.setDate(tomStart.getDate()+1);
      const tomEnd     = new Date(todayEnd);   tomEnd.setDate(tomEnd.getDate()+1);

      async function fetchWindow(tMin, tMax) {
        const url = 'https://www.googleapis.com/calendar/v3/calendars/primary/events'
          + '?singleEvents=true&orderBy=startTime'
          + '&timeMin=' + encodeURIComponent(tMin.toISOString())
          + '&timeMax=' + encodeURIComponent(tMax.toISOString())
          + '&maxResults=10&timeZone=' + encodeURIComponent(tz);
        const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + tok } });
        if (!res.ok) return [];
        return ((await res.json()).items || []).map(function(ev) {
          let timeLabel = 'All day', duration = '';
          if (ev.start && ev.start.dateTime) {
            const d = new Date(ev.start.dateTime);
            timeLabel = d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', hour12:true });
          }
          if (ev.start && ev.start.dateTime && ev.end && ev.end.dateTime) {
            const mins = Math.round((new Date(ev.end.dateTime) - new Date(ev.start.dateTime)) / 60000);
            duration   = mins >= 60 ? (mins/60).toFixed(mins%60===0?0:1)+'h' : mins+'min';
          }
          return { time: timeLabel, title: ev.summary || '(No title)', duration };
        });
      }
      const [todayEvts, tomEvts] = await Promise.all([fetchWindow(todayStart, todayEnd), fetchWindow(tomStart, tomEnd)]);
      _calendarEvents = { today: todayEvts, tomorrow: tomEvts };
    } catch (_) {}
  }

  // ── System prompt ────────────────────────────────────────────────
  // ── Axis AI preferences (configured in settings.html) ───────────
  // Defaults preserve the original behaviour when nothing is saved.
  const AI_PREFS_KEY = 'axis_ai_prefs';
  function getAIPrefs() {
    const raw = lsGet(AI_PREFS_KEY) || {};
    const b = raw.briefing || {}, c = raw.context || {}, t = raw.tools || {};
    return {
      tone:           raw.tone || 'jarvis',                 // jarvis | butler | coach | friend
      nickname:       typeof raw.nickname === 'string' ? raw.nickname : '',
      responseLength: raw.responseLength || 'balanced',     // concise | balanced | detailed
      emoji:          raw.emoji === true,
      autoName:       raw.autoName !== false,
      memory:         raw.memory !== false,
      briefing: {
        enabled:  b.enabled  !== false,
        time:     typeof b.time === 'string' ? b.time : '',
        goals:    b.goals    !== false,
        calendar: b.calendar !== false,
        emails:   b.emails   !== false,
        health:   b.health   !== false
      },
      context: {
        calendar: c.calendar !== false,
        email:    c.email    !== false,
        health:   c.health   !== false,
        fitness:  c.fitness  !== false
      },
      tools: {

  // ── Memory store ────────────────────────────────────────────────
  const MEMORY_KEY     = 'axis_memory';
  const MEMORY_MAX     = 100;

  function getMemories() { return lsGet(MEMORY_KEY) || []; }

  function saveMemories(arr) {
    lsSet(MEMORY_KEY, arr);
    _supaUpsert('axis_memory', arr);
  }

  function addMemories(facts, sourceChatId) {
    if (!facts || !facts.length) return;
    console.log('[memory] addMemories called with', facts.length, 'fact(s), current store size:', getMemories().length);
    let memories = getMemories();
    const now = Date.now();
    for (const raw of facts) {
      const fact = (raw || '').trim();
      if (!fact) continue;
      const factLower = fact.toLowerCase();
      const dupIdx = memories.findIndex(function(m) {
        const mLower = m.fact.toLowerCase();
        return mLower.includes(factLower) || factLower.includes(mLower);
      });
      if (dupIdx >= 0) {
        memories[dupIdx] = { fact, timestamp: now, source_chat_id: sourceChatId };
      } else {
        memories.push({ fact, timestamp: now, source_chat_id: sourceChatId });
      }
    }
    // Cap at MEMORY_MAX — remove oldest by timestamp
    if (memories.length > MEMORY_MAX) {
      memories.sort(function(a, b) { return b.timestamp - a.timestamp; });
      memories = memories.slice(0, MEMORY_MAX);
    }
    saveMemories(memories);
    console.log('[memory] saved', memories.length, 'total memories to localStorage. Verify: localStorage.getItem("axis_memory")');
    renderMemoryPanel();
  }

  function deleteMemory(idx) {
    const memories = getMemories();
    memories.splice(idx, 1);
    saveMemories(memories);
    renderMemoryPanel();
  }

  function clearAllMemories() {
    saveMemories([]);
    renderMemoryPanel();
  }

  // ── Memory extraction (background, after each AI turn) ──────────
  async function extractMemories(userText, aiText, sessionId) {
    if (!getAIPrefs().memory) return; // memory disabled in Settings → Axis AI
    const prompt = 'Extract any important personal facts worth remembering long-term from this single conversation exchange. Return ONLY a JSON array of short strings (max 15 words each). Examples: "User prefers morning workouts", "User runs Kourtis Construction with his brother", "User is cutting weight for summer". Return [] if nothing is worth remembering.\n\nUser: ' + userText.slice(0, 400) + '\nAssistant: ' + aiText.slice(0, 600);
    console.log('[memory] extraction started — user:', userText.slice(0, 60), '…');
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system: 'You are a memory extraction assistant. You extract concise, durable personal facts from chat turns. Respond only with a JSON array of strings.',
          messages: [{ role: 'user', content: prompt }],
          max_tokens: 256
        })
      });
      if (!res.ok) {
        let detail = 'HTTP ' + res.status;
        try { const j = await res.json(); detail += ' — ' + (j.error || JSON.stringify(j)); } catch(_) {}
        console.error('[memory] extraction API error:', detail);
        return;
      }
      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '', full = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n'); buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const raw = line.slice(6).trim(); if (!raw) continue;
          try {
            const evt = JSON.parse(raw);
            if (evt.type === 'content_block_delta' && evt.delta && evt.delta.type === 'text_delta') full += evt.delta.text;
          } catch (_) {}
        }
      }
      console.log('[memory] raw extraction response:', full.trim().slice(0, 300));
      const match = full.match(/\[[\s\S]*\]/);
      if (!match) {
        console.warn('[memory] no JSON array found in extraction response');
        return;
      }
      let facts;
      try { facts = JSON.parse(match[0]); } catch(e) {
        console.error('[memory] JSON parse failed:', e.message, '— raw match:', match[0].slice(0, 100));
        return;
      }
      if (!Array.isArray(facts) || !facts.length) {
        console.log('[memory] nothing worth remembering in this turn');
        return;
      }
      console.log('[memory] extracted', facts.length, 'fact(s):', facts);
      addMemories(facts, sessionId);
    } catch (err) {
      console.error('[memory] extraction threw:', err && err.message ? err.message : String(err));
    }
  }

  // ── Memory panel UI ──────────────────────────────────────────────
  function renderMemoryPanel() {
    const memories   = getMemories();
    const list       = document.getElementById('memoryList');
    const countLabel = document.getElementById('memoryCountLabel');
    const clearBtn   = document.getElementById('memoryClearBtn');
    if (!list) return;

    countLabel.textContent = memories.length + ' / ' + MEMORY_MAX + ' memories stored';
    clearBtn.disabled = memories.length === 0;
    list.innerHTML = '';

    if (!memories.length) {
      list.innerHTML = '<p class="memory-empty">No memories yet. Axis will remember important things you share across conversations.</p>';
      return;
    }

    // Show newest first
    const sorted = memories.slice().sort(function(a, b) { return b.timestamp - a.timestamp; });
    sorted.forEach(function(m, i) {
      const realIdx = memories.indexOf(m);
      const chip = document.createElement('div');
      chip.className = 'memory-chip';
      const txt = document.createElement('span');
      txt.className   = 'memory-chip-text';
      txt.textContent = m.fact;
      const del = document.createElement('button');
      del.className   = 'memory-chip-del';
      del.textContent = '×';
      del.setAttribute('aria-label', 'Delete memory');
      del.addEventListener('click', function() { deleteMemory(realIdx); });
      chip.appendChild(txt);
      chip.appendChild(del);
      list.appendChild(chip);
    });
  }

    document.getElementById('memoryOverlay').classList.add('open');

  }
  function closeMemoryPanel() {
    document.getElementById('memoryPanel').classList.remove('open');
    document.getElementById('memoryOverlay').classList.remove('open');
    document.getElementById('memoryBtn').classList.remove('memory-active');
  }

  // ── SSE streaming helper ─────────────────────────────────────────
  async function streamClaude(messages, onChunk) {
    // Strip internal flags; include hidden messages (they carry briefing context)
    const apiMessages = messages
      .filter(function(m){ return m.role === 'user' || m.role === 'assistant'; })
      .map(function(m){ return { role: m.role, content: m.content || '' }; })
      .filter(function(m){ return m.content; });

    if (!apiMessages.length || apiMessages[0].role !== 'user') {
      throw new Error('Conversation must begin with a user turn');
    }

    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system: buildSystemPrompt(), messages: apiMessages })
    });
    if (!res.ok) {
      let errDetail = 'HTTP ' + res.status;
      try { const j = await res.json(); errDetail += ': ' + (j.error || j.error_message || JSON.stringify(j)); } catch(_) {}
      throw new Error(errDetail);
    }
    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '', full = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim(); if (!raw) continue;
        try {
          const evt = JSON.parse(raw);
          if (evt.type === 'content_block_delta' && evt.delta && evt.delta.type === 'text_delta') {
            full += evt.delta.text; onChunk(full);
          }
        } catch (_) {}
      }
    }
    return full;
  }

  // Minimal one-shot completion (no streaming UI) — used to name conversations.
  async function callClaude(system, messages) {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system: system, messages: messages })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '', full = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim(); if (!raw) continue;
        try {
          const evt = JSON.parse(raw);
          if (evt.type === 'content_block_delta' && evt.delta && evt.delta.type === 'text_delta') full += evt.delta.text;
        } catch (_) {}
      }
    }
    return full;
  }

  // ── Session management ───────────────────────────────────────────
  const SESSIONS_KEY = 'axis_chat_sessions';
  const ACTIVE_KEY   = 'axis_active_chat_id';

  let chatHistory      = []; // [{ role, content, hidden?, briefing? }] — sent to API (hidden included for context)
  let activeSessionId  = null;
  let _briefingRunning  = false;
  let _briefingTimer    = null;
  let _briefingInterval = null;

  function getSessions()       { return lsGet(SESSIONS_KEY) || []; }
  function saveSessions(arr)   { try { localStorage.setItem(SESSIONS_KEY, JSON.stringify(arr)); } catch(_) {} }

  // ── Cross-device chat sync (Supabase realtime, conflict-free) ────
  // Payload shape: { sessions:[...], deleted:{ id: ts } }. Sessions carry an
  // updatedAt so the newest edit wins on merge; deleted[] are tombstones so a
  // delete on one device sticks on the other instead of resurrecting.
  const DELETED_KEY = 'axis_chat_deleted';
  const SESSIONS_MAX = 200;
  let _sessPushTimer = null, _sessLastJson = null, _sessApplying = false;

  function getDeleted()      { return lsGet(DELETED_KEY) || {}; }
  function saveDeleted(obj)  { try { localStorage.setItem(DELETED_KEY, JSON.stringify(obj)); } catch(_) {} }
  function touch(session)    { if (session) session.updatedAt = Date.now(); return session; }

  async function pushSessionsNow() {
    const payload = { sessions: getSessions(), deleted: getDeleted() };
    const json = JSON.stringify(payload);
    if (json === _sessLastJson) return;
    _sessLastJson = json;
    await _supaUpsert('chat_sessions', payload);
  }
  function pushSessions() {
    if (_sessApplying) return;            // don't echo a merge we just applied
    clearTimeout(_sessPushTimer);
    _sessPushTimer = setTimeout(pushSessionsNow, 500);
  }

  function _mergeBriefing(a, b) {
    const dates = Array.from(new Set([].concat(a.briefingDates || [], b.briefingDates || [])));
    const seen = {}, messages = [];
    [].concat(a.messages || [], b.messages || []).forEach(function(m){
      const k = (m.ts || 0) + '|' + (m.role || '') + '|' + String(m.content || '').slice(0, 60);
      if (!seen[k]) { seen[k] = 1; messages.push(m); }
    });
    messages.sort(function(x, y){ return (x.ts || 0) - (y.ts || 0); });
    const newer = (b.updatedAt || 0) >= (a.updatedAt || 0) ? b : a;
    return Object.assign({}, a, b, {
      briefingDates: dates, messages: messages, preview: newer.preview,
      updatedAt: Math.max(a.updatedAt || 0, b.updatedAt || 0)
    });
  }

  // Merge a remote payload (array legacy or {sessions,deleted}) into local state.
  function mergeSessionState(remote) {
    const rSessions = Array.isArray(remote) ? remote : ((remote && remote.sessions) || []);
    const rDeleted  = (remote && remote.deleted) || {};
    const lSessions = getSessions();
    const lDeleted  = getDeleted();

    const deleted = Object.assign({}, lDeleted);
    Object.keys(rDeleted).forEach(function(id){ deleted[id] = Math.max(deleted[id] || 0, rDeleted[id] || 0); });

    const byId = {};
    function consider(s) {
      if (!s || !s.id) return;
      const ex = byId[s.id];
      if (!ex) { byId[s.id] = s; return; }
      if (s.id === BRIEFING_SESSION_ID) { byId[s.id] = _mergeBriefing(ex, s); return; }
      const exU = ex.updatedAt || 0, sU = s.updatedAt || 0;
      if (sU > exU) byId[s.id] = s;
      else if (sU === exU && (s.messages || []).length > (ex.messages || []).length) byId[s.id] = s;
    }
    lSessions.forEach(consider);
    rSessions.forEach(consider);

    // Apply tombstones (the briefing session is permanent and never tombstoned)
    let merged = Object.keys(byId).map(function(k){ return byId[k]; }).filter(function(s){
      if (s.id === BRIEFING_SESSION_ID) return true;
      const t = deleted[s.id];
      return !(t && t >= (s.updatedAt || 0));
    });

    // Cap regular history (tombstone the oldest overflow so it doesn't resurrect)
    const reg = merged.filter(function(s){ return s.id !== BRIEFING_SESSION_ID; })
      .sort(function(a, b){ return String(b.createdAt || '').localeCompare(String(a.createdAt || '')); });
    if (reg.length > SESSIONS_MAX) {
      const keep = {};
      reg.slice(0, SESSIONS_MAX).forEach(function(s){ keep[s.id] = 1; });
      reg.slice(SESSIONS_MAX).forEach(function(s){ deleted[s.id] = Date.now(); });
      merged = merged.filter(function(s){ return s.id === BRIEFING_SESSION_ID || keep[s.id]; });
    }

    // Drop tombstones nobody references anymore (keep the map small)
    const live = {}; merged.forEach(function(s){ live[s.id] = 1; });
    Object.keys(deleted).forEach(function(id){
      const inAny = live[id] || rSessions.some(function(s){ return s.id === id; }) || lSessions.some(function(s){ return s.id === id; });
      if (!inAny) delete deleted[id];
    });

    merged.sort(function(a, b){ return String(b.createdAt || '').localeCompare(String(a.createdAt || '')); });
    saveDeleted(deleted);
    saveSessions(merged);
    return merged;
  }

  // Apply a remote update live and refresh the UI without disrupting the
  // open conversation (unless it was deleted elsewhere).
  function applyRemoteSessions(remote) {
    if (!remote) return;
    _sessApplying = true;
    try { mergeSessionState(remote); ensureBriefingSessionExists(); }
    finally { _sessApplying = false; }
    const stillActive = getSessions().find(function(s){ return s.id === activeSessionId; });
    if (!stillActive) {
      activeSessionId = BRIEFING_SESSION_ID;
      try { localStorage.setItem(ACTIVE_KEY, BRIEFING_SESSION_ID); } catch(_) {}
      const bs = getSessions().find(function(s){ return s.id === BRIEFING_SESSION_ID; });
      const msgs = (bs && bs.messages) || [];
      chatHistory = msgs.map(function(m){ return { role:m.role, content:m.content, hidden:m.hidden, briefing:m.briefing, ts:m.ts }; });
      renderThread(msgs);
    }
    renderSidebar();
  }

  function subscribeSessions() {
    const supa = _getSupa();
    if (!supa) return;
    try {
      supa.channel('app_state_chat_sessions')
        .on('postgres_changes',
          { event: '*', schema: 'public', table: 'app_state', filter: 'key=eq.chat_sessions' },
          function(payload) {
            if (!payload.new || !payload.new.data) return;
            if (JSON.stringify(payload.new.data) === _sessLastJson) return; // our own echo
            applyRemoteSessions(payload.new.data);
          })
        .subscribe();
    } catch (_) {}
  }
  function genSessionId()      { return 'chat_' + Date.now(); }

  function getPreview(messages) {
    for (let i = 0; i < messages.length; i++) {
      const m = messages[i];
      if (m.content && m.content.trim() && !m.hidden) {
        const txt = stripMd(m.content);
        if (!txt) continue;
        return txt.slice(0, 72) + (txt.length > 72 ? '…' : '');
      }
    }
    return 'New conversation';
  }

  function upsertSession(session) {
    touch(session);
    const sessions = getSessions();
    const idx = sessions.findIndex(function(s){ return s.id === session.id; });
    if (idx >= 0) sessions[idx] = session;
    else sessions.unshift(session);
    // Never trim the briefing session
    while (sessions.length > SESSIONS_MAX && sessions[sessions.length - 1].id !== BRIEFING_SESSION_ID) sessions.pop();
    saveSessions(sessions);
    pushSessions();
  }

  function saveCurrentSession() {
    if (!activeSessionId) return;
    const sessions = getSessions();
    const session  = sessions.find(function(s){ return s.id === activeSessionId; });
    if (!session || !chatHistory.length) return;
    session.messages = chatHistory.map(function(m){ return Object.assign({}, m, { ts: m.ts || Date.now() }); });
    if (!session.isBriefing) session.preview = getPreview(session.messages);
    touch(session);
    saveSessions(sessions);
    pushSessions();
  }

  // Auto-name a fresh conversation from its first user message (AI-generated).
  // Runs once, in the background; never overrides a manual rename or a title
  // that already exists (e.g. branched briefings).
  async function autoNameSession(sessionId, firstUserText) {
    if (!sessionId || sessionId === BRIEFING_SESSION_ID) return;
    if (!getAIPrefs().autoName) return; // auto-naming disabled in Settings → Axis AI
    const pre = getSessions().find(function(s){ return s.id === sessionId; });
    if (!pre || pre.autoTitled || pre.title) return;
    try {
      const system = 'You write an extremely short title for a chat, based on the user\'s first message. '
        + 'Rules: 2 to 4 words, Title Case, max 28 characters, no quotes, no trailing punctuation, no emoji. '
        + 'Reply with ONLY the title.';
      const raw = await callClaude(system, [{ role: 'user', content: String(firstUserText || '').slice(0, 800) }]);
      let title = stripMd(raw).replace(/^["'\s]+|["'\s.]+$/g, '').replace(/\s+/g, ' ').trim().slice(0, 32);
      if (!title) return;
      const sessions = getSessions();
      const s = sessions.find(function(x){ return x.id === sessionId; });
      if (!s || s.id === BRIEFING_SESSION_ID || s.autoTitled || s.title) return;
      s.title = title;
      s.autoTitled = true;
      touch(s);
      saveSessions(sessions);
      pushSessions();
      renderSidebar();
    } catch (_) { /* leave the first-message preview as the label */ }
  }

  function ensureBriefingSessionExists() {
    const sessions = getSessions();
    if (sessions.find(function(s){ return s.id === BRIEFING_SESSION_ID; })) return;
    sessions.unshift({
      id: BRIEFING_SESSION_ID,
      isBriefing: true,
      createdAt: new Date(0).toISOString(),
      briefingDates: [],
      messages: [],
      preview: 'Daily Briefing'
    });
    saveSessions(sessions);
  }

  // ── DOM helpers ──────────────────────────────────────────────────
  function scrollToBottom() { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }

  function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // Strip action tags + markdown markers for plain previews
  function stripMd(s) {
    return String(s || '')
      .replace(/<action>[\s\S]*?<\/action>/g, '')
      .replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/[*_`#>]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // Inline markdown on already-escaped text: **bold**, *italic*, `code`
  function mdInline(s) {
    return s
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }

  // Render a bubble's text with light markdown (bold, italic, code, bullets,
  // bold-line headers, paragraph spacing). Input is raw model text.
  function renderRich(el, text) {
    const esc   = escHtml(text || '');
    const lines = esc.split('\n');
    let html = '', inList = false;
    for (let i = 0; i < lines.length; i++) {
      const line   = lines[i];
      const bullet = line.match(/^\s*(?:[-•]|\d+\.)\s+(.*)$/);
      if (bullet) {
        if (!inList) { html += '<ul class="md-ul">'; inList = true; }
        html += '<li>' + mdInline(bullet[1]) + '</li>';
        continue;
      }
      if (inList) { html += '</ul>'; inList = false; }
      if (line.trim() === '') { html += '<div class="md-gap"></div>'; continue; }
      // A line that is entirely bold reads as a small header
      const headerMatch = line.match(/^\s*\*\*([^*]+)\*\*\s*:?\s*$/);
      if (headerMatch) { html += '<div class="md-h">' + mdInline(headerMatch[1]) + '</div>'; continue; }
      html += '<div class="md-line">' + mdInline(line) + '</div>';
    }
    if (inList) html += '</ul>';
    el.innerHTML = html;
  }

  function buildMsgEl(role, content, opts) {
    opts = opts || {};
    // Normalize: stored messages use 'assistant'; live flow uses 'ai'.
    const norm   = (role === 'user') ? 'user' : 'ai';
    const wrap   = document.createElement('div');
    const bubble = document.createElement('div');
    wrap.className   = 'msg msg-' + norm + (opts.isStatic ? ' msg-static' : '');
    bubble.className = 'msg-bubble';
    if (opts.isBriefing) {
      const header = document.createElement('div');
      header.className = 'msg-briefing-header';
      header.innerHTML = '<span class="msg-briefing-icon">⚡</span><span class="msg-briefing-label">Daily Briefing</span>';
      bubble.appendChild(header);
    }
    const textNode = document.createElement('span');
    textNode.className = 'msg-text';
    if (norm === 'ai') {
      // Strip any tool-call tags and render light markdown.
      renderRich(textNode, parseActions(content || '').clean);
    } else {
      textNode.textContent = content;
    }
    bubble.appendChild(textNode);
    if (opts.isBriefing && typeof opts.onBranch === 'function') {
      addBranchButton(bubble, opts.onBranch);
    }
    wrap.appendChild(bubble);
    return { wrap, bubble, textNode };
  }

  // "Discuss in new chat" — appended to briefing messages in the briefing thread.
  function addBranchButton(bubble, onClick) {
    const btn = document.createElement('button');
    btn.className = 'briefing-branch-btn';
    btn.type = 'button';
    btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6 3v8a4 4 0 0 0 4 4h8M14 11l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>Discuss in new chat';
    btn.addEventListener('click', function(e){ e.stopPropagation(); onClick(); });
    bubble.appendChild(btn);
    return btn;
  }

  // Spin off a fresh conversation seeded with a briefing, so the permanent
  // briefing thread stays clean. The briefing is stored as a hidden user msg
  // (for API context — Anthropic requires a leading user turn) plus the
  // visible assistant briefing bubble.
  function branchOffBriefing(text) {
    saveCurrentSession();
    const id = genSessionId();
    activeSessionId = id;
    try { localStorage.setItem(ACTIVE_KEY, id); } catch (_) {}
    const ts = Date.now();
    const hiddenUser   = { role: 'user', content: 'For reference, here is the daily briefing I want to discuss:\n\n' + text, hidden: true, ts: ts };
    const assistantMsg = { role: 'assistant', content: text, briefing: true, ts: ts + 1 };
    chatHistory = [hiddenUser, assistantMsg];
    const firstLine = stripMd((text || '').split('\n')[0] || '').slice(0, 36);
    upsertSession({
      id: id,
      createdAt: new Date().toISOString(),
      messages: chatHistory.slice(),
      title: firstLine ? ('Briefing — ' + firstLine) : 'Briefing follow-up',
      preview: stripMd(text).slice(0, 60)
    });
    renderThread(chatHistory);
    closeSidebar();
    renderSidebar();
    const input = document.getElementById('chatInput');
    if (input) { input.focus(); }
  }

  function appendMsg(role, content, opts) {
    const { wrap } = buildMsgEl(role, content, opts);
    document.getElementById('chatThread').appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  function appendTyping() {
    const thread = document.getElementById('chatThread');
    const wrap   = document.createElement('div');
    wrap.className = 'msg msg-ai msg-typing msg-static';
    wrap.innerHTML = '<div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
    thread.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  function appendDateSep(dateStr) {
    const sep = document.createElement('div');
    sep.className   = 'chat-date-sep';
    sep.textContent = dateStr;
    document.getElementById('chatThread').appendChild(sep);
  }

  function appendActionCard(message) {
    const card = document.createElement('div');
    card.className = 'action-card';
    card.innerHTML = '<span class="action-card-check">✓</span><span class="action-card-text"></span>';
    card.querySelector('.action-card-text').textContent = message;
    document.getElementById('chatThread').appendChild(card);
    scrollToBottom();
  }

  // Render an interactive confirm/cancel card for a destructive action.
  // onDone(resultString) is called after the action runs so the caller can
  // persist the outcome with the message.
  function appendConfirmCard(action, onDone) {
    const _lbl  = CONFIRM_TOOLS[action.tool];
    const label = (typeof _lbl === 'function') ? _lbl(action.params || {}) : (_lbl || 'Confirm this action?');
    const card  = document.createElement('div');
    card.className = 'action-card action-confirm';
    card.innerHTML = '<span class="action-card-text"></span>'
      + '<div class="confirm-btns"><button class="confirm-yes" type="button">Confirm</button>'
      + '<button class="confirm-no" type="button">Cancel</button></div>';
    card.querySelector('.action-card-text').textContent = label;
    document.getElementById('chatThread').appendChild(card);
    scrollToBottom();

    const btns = card.querySelector('.confirm-btns');
    card.querySelector('.confirm-yes').addEventListener('click', async function() {
      btns.remove();
      const r = await executeAction(action.tool, action.params);
      card.classList.remove('action-confirm');
      card.innerHTML = '<span class="action-card-check">✓</span><span class="action-card-text"></span>';
      card.querySelector('.action-card-text').textContent = r;
      scrollToBottom();
      if (typeof onDone === 'function') onDone(r);
    });
    card.querySelector('.confirm-no').addEventListener('click', function() {
      btns.remove();
      card.classList.remove('action-confirm');
      card.querySelector('.action-card-text').textContent = 'Cancelled.';
      if (typeof onDone === 'function') onDone('Cancelled.');
    });
  }

  function renderThread(messages) {
    const thread = document.getElementById('chatThread');
    thread.innerHTML = '';
    if (!messages || !messages.length) return;
    const frag = document.createDocumentFragment();
    const allowBranch = (activeSessionId === BRIEFING_SESSION_ID);
    let lastDate = '';
    messages.forEach(function(m) {
      if (m.hidden) return;
      const dateKey = m.ts ? fmt(new Date(m.ts)) : '';
      if (dateKey && dateKey !== lastDate) {
        const sep = document.createElement('div');
        sep.className   = 'chat-date-sep';
        sep.textContent = new Date(dateKey + 'T12:00:00').toLocaleDateString('en-US', { weekday:'long', month:'short', day:'numeric' });
        frag.appendChild(sep);
        lastDate = dateKey;
      }
      const onBranch = (m.briefing && allowBranch)
        ? (function(txt){ return function(){ branchOffBriefing(txt); }; })(m.content)
        : null;
      const { wrap } = buildMsgEl(m.role, m.content, { isStatic: true, isBriefing: m.briefing, onBranch: onBranch });
      frag.appendChild(wrap);
      // Re-render any tool-action confirmation cards that were stored with this message
      if (m.role !== 'user' && Array.isArray(m.actions)) {
        m.actions.forEach(function(r) {
          const card = document.createElement('div');
          card.className = 'action-card msg-static';
          card.innerHTML = '<span class="action-card-check">✓</span><span class="action-card-text"></span>';
          card.querySelector('.action-card-text').textContent = r;
          frag.appendChild(card);
        });
      }
    });
    thread.appendChild(frag);
    scrollToBottom();
  }

  // ── Action executors ─────────────────────────────────────────────
  async function addCalendarEvent(params) {
    const tok = await GoogleAuth.getToken();
    if (!tok) return 'Calendar not connected — sign in via the email page first.';
    try {
      const tz    = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const start = params.time ? new Date(params.date+'T'+params.time+':00') : null;
      const end   = start ? new Date(start.getTime()+(params.duration_minutes||60)*60000) : null;
      const body  = {
        summary: params.title,
        start: start ? { dateTime: start.toISOString(), timeZone: tz } : { date: params.date },
        end:   end   ? { dateTime: end.toISOString(),   timeZone: tz } : { date: params.date }
      };
      const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events',
        { method:'POST', headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'}, body: JSON.stringify(body) });
      if (!res.ok) return 'Calendar error ' + res.status;
      return '"' + params.title + '" added to calendar on ' + params.date;
    } catch(e) { return 'Calendar error: ' + e.message; }
  }

  const _CAL_BASE = 'https://www.googleapis.com/calendar/v3/calendars/primary/events';

  async function deleteCalendarEvent(params) {
    const tok = await GoogleAuth.getToken();
    if (!tok) return 'Calendar not connected — sign in via the email page first.';
    if (!params || !params.id) return 'Need the event id (from get_calendar) to delete it.';
    try {
      const res = await fetch(_CAL_BASE + '/' + encodeURIComponent(params.id),
        { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + tok } });
      // 204 = deleted, 410 = already gone
      if (res.status === 204 || res.status === 410) return 'Calendar event deleted.';
      return 'Calendar error ' + res.status;
    } catch (e) { return 'Calendar error: ' + e.message; }
  }

  async function moveCalendarEvent(params) {
    const tok = await GoogleAuth.getToken();
    if (!tok) return 'Calendar not connected — sign in via the email page first.';
    if (!params || !params.id) return 'Need the event id (from get_calendar) to move it.';
    if (!params.date && !params.time && params.duration_minutes == null && !params.title) {
      return 'Nothing to change — give a new date, time, duration, or title.';
    }
    try {
      const tz  = Intl.DateTimeFormat().resolvedOptions().timeZone;
      // Fetch the current event so we can preserve unspecified fields.
      const getRes = await fetch(_CAL_BASE + '/' + encodeURIComponent(params.id),
        { headers: { 'Authorization': 'Bearer ' + tok } });
      if (!getRes.ok) return 'Could not find that event (HTTP ' + getRes.status + ').';
      const ev = await getRes.json();

      const cur = (ev.start && ev.start.dateTime) ? new Date(ev.start.dateTime)
        : (ev.start && ev.start.date) ? new Date(ev.start.date + 'T09:00:00') : new Date();
      let y = cur.getFullYear(), mo = cur.getMonth(), da = cur.getDate(), hh = cur.getHours(), mm = cur.getMinutes();
      if (params.date && /^\d{4}-\d{2}-\d{2}$/.test(params.date)) { const p = params.date.split('-'); y = +p[0]; mo = +p[1] - 1; da = +p[2]; }
      if (params.time && /^\d{1,2}:\d{2}$/.test(params.time)) { const t = params.time.split(':'); hh = +t[0]; mm = +t[1]; }
      const newStart = new Date(y, mo, da, hh, mm, 0, 0);

      let durMin = params.duration_minutes;
      if (durMin == null && ev.start && ev.start.dateTime && ev.end && ev.end.dateTime) {
        durMin = Math.round((new Date(ev.end.dateTime) - new Date(ev.start.dateTime)) / 60000);
      }
      if (durMin == null || durMin <= 0) durMin = 60;

      const patch = {
        start: { dateTime: newStart.toISOString(), timeZone: tz },
        end:   { dateTime: new Date(newStart.getTime() + durMin * 60000).toISOString(), timeZone: tz },
      };
      if (params.title) patch.summary = params.title;

      const res = await fetch(_CAL_BASE + '/' + encodeURIComponent(params.id),
        { method: 'PATCH', headers: { 'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json' }, body: JSON.stringify(patch) });
      if (!res.ok) return 'Calendar error ' + res.status;
      const when = newStart.toLocaleString('en-US', { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
      return 'Moved "' + (params.title || ev.summary || 'event') + '" to ' + when + '.';
    } catch (e) { return 'Calendar error: ' + e.message; }
  }

  async function markEmailRead(msgId) {

        { method:'POST', headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},

  }

  // ── Email compose (send / draft) ─────────────────────────────────
  // Standard base64 (for RFC 2047 header words).
  function _b64Std(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    bytes.forEach(function(b){ bin += String.fromCharCode(b); });
    return btoa(bin);
  }
  // base64url (for the Gmail `raw` field).
  function _b64url(str) {
    return _b64Std(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  // RFC 2047-encode a header value only if it contains non-ASCII.
  function _encHeader(s) {
    s = String(s || '');
    return /^[\x00-\x7F]*$/.test(s) ? s : '=?UTF-8?B?' + _b64Std(s) + '?=';
  }
  function _buildMime(params) {
    const lines = [];
    lines.push('To: ' + (params.to || ''));
    if (params.cc)  lines.push('Cc: '  + params.cc);
    if (params.bcc) lines.push('Bcc: ' + params.bcc);
    lines.push('Subject: ' + _encHeader(params.subject || '(no subject)'));
    lines.push('MIME-Version: 1.0');
    lines.push('Content-Type: text/plain; charset="UTF-8"');
    lines.push('');
    lines.push(String(params.body || ''));
    return lines.join('\r\n');
  }

  async function sendEmail(params) {
    params = params || {};
    const tok = await GoogleAuth.getToken();
    if (!tok) return 'Gmail not connected — sign in via the email page first.';
    if (!(params.to || '').trim()) return 'Need a recipient (to).';
    if (!(params.body || '').trim()) return 'Need a message body.';
    try {
      const res = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',
        { method:'POST', headers:{ 'Authorization':'Bearer '+tok, 'Content-Type':'application/json' },
          body: JSON.stringify({ raw: _b64url(_buildMime(params)) }) });
      if (res.status === 403) return 'Gmail refused the send (403) — the send permission may not be granted yet. Sign out and back in (email page) to re-consent.';
      if (!res.ok) return 'Gmail send error ' + res.status;
      return 'Email sent to ' + params.to + '.';
    } catch (e) { return 'Gmail send error: ' + e.message; }
  }

  async function createDraft(params) {
    params = params || {};

    if (!tok) return 'Gmail not connected — sign in via the email page first.';
    if (!(params.body || '').trim()) return 'Need a message body to draft.';
    try {
      const res = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/drafts',
        { method:'POST', headers:{ 'Authorization':'Bearer '+tok, 'Content-Type':'application/json' },

      if (!res.ok) return 'Gmail draft error ' + res.status;
      return 'Draft saved to Gmail' + (params.to ? ' (to ' + params.to + ')' : '') + '.';
    } catch (e) { return 'Gmail draft error: ' + e.message; }
  }

  // Full-mailbox Gmail search (read tool). Returns a text block of results
  // that is fed back to the model so it can read and summarize them.
  async function searchGmail(query) {
    query = (query || '').trim();
    if (!query) return 'Gmail search skipped: no query provided.';
    try {
      const res = await fetch('/api/gmail-search?q=' + encodeURIComponent(query));
      if (res.status === 401) return 'Gmail not connected — the user needs to sign in via the email page first.';
      if (!res.ok) return 'Gmail search failed (HTTP ' + res.status + ').';
      const data    = await res.json();
      const results = Array.isArray(data.results) ? data.results : [];
      if (!results.length) return 'No emails matched the search "' + query + '".';
      let block = 'Top ' + results.length + ' result' + (results.length !== 1 ? 's' : '') + ' for "' + query + '":';
      results.forEach(function(e, i) {
        block += '\n' + (i + 1) + '. [id:' + e.id + '] From: ' + e.sender
          + ' | Subject: ' + e.subject
          + (e.date ? ' | Date: ' + e.date : '')
          + (e.snippet ? '\n   Preview: ' + e.snippet : '');
      });
      return block;
    } catch (e) {
      return 'Gmail search error: ' + e.message;
    }
  }

  // Live web search (read tool). Returns a text block (synthesized answer +
  // sources) that is fed back to the model so it can answer with current info.
  async function searchWeb(query) {
    query = (query || '').trim();
    if (!query) return 'Web search skipped: no query provided.';
    try {
      const res = await fetch('/api/web-search?q=' + encodeURIComponent(query));
      if (res.status === 500) return 'Web search is not configured on the server (no TAVILY_API_KEY).';
      if (!res.ok) return 'Web search failed (HTTP ' + res.status + ').';
      const data    = await res.json();
      const results = Array.isArray(data.results) ? data.results : [];
      if (!data.answer && !results.length) return 'No useful web results for "' + query + '".';
      let block = 'Web results for "' + query + '":';
      if (data.answer) block += '\nSummary: ' + data.answer;
      results.forEach(function(r, i) {
        block += '\n' + (i + 1) + '. ' + (r.title || r.url)
          + (r.url ? '\n   ' + r.url : '')
          + (r.content ? '\n   ' + r.content : '');
      });
      return block;
    } catch (e) {
      return 'Web search error: ' + e.message;
    }
  }

  // Decode a Gmail base64url body part into a UTF-8 string.
  function _b64urlDecode(data) {
    if (!data) return '';
    try {
      const bin   = atob(data.replace(/-/g, '+').replace(/_/g, '/'));
      const bytes = Uint8Array.from(bin, function(c){ return c.charCodeAt(0); });
      return new TextDecoder('utf-8').decode(bytes);
    } catch (_) { return ''; }
  }
  // Walk a Gmail payload tree for the first part of a given MIME type.
  function _findPart(payload, mime) {
    if (!payload) return null;
    if (payload.mimeType === mime && payload.body && payload.body.data) return payload.body.data;
    if (Array.isArray(payload.parts)) {
      for (const p of payload.parts) { const r = _findPart(p, mime); if (r) return r; }
    }
    return null;
  }

  // Read tool: full body of one email (id from search_gmail or the unread list).
  async function readEmail(id) {
    id = (id || '').trim();
    if (!id) return 'Read email skipped: no message id.';
    const tok = await GoogleAuth.getToken();
    if (!tok) return 'Gmail not connected — the user needs to sign in via the email page first.';
    try {
      const res = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/' + encodeURIComponent(id) + '?format=full',
        { headers: { 'Authorization': 'Bearer ' + tok } });
      if (!res.ok) return 'Could not read email (HTTP ' + res.status + ').';
      const msg  = await res.json();
      const hdrs = (msg.payload && msg.payload.headers) || [];
      const gh   = function(n){ return (hdrs.find(function(h){ return h.name === n; }) || {}).value || ''; };
      let body = _b64urlDecode(_findPart(msg.payload, 'text/plain'));
      if (!body) {
        body = _b64urlDecode(_findPart(msg.payload, 'text/html'))
          .replace(/<style[\s\S]*?<\/style>/gi, ' ')
          .replace(/<[^>]+>/g, ' ')
          .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&')
          .replace(/\s+/g, ' ').trim();
      }
      body = (body || '').slice(0, 4000);
      return 'EMAIL [id:' + id + ']'
        + '\nFrom: ' + gh('From')
        + '\nDate: ' + gh('Date')
        + '\nSubject: ' + (gh('Subject') || '(none)')
        + '\n\n' + (body || '(no readable text body)');
    } catch (e) { return 'Email read error: ' + e.message; }
  }

  // Read tool: calendar events for a date or range (for schedule / free-time Qs).
  async function getCalendar(params) {
    params = params || {};
    const tok = await GoogleAuth.getToken();
    if (!tok) return 'Calendar not connected — the user needs to sign in via the email page first.';
    try {
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      function parseDate(s) {
        if (s && /^\d{4}-\d{2}-\d{2}$/.test(s)) { const d = new Date(s + 'T00:00:00'); if (!isNaN(d)) return d; }
        return null;
      }
      const startD = parseDate(params.start) || new Date();
      startD.setHours(0, 0, 0, 0);
      let endD = parseDate(params.end) || new Date(startD);
      endD.setHours(23, 59, 59, 999);
      if (endD < startD) endD = new Date(startD.getTime() + 86399999);
      const fmtD = function(d){ return d.toLocaleDateString('en-US', { month:'short', day:'numeric' }); };

      const url = 'https://www.googleapis.com/calendar/v3/calendars/primary/events'
        + '?singleEvents=true&orderBy=startTime'
        + '&timeMin=' + encodeURIComponent(startD.toISOString())
        + '&timeMax=' + encodeURIComponent(endD.toISOString())
        + '&maxResults=50&timeZone=' + encodeURIComponent(tz);
      const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + tok } });
      if (!res.ok) return 'Calendar error ' + res.status;
      const items = ((await res.json()).items) || [];
      if (!items.length) return 'No calendar events between ' + fmtD(startD) + ' and ' + fmtD(endD) + '.';
      let block = 'Calendar events (' + fmtD(startD) + ' – ' + fmtD(endD) + '):';
      items.forEach(function(ev) {
        let when;
        if (ev.start && ev.start.dateTime) {
          const d = new Date(ev.start.dateTime);
          when = d.toLocaleString('en-US', { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
          if (ev.end && ev.end.dateTime) when += '–' + new Date(ev.end.dateTime).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
        } else {
          when = ((ev.start && ev.start.date) || '') + ' (all day)';
        }
        block += '\n• [id:' + ev.id + '] ' + when + ' — ' + (ev.summary || '(no title)') + (ev.location ? ' @ ' + ev.location : '');
      });
      return block;
    } catch (e) { return 'Calendar error: ' + e.message; }
  }

  // Read tool: find places / businesses (serverless, OpenStreetMap).
  async function findPlace(params) {
    params = params || {};
    const q = String(params.query || '').trim();
    if (!q) return 'Place search skipped: no query.';
    try {
      const res = await fetch('/api/place-search?q=' + encodeURIComponent(q)
        + (params.near ? '&near=' + encodeURIComponent(params.near) : ''));
      if (!res.ok) return 'Place search failed (HTTP ' + res.status + ').';
      const d = await res.json();
      const results = Array.isArray(d.results) ? d.results : [];
      if (!results.length) return 'No places found for "' + (d.query || q) + '".';
      let block = 'Places for "' + (d.query || q) + '":';
      results.forEach(function(p, i) {
        const meta = [];
        if (p.rating)   meta.push('★' + p.rating + (p.ratingCount ? ' (' + p.ratingCount + ')' : ''));
        if (p.priceLevel) meta.push(p.priceLevel);
        if (typeof p.openNow === 'boolean') meta.push(p.openNow ? 'open now' : 'closed now');
        if (p.status)   meta.push(p.status);
        if (p.category) meta.push(p.category);
        block += '\n' + (i + 1) + '. ' + (p.name || p.address) + (meta.length ? ' — ' + meta.join(' · ') : '');
        if (p.address)    block += '\n   ' + p.address;
        if (p.hoursToday) block += '\n   ' + p.hoursToday;
        if (p.phone)      block += '\n   ' + p.phone;
        if (p.website)    block += '\n   ' + p.website;
      });
      return block;
    } catch (e) { return 'Place search error: ' + e.message; }
  }
