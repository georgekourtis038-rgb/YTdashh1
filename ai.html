<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f0e">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="axis-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Axis AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="topbar.js" defer></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0f0e;
  --mint: #2de8a2;
  --mint-dim: rgba(45,232,162,0.4);
  --card-bg: rgba(255,255,255,0.04);
  --card-border: rgba(255,255,255,0.08);
  --label: rgba(255,255,255,0.4);
  --subtle: rgba(255,255,255,0.3);
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

html, body {
  width: 100%;
  min-height: 100%;
  background: var(--bg);
  color: #fff;
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

body {
  padding-bottom: calc(84px + env(safe-area-inset-bottom));
}

/* ── Shell ── */
.ai-shell {
  max-width: 680px;
  margin: 0 auto;
  padding: max(110px, calc(env(safe-area-inset-top) + 80px)) 20px 24px;
}

/* ── Header ── */
.ai-eyebrow {
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--mint);
  text-transform: uppercase;
  font-weight: 700;
  opacity: 0.85;
  margin-bottom: 10px;
}

.ai-greeting {
  font-size: 26px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.02em;
  margin-bottom: 24px;
}

/* ── Briefing card ── */
.briefing-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 28px;
  will-change: transform;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}

.briefing-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.briefing-icon {
  font-size: 13px;
}

.briefing-title {
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--label);
  text-transform: uppercase;
  font-weight: 700;
}

.briefing-loading {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--subtle);
  font-size: 13px;
}

.dot-pulse {
  display: flex;
  gap: 4px;
  align-items: center;
}

.dot-pulse span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--mint-dim);
  animation: dotPulse 1.2s ease-in-out infinite;
  will-change: transform, opacity;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}
.dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
.dot-pulse span:nth-child(3) { animation-delay: 0.4s; }

@keyframes dotPulse {
  0%, 80%, 100% { opacity: 0.3; transform: scale(0.8) translateZ(0); }
  40%            { opacity: 1;   transform: scale(1)   translateZ(0); }
}

.briefing-text {
  font-size: 15px;
  line-height: 1.65;
  color: rgba(255,255,255,0.85);
}

.briefing-no-key {
  font-size: 13px;
  color: var(--subtle);
  line-height: 1.55;
}

.briefing-no-key code {
  color: var(--mint);
  font-family: var(--font-mono);
  font-size: 12px;
}

/* ── Chat thread ── */
.chat-thread {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ── Message bubbles ── */
.msg {
  display: flex;
  max-width: 85%;
  will-change: transform;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  animation: msgIn 0.35s cubic-bezier(0.22,1,0.36,1) both;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(10px) translateZ(0); }
  to   { opacity: 1; transform: translateY(0)    translateZ(0); }
}

.msg-user { align-self: flex-end; flex-direction: row-reverse; }
.msg-ai   { align-self: flex-start; }

.msg-bubble {
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 15px;
  line-height: 1.55;
}

.msg-user .msg-bubble {
  background: rgba(45,232,162,0.12);
  border: 1px solid rgba(45,232,162,0.28);
  color: #fff;
  border-bottom-right-radius: 4px;
}

.msg-ai .msg-bubble {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  color: rgba(255,255,255,0.88);
  border-bottom-left-radius: 4px;
}

/* ── Typing indicator ── */
.msg-typing .msg-bubble { padding: 14px 18px; }

.typing-dots {
  display: flex;
  gap: 4px;
  align-items: center;
}

.typing-dots span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--mint-dim);
  animation: dotPulse 1.2s ease-in-out infinite;
  will-change: transform, opacity;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }

/* ── Chat input bar (liquid glass) ── */
.chat-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 10px 16px max(14px, calc(env(safe-area-inset-bottom) + 6px));
  background: rgba(8,12,11,0.85);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  backdrop-filter: blur(20px) saturate(140%);
  border-top: 1px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 30;
}

.chat-input {
  flex: 1;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 16px;
  font-family: var(--font);
  color: #fff;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color 0.2s ease;
}

.chat-input::placeholder { color: var(--subtle); }
.chat-input:focus { border-color: rgba(45,232,162,0.4); }

.chat-send-btn {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: rgba(45,232,162,0.1);
  border: 2px solid var(--mint);
  color: var(--mint);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s ease, transform 0.1s ease;
}

.chat-send-btn:active { background: rgba(45,232,162,0.22); transform: scale(0.93); }
.chat-send-btn:disabled { opacity: 0.35; pointer-events: none; }

/* ── Page entry animations ── */
.ai-eyebrow  { animation: revealUp 0.65s cubic-bezier(0.16,1,0.3,1) 0.05s both; }
.ai-greeting { animation: revealUp 0.65s cubic-bezier(0.16,1,0.3,1) 0.10s both; }
.briefing-card { animation: revealUp 0.65s cubic-bezier(0.16,1,0.3,1) 0.18s both; }

@keyframes revealUp {
  from { opacity: 0; transform: translateY(40px) translateZ(0); }
  to   { opacity: 1; transform: translateY(0)    translateZ(0); }
}


/* ── Briefing refresh button ── */
.briefing-header { justify-content: flex-start; }
.briefing-refresh-btn {
  margin-left: auto; width: 26px; height: 26px;
  border: none; background: transparent; color: var(--mint);
  opacity: 0.5; cursor: pointer; border-radius: 6px; padding: 0;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  -webkit-tap-highlight-color: transparent; transition: opacity 0.15s;
}
.briefing-refresh-btn:hover { opacity: 1; }
.briefing-refresh-btn.spinning svg { animation: refreshSpin 0.65s linear; }
@keyframes refreshSpin { to { transform: rotate(360deg); } }

/* ── Streaming cursor ── */
.streaming::after {
  content: '▋';
  display: inline-block;
  animation: cursorBlink 0.65s step-end infinite;
  color: var(--mint);
  margin-left: 1px;
  vertical-align: baseline;
  will-change: opacity;
}
@keyframes cursorBlink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0; }
}

/* ── Action confirmation cards ── */
.action-card {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 11px 15px;
  background: rgba(45,232,162,0.07);
  border: 1px solid rgba(45,232,162,0.24);
  border-radius: 12px;
  border-bottom-left-radius: 4px;
  animation: msgIn 0.35s cubic-bezier(0.22,1,0.36,1) both;
  will-change: transform;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  align-self: flex-start;
  max-width: 85%;
}
.action-card-check {
  color: var(--mint);
  font-size: 13px;
  flex-shrink: 0;
  margin-top: 2px;
}
.action-card-text {
  font-size: 13px;
  color: rgba(45,232,162,0.88);
  line-height: 1.45;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-delay: 0ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<div class="ai-shell">
  <p class="ai-eyebrow">Axis AI</p>
  <h1 class="ai-greeting" id="aiGreeting">Good morning</h1>

  <div class="briefing-card">
    <div class="briefing-header">
      <span class="briefing-icon">⚡</span>
      <span class="briefing-title">Daily Briefing</span>
      <button class="briefing-refresh-btn" id="briefingRefresh" aria-label="Refresh briefing" title="Regenerate">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M12.5 2.5v3h-3M1.5 11.5v-3h3M2.1 5.5a5.5 5.5 0 0 1 10 1M11.9 8.5a5.5 5.5 0 0 1-10 1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="briefing-loading" id="briefingLoading">
      <div class="dot-pulse"><span></span><span></span><span></span></div>
      <span>Analyzing your day…</span>
    </div>
    <p id="briefingText" style="display:none"></p>
  </div>

  <div class="chat-thread" id="chatThread"></div>
</div>

<div class="chat-bar">
  <input type="text" id="chatInput" class="chat-input"
    placeholder="Ask anything about your day…"
    autocomplete="off" enterkeyhint="send">
  <button id="chatSend" class="chat-send-btn" type="button" aria-label="Send">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M9 15V3M9 3L4 8M9 3L14 8" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<script>
(function () {
  'use strict';

  // ── Storage helpers ─────────────────────────────────────────────
  function lsGet(k) {
    try { return JSON.parse(localStorage.getItem(k)); } catch (_) { return null; }
  }
  function lsRaw(k) {
    try { return localStorage.getItem(k); } catch (_) { return null; }
  }

  // ── Supabase briefing sync ───────────────────────────────────────
  const _SUPA_URL  = 'https://oyylbiscxnymnmetyrho.supabase.co';
  const _SUPA_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95eWxiaXNjeG55bW5tZXR5cmhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMzQ1MDgsImV4cCI6MjA5NTcxMDUwOH0.3xxHcp3Z4vJWHEGFV_iUW_YeJ2gdUPqYiNAQkYnR-qU';
  const _BRIEF_ROW = 'briefing';
  let _supaClient  = null;

  function _getSupa() {
    if (_supaClient) return _supaClient;
    if (!window.supabase) return null;
    _supaClient = window.supabase.createClient(_SUPA_URL, _SUPA_KEY);
    return _supaClient;
  }

  async function _fetchRemoteBriefing() {
    const supa = _getSupa();
    if (!supa) return null;
    try {
      const { data, error } = await supa
        .from('app_state').select('data').eq('key', _BRIEF_ROW).maybeSingle();
      if (error || !data || !data.data) return null;
      return data.data;
    } catch (_) { return null; }
  }

  async function _pushBriefingToSupabase(obj) {
    const supa = _getSupa();
    if (!supa) return;
    try {
      await supa.from('app_state').upsert(
        { key: _BRIEF_ROW, data: obj, updated_at: new Date().toISOString() },
        { onConflict: 'key' }
      );
    } catch (_) {}
  }

  // ── Date helpers (6 AM day boundary) ────────────────────────────
  function pad(n) { return String(n).padStart(2, '0'); }
  function fmt(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  function activeDate() {
    const d = new Date();
    if (d.getHours() < 6) d.setDate(d.getDate() - 1);
    return fmt(d);
  }
  function tomorrowDate() {
    const d = new Date();
    if (d.getHours() >= 6) d.setDate(d.getDate() + 1);
    return fmt(d);
  }
  function calendarToday() { return fmt(new Date()); }
  function todayStr()      { return fmt(new Date()); }

  // ── Profile ──────────────────────────────────────────────────────
  function getFirstName() {
    const s = lsGet('settings') || {};
    if (s.firstName) return s.firstName;
    const raw = lsRaw('dash_name') || '';
    if (raw) {
      const sp = raw.indexOf(' ');
      return sp >= 0 ? raw.slice(0, sp) : raw;
    }
    return '';
  }

  function getGreeting() {
    const h = new Date().getHours();
    const name = getFirstName();
    const time = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    return name ? time + ', ' + name : time;
  }

  // ── Data collectors ──────────────────────────────────────────────
  function getWaterData() {
    const state = lsGet('po_water_v1') || {};
    const today = calendarToday();
    const doneMl = ((state.history || {})[today]) || 0;
    let targetMl = 2500;
    try {
      const raw = lsGet('dash_weight');
      const lbs = parseFloat(raw);
      if (!isNaN(lbs) && lbs > 0) {
        const kg = lbs / 2.205;
        const sex = lsRaw('dash_sex') || 'm';
        const adj = (sex === 'female' || sex === 'f') ? 0 : 200;
        targetMl = Math.max(2000, Math.min(6000, Math.round(((kg * 35) + adj) / 50) * 50));
      }
    } catch (_) {}
    return { doneMl, targetMl };
  }

  function getGoalData(dateKey) {
    return lsGet('goals:' + dateKey) || [];
  }

  function getStreak() {
    const s = lsGet('goal_streak_v1') || {};
    return typeof s.count === 'number' ? s.count : 0;
  }

  function getWeightInfo() {
    const raw = lsGet('dash_weight');
    const latestLbs = raw != null ? parseFloat(raw) : null;
    let trendStr = null;
    try {
      const gymState = lsGet('po_gym_v1') || {};
      const log = gymState.weightLog;
      if (Array.isArray(log) && log.length > 1) {
        const recent = log.slice(-7);
        const delta = recent[recent.length - 1].weight - recent[0].weight;
        if (!isNaN(delta)) {
          trendStr = (delta >= 0 ? '+' : '') + delta.toFixed(1) + ' lbs over last ' + recent.length + ' entries';
        }
      }
    } catch (_) {}
    return { latestLbs, trendStr };
  }

  function getLtGoals() {
    try { return JSON.parse(localStorage.getItem('axis_goals') || 'null') || []; } catch(_) { return []; }
  }

  function getGymSplitToday() {
    try {
      const cycle = lsGet('dash_gym_cycle');
      if (cycle && cycle.type === 'cycle' && Array.isArray(cycle.days) && cycle.days.length && cycle.startDate) {
        const today = new Date(); today.setHours(0,0,0,0);
        const start = new Date(cycle.startDate + 'T00:00:00'); start.setHours(0,0,0,0);
        const diff = Math.max(0, Math.round((today - start) / 86400000));
        return cycle.days[diff % cycle.days.length] || null;
      }
      const split = lsGet('dash_gym_split') || {};
      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      return split[days[new Date().getDay()]] || null;
    } catch (_) { return null; }
  }

  function getGymSessionsPerWeek() {
    try {
      const cycle = lsGet('dash_gym_cycle');
      if (cycle && cycle.type === 'cycle' && Array.isArray(cycle.days) && cycle.days.length) {
        const active = cycle.days.filter(function(d) { return d && !/^(rest|off)$/i.test(d); }).length;
        return Math.round(active / cycle.days.length * 7);
      }
      const split = lsGet('dash_gym_split') || {};
      const count = Object.values(split).filter(function(v) { return v && !/^(rest|off)$/i.test(v); }).length;
      return count || null;
    } catch (_) { return null; }
  }

  function getWorkoutHistory() {
    try {
      const s = lsGet('po_coach_v1');
      if (!s || !Array.isArray(s.exercises) || !s.logs) return [];
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - 7);
      cutoff.setHours(0, 0, 0, 0);
      const bySess = {};
      s.exercises.forEach(function(ex) {
        (s.logs[ex.id] || []).forEach(function(l) {
          const key = l.sid ? l.sid.slice(0, 10) : (l.date || '').slice(0, 10);
          if (!key) return;
          if (new Date(key + 'T00:00:00') < cutoff) return;
          if (!bySess[key]) bySess[key] = [];
          bySess[key].push({ ex: ex, log: l });
        });
      });
      return Object.entries(bySess)
        .sort(function(a, b) { return b[0].localeCompare(a[0]); })
        .map(function(entry) {
          const dateKey = entry[0], sets = entry[1];
          const byEx = {};
          sets.forEach(function(item) {
            if (!byEx[item.ex.id]) byEx[item.ex.id] = { name: item.ex.name, sets: [] };
            byEx[item.ex.id].sets.push({ reps: item.log.reps, weight: item.log.weight, bw: item.ex.bw });
          });
          const exercises = Object.values(byEx);
          const totalVol = exercises.reduce(function(sum, e) {
            return sum + e.sets.reduce(function(s2, set) { return s2 + (set.weight || 0) * (set.reps || 0); }, 0);
          }, 0);
          return { date: dateKey, exercises: exercises, totalVol: Math.round(totalVol), units: s.units || 'kg' };
        });
    } catch (_) { return []; }
  }

  function getNutritionTargets() {
    try {
      const weightLbs = parseFloat(lsRaw('dash_weight'));
      const heightCm  = parseFloat(lsRaw('dash_height'));
      const age       = parseFloat(lsRaw('dash_age'));
      const sex       = (lsRaw('dash_sex') || '').toLowerCase();

      if (isNaN(weightLbs) || weightLbs <= 0 || isNaN(heightCm) || heightCm <= 0 || isNaN(age) || age <= 0) return null;

      const weightKg = weightLbs / 2.205;
      const isFemale = sex === 'f' || sex === 'female';
      const bmr = Math.round((10 * weightKg) + (6.25 * heightCm) - (5 * age) + (isFemale ? -161 : 5));

      const sessions = getGymSessionsPerWeek() || 0;
      let multiplier, activityLabel;
      if (sessions >= 5)      { multiplier = 1.725; activityLabel = 'active';   }
      else if (sessions >= 3) { multiplier = 1.55;  activityLabel = 'moderate'; }
      else if (sessions >= 1) { multiplier = 1.375; activityLabel = 'light';    }
      else                    { multiplier = 1.2;   activityLabel = 'sedentary';}

      const tdee = Math.round(bmr * multiplier);

      let recommendedCals = tdee;
      let deficitNote = null;

      const goals = getLtGoals();
      const weightGoal = goals.find(function(g) {
        return g.category === 'weight' && g.targetValue != null && g.deadline;
      });

      if (weightGoal) {
        const targetRaw = parseFloat(weightGoal.targetValue);
        const targetLbs = (weightGoal.unit === 'kg') ? targetRaw * 2.205 : targetRaw;
        const lbsToLose = weightLbs - targetLbs;
        if (lbsToLose > 0.5) {
          const today = new Date(); today.setHours(0, 0, 0, 0);
          const deadline = new Date(weightGoal.deadline + 'T00:00:00');
          const daysLeft = Math.round((deadline - today) / 86400000);
          if (daysLeft > 0) {
            const rawDeficit = Math.round((lbsToLose * 3500) / daysLeft);
            const dailyDeficit = Math.min(1000, rawDeficit);
            recommendedCals = tdee - dailyDeficit;
            deficitNote = `${dailyDeficit} kcal/day deficit · lose ${lbsToLose.toFixed(1)} lbs by ${weightGoal.deadline} (${daysLeft} days remaining)`;
          }
        }
      }

      const proteinMin = Math.round(weightLbs * 0.8);
      const proteinMax = Math.round(weightLbs * 1.0);

      return { bmr, tdee, multiplier, activityLabel, recommendedCals, deficitNote, proteinMin, proteinMax };
    } catch (_) { return null; }
  }

  // ── Gmail inbox context ──────────────────────────────────────────
  let _cachedGmailEmails = [];

  async function fetchGmailEmails() {
    const stored = JSON.parse(localStorage.getItem('google_calendar_token') || 'null');
    const tok = stored && stored.token;
    if (!tok || Date.now() >= (stored.expiry || 0)) return;
    try {
      const listRes = await fetch(
        'https://www.googleapis.com/gmail/v1/users/me/messages?q=in:inbox+is:unread&maxResults=10',
        { headers: { 'Authorization': 'Bearer ' + tok } }
      );
      if (!listRes.ok) return;
      const listData = await listRes.json();
      const msgs = listData.messages || [];
      const details = await Promise.all(msgs.map(m =>
        fetch(
          `https://www.googleapis.com/gmail/v1/users/me/messages/${m.id}?format=metadata&metadataHeaders=From,Subject`,
          { headers: { 'Authorization': 'Bearer ' + tok } }
        ).then(r => r.ok ? r.json() : null).catch(() => null)
      ));
      _cachedGmailEmails = details.filter(Boolean).map(msg => {
        const hdrs = (msg.payload && msg.payload.headers) || [];
        const from = (hdrs.find(h => h.name === 'From') || {}).value || '';
        const subject = (hdrs.find(h => h.name === 'Subject') || {}).value || '(No subject)';
        const m = from.match(/^(.+?)\s*<[^>]+>$/);
        const sender = m ? m[1].replace(/^"|"$/g, '').trim() : from.split('@')[0];
        return { sender, subject, snippet: (msg.snippet || '').slice(0, 100) };
      });
    } catch (_) {}
  }

  // ── System prompt ────────────────────────────────────────────────
  function buildSystemPrompt() {
    const today = activeDate();
    const tomorrow = tomorrowDate();
    const todayGoals = getGoalData(today);
    const tomorrowGoals = getGoalData(tomorrow);
    const water = getWaterData();
    const streak = getStreak();
    const wt = getWeightInfo();
    const gymSplit = getGymSplitToday();
    const gymSessions = getGymSessionsPerWeek();
    const workouts = getWorkoutHistory();
    const name = getFirstName();
    const now = new Date();
    const dateStr = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    const timeStr = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });

    const doneGoals    = todayGoals.filter(g => g.done);
    const pendingGoals = todayGoals.filter(g => !g.done);
    const waterPct     = water.targetMl > 0 ? Math.round(water.doneMl / water.targetMl * 100) : 0;

    let p = `You are Axis — ${name || 'the user'}'s personal assistant with full visibility into their health, fitness, and daily schedule. You operate like a trusted chief of staff: calm, composed, and precise. You deliver information clearly and directly, offer suggestions rather than commands, and anticipate needs before they are stated. You never use exclamation marks, motivational clichés, or coaching hype. You address the user by first name occasionally — not constantly. Your tone carries quiet authority and professional restraint. You are data-driven and specific, always referencing actual numbers. Responses are concise: two or three sentences for straightforward questions, a short paragraph for complex ones.

=== USER DATA (${dateStr}, ${timeStr}) ===`;

    p += `\nGOALS TODAY: ${doneGoals.length}/${todayGoals.length} complete`;
    if (doneGoals.length)    p += `\n  Completed: ${doneGoals.map(g => g.text).join(' | ')}`;
    if (pendingGoals.length) p += `\n  Pending:   ${pendingGoals.map(g => g.text).join(' | ')}`;
    if (!todayGoals.length)  p += '\n  (no goals set today)';

    p += tomorrowGoals.length
      ? `\nTOMORROW:   ${tomorrowGoals.map(g => g.text).join(' | ')}`
      : '\nTOMORROW:   nothing planned yet';

    p += `\nWATER:      ${water.doneMl}ml / ${water.targetMl}ml (${waterPct}%)`;
    p += `\nSTREAK:     ${streak} day${streak !== 1 ? 's' : ''}`;

    if (gymSplit || gymSessions != null) {
      let splitLine = gymSplit ? `\nGYM SPLIT:  ${gymSplit}` : '\nGYM SPLIT:  (not set for today)';
      if (gymSessions != null) splitLine += ` · ${gymSessions}x/week`;
      p += splitLine;
    }

    if (wt.latestLbs != null) {
      p += `\nWEIGHT:     ${wt.latestLbs} lbs`;
      if (wt.trendStr) p += ` (${wt.trendStr})`;
    }

    const age    = lsRaw('dash_age');
    const sex    = lsRaw('dash_sex');
    const height = lsRaw('dash_height');
    if (age || sex || height) {
      const parts = [];
      if (age)    parts.push('age ' + age);
      if (sex)    parts.push(sex);
      if (height) parts.push(height + ' cm');
      p += `\nPROFILE:    ${parts.join(', ')}`;
    }

    const nutrition = getNutritionTargets();
    if (nutrition) {
      p += `\nNUTRITION:  BMR ${nutrition.bmr} kcal · TDEE ${nutrition.tdee} kcal (${nutrition.activityLabel}, ${getGymSessionsPerWeek() || 0}x/week)`;
      p += `\n  Calories: ${nutrition.recommendedCals} kcal/day`;
      if (nutrition.deficitNote) p += ` — ${nutrition.deficitNote}`;
      else p += ' — maintenance';
      p += `\n  Protein:  ${nutrition.proteinMin}–${nutrition.proteinMax} g/day`;
    }

    const ltGoals = getLtGoals();
    if (ltGoals.length) {
      p += '\nLONG-TERM GOALS:';
      ltGoals.forEach(function(g) {
        p += '\n  ' + g.title + ': target ' + g.targetValue + ' ' + g.unit +
             (g.deadline ? ', deadline ' + g.deadline : '');
      });
    }

    if (workouts.length) {
      p += '\nWORKOUT HISTORY (last 7 days):';
      workouts.forEach(function(w) {
        const vol = w.totalVol > 0 ? `, ${w.totalVol.toLocaleString()} ${w.units} vol` : '';
        p += `\n  ${w.date} — ${w.exercises.length} exercise${w.exercises.length !== 1 ? 's' : ''}${vol}`;
        w.exercises.forEach(function(e) {
          const setsStr = e.sets.map(function(s) {
            return s.weight ? `${s.weight}${w.units}×${s.reps}` : `${s.reps} reps`;
          }).join(', ');
          p += `\n    ${e.name}: ${e.sets.length} set${e.sets.length !== 1 ? 's' : ''} — ${setsStr}`;
        });
      });
    }

    if (_cachedGmailEmails.length) {
      p += '\nRECENT UNREAD EMAILS (inbox):';
      _cachedGmailEmails.forEach(function(e) {
        p += `\n  From: ${e.sender} | Subject: ${e.subject}`;
        if (e.snippet) p += `\n  Preview: ${e.snippet}`;
      });
    }

    p += `\n===

=== TOOLS ===
You can write directly to the app by embedding action tags in your response. Rules:
- Only use actions when the user explicitly asks you to change or update something.
- Always explain what you are about to do in plain prose first, then include the action tag.
- Never fabricate goal IDs — only use IDs from the LONG-TERM GOALS list above.
- Never include multiple actions for the same tool in one response.

Syntax: <action>{"tool": "tool_name", "params": {...}}</action>

Available tools:
  set_calorie_target   — set daily calorie and macro targets
    params: { kcal: number, protein?: number, carbs?: number, fat?: number }
  set_water_target     — update daily water intake target
    params: { target_ml: number }
  update_goal          — edit an existing long-term goal
    params: { id: string, title?: string, target?: number, deadline?: string }
  delete_goal          — remove a long-term goal
    params: { id: string }
  add_calendar_event   — add an event to Google Calendar
    params: { title: string, date: "YYYY-MM-DD", time?: "HH:MM", duration_minutes?: number }
===`;
    return p;
  }

  // ── SSE streaming helper ─────────────────────────────────────────
  // Calls /api/chat, parses SSE, fires onChunk(fullTextSoFar) on every
  // text delta, and returns the completed full text when the stream ends.
  async function streamClaude(messages, onChunk) {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system: buildSystemPrompt(), messages })
    });
    if (!res.ok) throw new Error('API ' + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let full = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop(); // hold back any incomplete line
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        if (!raw) continue;
        try {
          const evt = JSON.parse(raw);
          if (evt.type === 'content_block_delta' && evt.delta?.type === 'text_delta') {
            full += evt.delta.text;
            onChunk(full);
          }
        } catch (_) {}
      }
    }
    return full;
  }

  // ── Chat state ────────────────────────────────────────────────────
  const chatHistory = [];

  // ── DOM helpers ───────────────────────────────────────────────────
  function scrollToBottom() {
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  function appendBubble(role, text) {
    const thread = document.getElementById('chatThread');
    const wrap = document.createElement('div');
    wrap.className = 'msg msg-' + role;
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);
    thread.appendChild(wrap);
    scrollToBottom();
  }

  function appendTyping() {
    const thread = document.getElementById('chatThread');
    const wrap = document.createElement('div');
    wrap.className = 'msg msg-ai msg-typing';
    wrap.innerHTML = '<div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
    thread.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  // ── localStorage write with cross-page reactivity ────────────────
  function lsSet(k, v) {
    try {
      const s = JSON.stringify(v);
      localStorage.setItem(k, s);
      window.dispatchEvent(new StorageEvent('storage', { key: k, newValue: s, storageArea: localStorage }));
      if (window._pcTriggerSync) window._pcTriggerSync(k);
    } catch (_) {}
  }

  // ── Action executors ──────────────────────────────────────────────
  async function addCalendarEvent(params) {
    const stored = JSON.parse(localStorage.getItem('google_calendar_token') || 'null');
    const tok = stored && stored.token;
    if (!tok || Date.now() >= (stored.expiry || 0)) {
      return 'Calendar not connected — sign in via the email page first.';
    }
    try {
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const start = params.time
        ? new Date(params.date + 'T' + params.time + ':00')
        : null;
      const end = start
        ? new Date(start.getTime() + (params.duration_minutes || 60) * 60000)
        : null;
      const eventBody = {
        summary: params.title,
        start: start
          ? { dateTime: start.toISOString(), timeZone: tz }
          : { date: params.date },
        end: end
          ? { dateTime: end.toISOString(), timeZone: tz }
          : { date: params.date }
      };
      const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json' },
        body: JSON.stringify(eventBody)
      });
      if (!res.ok) return 'Calendar error ' + res.status + ' — check permissions.';
      return '"' + params.title + '" added to calendar on ' + params.date;
    } catch (e) { return 'Calendar error: ' + e.message; }
  }

  async function executeAction(tool, params) {
    if (tool === 'set_calorie_target') {
      const cur = lsGet('calorie_targets_v1') || {};
      lsSet('calorie_targets_v1', Object.assign({}, cur, params));
      let msg = 'Calorie target set to ' + params.kcal + ' kcal/day';
      if (params.protein) msg += ' · ' + params.protein + 'g protein';
      if (params.carbs)   msg += ' · ' + params.carbs + 'g carbs';
      if (params.fat)     msg += ' · ' + params.fat + 'g fat';
      return msg;
    }
    if (tool === 'set_water_target') {
      const state = lsGet('po_water_v1') || {};
      if (!state.settings) state.settings = {};
      state.settings.targetMl = params.target_ml;
      lsSet('po_water_v1', state);
      return 'Water target updated to ' + params.target_ml + ' ml/day';
    }
    if (tool === 'update_goal') {
      const goals = lsGet('axis_goals') || [];
      const idx = goals.findIndex(function(g) { return g.id === params.id; });
      if (idx === -1) return 'Goal not found (ID: ' + params.id + ')';
      if (params.title    != null) goals[idx].title       = params.title;
      if (params.target   != null) goals[idx].targetValue = params.target;
      if (params.deadline != null) goals[idx].deadline    = params.deadline;
      lsSet('axis_goals', goals);
      return 'Goal "' + goals[idx].title + '" updated';
    }
    if (tool === 'delete_goal') {
      const goals = lsGet('axis_goals') || [];
      const idx = goals.findIndex(function(g) { return g.id === params.id; });
      if (idx === -1) return 'Goal not found (ID: ' + params.id + ')';
      const title = goals[idx].title;
      goals.splice(idx, 1);
      lsSet('axis_goals', goals);
      return 'Goal "' + title + '" deleted';
    }
    if (tool === 'add_calendar_event') {
      return await addCalendarEvent(params);
    }
    return 'Unknown tool: ' + tool;
  }

  // ── Action parser ─────────────────────────────────────────────────
  function parseActions(text) {
    const actions = [];
    const clean = text.replace(/<action>([\s\S]*?)<\/action>/g, function(_, inner) {
      try {
        const parsed = JSON.parse(inner.trim());
        if (parsed.tool && parsed.params) actions.push(parsed);
      } catch (_) {}
      return '';
    }).replace(/\n{3,}/g, '\n\n').trim();
    return { clean, actions };
  }

  function appendActionCard(message) {
    const thread = document.getElementById('chatThread');
    const card = document.createElement('div');
    card.className = 'action-card';
    card.innerHTML = '<span class="action-card-check">✓</span><span class="action-card-text"></span>';
    card.querySelector('.action-card-text').textContent = message;
    thread.appendChild(card);
    scrollToBottom();
  }

  // ── Send ──────────────────────────────────────────────────────────
  async function sendMessage(text) {
    text = text.trim();
    if (!text) return;

    const input   = document.getElementById('chatInput');
    const sendBtn = document.getElementById('chatSend');
    input.value   = '';
    input.disabled   = true;
    sendBtn.disabled = true;

    chatHistory.push({ role: 'user', content: text });
    appendBubble('user', text);

    // Typing indicator — replaced by streaming bubble on first token
    const typingEl = appendTyping();
    const thread = document.getElementById('chatThread');
    const aiWrap = document.createElement('div');
    aiWrap.className = 'msg msg-ai';
    const aiBubble = document.createElement('div');
    aiBubble.className = 'msg-bubble streaming';
    aiWrap.appendChild(aiBubble);
    let attached = false;

    try {
      const full = await streamClaude([...chatHistory], function (accumulated) {
        if (!attached) {
          typingEl.remove();
          thread.appendChild(aiWrap);
          attached = true;
        }
        aiBubble.textContent = accumulated;
        scrollToBottom();
      });
      aiBubble.classList.remove('streaming');
      if (!attached) {
        typingEl.remove();
        appendBubble('ai', 'No response received.');
      } else {
        // Parse and strip action tags before displaying
        const { clean, actions } = parseActions(full);
        if (clean !== full) aiBubble.textContent = clean;
        chatHistory.push({ role: 'assistant', content: full });
        // Execute actions and show confirmation cards
        for (const action of actions) {
          const result = await executeAction(action.tool, action.params);
          appendActionCard(result);
        }
      }
    } catch (_) {
      aiBubble.classList.remove('streaming');
      typingEl.remove();
      if (attached) aiWrap.remove();
      appendBubble('ai', 'Something went wrong — check your connection or try again.');
    } finally {
      input.disabled   = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  // ── Daily briefing (cached per day) ─────────────────────────────
  async function loadBriefing(forceRefresh) {
    const loadingEl  = document.getElementById('briefingLoading');
    const textEl     = document.getElementById('briefingText');
    const refreshBtn = document.getElementById('briefingRefresh');

    // Serve from cache if available and not forcing
    if (!forceRefresh) {
      // Supabase first — ensures all devices show the same briefing for the day
      const remote = await _fetchRemoteBriefing();
      if (remote && remote.date === todayStr() && remote.text) {
        try { localStorage.setItem('axis_briefing_cache', JSON.stringify(remote)); } catch(_) {}
        loadingEl.style.display = 'none';
        textEl.className = 'briefing-text';
        textEl.textContent = remote.text;
        textEl.style.display = '';
        return;
      }
      // Local fallback (offline or Supabase unavailable)
      try {
        const cache = JSON.parse(localStorage.getItem('axis_briefing_cache') || 'null');
        if (cache && cache.date === todayStr() && cache.text) {
          loadingEl.style.display = 'none';
          textEl.className = 'briefing-text';
          textEl.textContent = cache.text;
          textEl.style.display = '';
          return;
        }
      } catch(_) {}
    }

    // Generate fresh
    loadingEl.style.display = '';
    textEl.style.display = 'none';
    textEl.classList.remove('streaming');
    if (refreshBtn) { refreshBtn.classList.add('spinning'); refreshBtn.disabled = true; }

    let shown = false;
    let fullText = '';
    try {
      await streamClaude([{
        role: 'user',
        content: 'Give me a 3-sentence daily briefing based on my data. Be specific and actionable. Start with the most important thing I should focus on today.'
      }], function(accumulated) {
        if (!shown) {
          loadingEl.style.display = 'none';
          textEl.className = 'briefing-text streaming';
          textEl.style.display = '';
          shown = true;
        }
        textEl.textContent = accumulated;
        fullText = accumulated;
      });
      textEl.classList.remove('streaming');
      if (!shown) throw new Error('empty');
      // Cache for today — save to both localStorage and Supabase
      const _briefingObj = { date: todayStr(), text: fullText };
      try { localStorage.setItem('axis_briefing_cache', JSON.stringify(_briefingObj)); } catch(_) {}
      _pushBriefingToSupabase(_briefingObj);
    } catch (_) {
      loadingEl.style.display = 'none';
      textEl.classList.remove('streaming');
      textEl.className = 'briefing-no-key';
      textEl.textContent = 'Could not load briefing — check your connection or try again.';
      textEl.style.display = '';
    } finally {
      if (refreshBtn) {
        refreshBtn.disabled = false;
        setTimeout(function() { refreshBtn.classList.remove('spinning'); }, 700);
      }
    }
  }

  // ── Boot ──────────────────────────────────────────────────────────
  function boot() {
    document.getElementById('aiGreeting').textContent = getGreeting();
    fetchGmailEmails();
    loadBriefing();

    const input   = document.getElementById('chatInput');
    const sendBtn = document.getElementById('chatSend');

    const refreshBtn = document.getElementById('briefingRefresh');
    if (refreshBtn) refreshBtn.addEventListener('click', function() { loadBriefing(true); });

    sendBtn.addEventListener('click', function () { sendMessage(input.value); });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(input.value);
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, { once: true });
  } else {
    boot();
  }
})();
</script>
</body>
</html>
